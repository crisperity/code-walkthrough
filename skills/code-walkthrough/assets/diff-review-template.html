    function editsCard(o){
      const pl=o.payload||{};
      const files=Array.isArray(pl.files)?pl.files:[];
      const d=mk('div','cw-outcome cw-edits'); d.dataset.oid=o.oid; d.dataset.state=o.state;
      if(o.state==='discarded'){ d.append(mk('span','cw-outcome-text','Edits discarded')); return d; }
      const text=mk('span','cw-outcome-text','Agent edited '+files.length+(files.length===1?' file':' files'));
      const sub=[pl.branch,pl.sha?String(pl.sha).slice(0,7):''].filter(Boolean).join(' @ ');
      if(sub) text.append(mk('span','cw-outcome-why',sub));
      d.append(text);
      if(files.length){
        const stat=pl.stat&&typeof pl.stat==='object'?pl.stat:{};
        const ul=mk('ul','cw-edits-files');
        for(const f of files){
          const path=typeof f==='string'?f:(f&&f.path)||'';
          const st=stat[path];
          ul.append(mk('li',null,path+(st!=null&&typeof st!=='object'?'  '+st:'')));
        }
        d.append(ul);
      }
      const hex=/^[0-9a-f]{7,40}$/i;
      const acts=mk('div','cw-task-actions'), btns=[];
      const add=(label,fn)=>{ const b=mkBtn(label,'fb-ghost'); b.addEventListener('click',()=>fn(b)); btns.push(b); acts.append(b); };
      const oidPath=verb=>'/outcomes/'+encodeURIComponent(o.oid)+'/'+verb;
      add('Open updated walkthrough',b=>showSibling(o,b,btns));
      if(hex.test(String(pl.parent))&&hex.test(String(pl.sha)))
        add('Copy cherry-pick',()=>copyTask('git cherry-pick '+String(pl.parent).slice(0,7)+'..'+String(pl.sha).slice(0,7),o.oid));
      add('Discard all agent edits',()=>taskAct(o,oidPath('discard'),{},btns));
      const msg=mk('p','cw-task-msg',taskMsg.get(o.oid)||''); msg.dataset.oid=o.oid; msg.setAttribute('role','status');
      d.append(acts,msg);
      return d;
    }

    function reloadCard(o){
      const d=mk('div','cw-outcome cw-reload'); d.dataset.oid=o.oid; d.dataset.state=o.state;
      if(o.state==='done'){
        const sb=(o.payload||{}).sibling;
        const b=mkBtn('Open updated walkthrough','fb-ghost');
        b.addEventListener('click',()=>openPage(o.oid,sb||{}));
        const msg=mk('p','cw-task-msg',taskMsg.get(o.oid)||''); msg.dataset.oid=o.oid; msg.setAttribute('role','status');
        d.append(b,msg);
      } else if(o.state==='failed') d.append(mk('span','cw-outcome-why','Nothing to show: '+String((o.payload||{}).reason||'no reason given')));
      else d.append(mk('span','cw-outcome-text','Opening the updated walkthrough\u2026'));
      return d;
    }

    const dcPosted=new Set();
    const dcItems=o=>{ const c=o.payload&&o.payload.comments; return Array.isArray(c)?c:[]; };
    const dcId=(o,i)=>'n-'+String(o.oid).replace(/[^0-9a-fA-F]/g,'').slice(0,32)+'-'+i;
    const dcRec=c=>spanByLineKey.get(c.path+'\t'+(c.side==='LEFT'?'LEFT':'RIGHT')+'\t'+c.line);

    function materialiseDrafts(o){
      if(o.outcome!=='draft_comments'||o.state!=='applied') return;
      const ids=[]; let made=false;
      dcItems(o).forEach((c,i)=>{
        const rec=dcRec(c);
        if(!rec) return;
        const id=dcId(o,i);
        ids.push(id);
        if(noteById(id)) return;
        const m=rec.meta||{};
        const note=newDraft({
          id,path:c.path,line:c.line,side:c.side==='LEFT'?'LEFT':'RIGHT',end_line:c.end_line||null,
          hunk_id:m.hunkId||null,anchor_text:m.text||'',anchor_line:c.line,
          order:m.order!=null?m.order:Math.max(0,...state.notes.map(x=>x.order||0))+1,
        });
        note.body=String(c.body||'');
        saveNote(note);
        made=true;
      });
      if(made) renderNotes();
      if(ids.length&&!dcPosted.has(o.oid)){
        dcPosted.add(o.oid);
        postJson('/outcomes/'+encodeURIComponent(o.oid)+'/keep',{note_ids:ids})
          .then(({ok,body})=>{ if(ok&&body.outcome) upsertOutcome(body.outcome); })
          .catch(()=>{});
      }
    }

    function draftCommentsCard(o){
      const items=dcItems(o);
      const d=mk('div','cw-outcome cw-dc'); d.dataset.oid=o.oid; d.dataset.state=o.state;
      if(o.state==='dismissed'){ d.append(mk('span','cw-outcome-text','Drafts removed')); return d; }
      const ids=items.map((c,i)=>dcRec(c)?dcId(o,i):null).filter(Boolean);
      const skipped=items.length-ids.length;
      const text=mk('span','cw-outcome-text','Agent added '+ids.length+(ids.length===1?' draft comment':' draft comments'));
      if(skipped) text.append(mk('span','cw-outcome-why',skipped+' skipped, not on this page'));
      const msg=mk('span','cw-outcome-why',''); msg.setAttribute('role','status');
      text.append(msg);
      d.append(text);
      const acts=mk('div','cw-outcome-actions');
      const show=mkBtn('Show','cw-dc-show fb-ghost');
      show.addEventListener('click',()=>{ const n=ids.map(noteById).find(Boolean); if(n) revealNote(n); });
      show.disabled=!ids.length;
      const rm=mkBtn('Remove these drafts','cw-dc-remove fb-ghost');
      rm.addEventListener('click',()=>{
        rm.disabled=true; msg.textContent='';
        postJson('/outcomes/'+encodeURIComponent(o.oid)+'/dismiss',{})
          .then(({ok,body})=>{
            if(!ok||!body.outcome){ rm.disabled=false; msg.textContent=errText(body); return; }
            const left=ids.filter(id=>{ const n=noteById(id); return n&&n.state!=='draft'; });
            ids.filter(id=>!left.includes(id)).forEach(deleteNote);
            upsertOutcome(body.outcome);
            renderNotes();
            if(left.length) msg.textContent=left.length+' already in your review, left as is';
          })
          .catch(()=>{ rm.disabled=false; msg.textContent=NET_ERR; });
      });
      acts.append(show,rm);
      d.append(acts);
      return d;
    }

    function outcomeEl(t,o){
      if(o.outcome==='draft_comments') return draftCommentsCard(o);
      if(o.outcome==='task') return taskCard(t,o);
      if(o.outcome==='page_edit') return pageEditCard(t,o);
      if(o.outcome==='github_draft') return ghDraftCard(t,o);
      if(o.outcome==='edits') return editsCard(o);
      if(o.outcome==='reload') return reloadCard(o);
      if(o.outcome!=='resolve') return plainOutcomeCard(o,String(o.outcome||'unknown outcome'));
      const id=o.payload&&o.payload.thread;
      const note=noteById(id);
      const where=note?(note.path+':'+(note.line!=null?note.line:'')+(note.author?' by '+note.author:'')):id;
      const d=mk('div','cw-outcome'); d.dataset.oid=o.oid; d.dataset.state=o.state;
      const text=mk('span','cw-outcome-text','Suggests resolving the review thread at '+where);
      text.append(mk('span','cw-outcome-why',(o.payload&&o.payload.why)||''));
      d.append(text);
      const acts=mk('div','cw-outcome-actions');
      if(o.state==='proposed'){
        if(pendingResolveSet.has(id)) acts.append(mk('span',null,'Kept: resolves on Submit review'));
        else {
          const keep=mkBtn('Keep','cw-keep fb-ghost');
          keep.addEventListener('click',()=>{ markPendingResolve(id); renderNotes(); renderThread(t); });
          acts.append(keep);
        }
        const now=mkBtn('Resolve now','cw-resolve-now fb-ghost');
        now.addEventListener('click',()=>{
          now.disabled=true; t.msg.textContent='';
          postJson('/publish-one',{resolve:id,oid:o.oid})
            .then(({ok,body})=>{
              if(!ok){ now.disabled=false; t.msg.textContent=errText(body); return; }
              clearPendingResolve(id);
              upsertOutcome(Object.assign({},o,{state:'done'}));
              renderNotes();
            })
            .catch(()=>{ now.disabled=false; t.msg.textContent=NET_ERR; });
        });
        acts.append(now);
        const dis=mkBtn('Dismiss','cw-dismiss fb-ghost');
        dis.addEventListener('click',()=>{
          dis.disabled=true; t.msg.textContent='';
          postJson('/outcomes/'+encodeURIComponent(o.oid)+'/dismiss',{})
            .then(({ok,body})=>{
              if(!ok){ dis.disabled=false; t.msg.textContent=body.error||'Request failed'; return; }
              clearPendingResolve(id);
              upsertOutcome(Object.assign({},o,body.outcome||{},{state:'dismissed'}));
              renderNotes();
            })
            .catch(()=>{ dis.disabled=false; t.msg.textContent='Request failed -- check the daemon is still running.'; });
        });
        acts.append(dis);
      } else acts.append(mk('span',null,o.state==='done'?'Done':'Dismissed'));
      d.append(acts);
      return d;
    }

    function turnEl(r,t,isLast){
      const d=mk('div','cw-turn'); d.dataset.qid=r.qid;
      const q=mk('p','cw-turn-q');
      for(const p of parseRefText(r.comment||r.question||'')){
        if(p.text!=null){ if(p.text) q.append(document.createTextNode(p.text)); }
        else q.append(chipNode(refFromParsed(p),true));
      }
      if(r.mode==='full') q.append(mk('span','cw-mode-badge','Full'));
      d.append(q);
      if(r.status==='pending'){
        const st=streams.get(r.qid)||{};
        const live=mk('p','cw-turn-a cw-streaming');
        live.dataset.qid=r.qid; live.setAttribute('aria-live','off');
        live.append(mk('span','cw-stream-text',st.text||''),mk('span','cw-caret'));
        live.lastChild.setAttribute('aria-hidden','true');
        const p=mk('p','cw-turn-a cw-working');
        const dots=mk('span','cw-dots'); dots.setAttribute('aria-hidden','true');
        for(let i=0;i<3;i++) dots.appendChild(document.createElement('i'));
        const prog=mk('span','cw-progress',progressText(st.progress)); prog.dataset.qid=r.qid;
        p.append(dots,mk('span',null,'(working)'),stopBtn(t,r),prog);
        d.append(live,p);
        if(r.queued_behind) d.append(mk('p','cw-turn-a cw-queued','Queued behind '+r.queued_behind));
      } else if(r.status==='error'){
        d.append(mk('p','cw-turn-a cw-turn-err','Error: '+(r.error||'unknown')+(r.remedy?' ('+r.remedy+')':'')));
      } else {
        const a=mk('div','cw-turn-a cw-md');
        a.append(mdEl(r.answer||''));
        if(r.status==='cancelled') a.append(mk('span','cw-stopped','(stopped)'));
        d.append(a);
      }
      if(Array.isArray(r.denied)&&r.denied.length){
        const dn=mk('div','cw-denied',null);
        dn.append(mk('p','cw-denied-title','Needs permission'));
        const ul=mk('ul',null);
        for(const x of r.denied) ul.append(mk('li',null,String((x&&x.tool)||'')+(x&&x.detail?' '+x.detail:'')));
        dn.append(ul); d.append(dn);
      }
      if((r.status==='error'||r.status==='cancelled')&&isLast) d.append(retryBtn(t,r));
      for(const o of (outcomesByQid.get(r.qid)||new Map()).values()) d.append(outcomeEl(t,o));
      return d;
    }

    function upsertOutcome(o){
      if(!o||!o.oid||!o.qid) return;
      let m=outcomesByQid.get(o.qid);
      if(!m){ m=new Map(); outcomesByQid.set(o.qid,m); }
      m.set(o.oid,o);
      if(o.outcome==='page_edit') syncPageEdit(o);
      materialiseDrafts(o);
      const t=threads.get(o.thread_id);
      if(t) renderThread(t);
      renderPanelList();
    }

    const ED_MAX=8, edFull=ed=>ed.max+' references max';
    const editors=new Set();
    const isChip=n=>!!(n&&n.nodeType===1&&n.classList.contains('cw-ref'));
    const isTail=n=>!!(n&&n.nodeType===1&&n.hasAttribute('data-cw-tail'));
    const unitLen=n=>n.nodeType===3?n.length:isChip(n)?1:isTail(n)?0:n.nodeName==='BR'?1
      :[...n.childNodes].reduce((s,c)=>s+unitLen(c),0);
    const edLen=el=>[...el.childNodes].reduce((s,c)=>s+unitLen(c),0);
    const toUnits=segs=>segs.flatMap(s=>typeof s==='string'?s.split(''):[s]);
    function fromUnits(u){
      const out=[]; let buf='';
      for(const x of u){
        if(typeof x==='string') buf+=x;
        else { if(buf) out.push(buf); buf=''; out.push(x); }
      }
      if(buf) out.push(buf);
      return out;
    }

    function edSegs(root){
      const out=[]; let buf='';
      const walk=p=>{
        for(const c of p.childNodes){
          if(c.nodeType===3) buf+=c.nodeValue;
          else if(c.nodeType!==1||isTail(c)) continue;
          else if(isChip(c)){
            if(buf){ out.push(buf); buf=''; }
            try{ const r=JSON.parse(c.dataset.ref); if(validRef(r)) out.push(r); }catch(e){}
          }
          else if(c.nodeName==='BR') buf+='\n';
          else walk(c);
        }
      };
      walk(root);
      if(buf) out.push(buf);
      return out;
    }
    const fragModel=frag=>edSegs(frag);

    function unitsBefore(root,node,off,isEnd){
      const chip=asEl(node)&&asEl(node).closest('.cw-ref');
      if(chip&&root.contains(chip)){
        node=chip.parentNode;
        off=[...node.childNodes].indexOf(chip)+(isEnd?1:0);
      }
      const r=document.createRange();
      r.setStart(root,0); r.setEnd(node,off);
      return [...r.cloneContents().childNodes].reduce((s,c)=>s+unitLen(c),0);
    }

    function edSetCaret(ed,units){
      const el=ed.el, sel=getSelection(), kids=el.childNodes;
      if(!sel) return;
      let rem=Math.max(0,units), node=el, off=kids.length;
      for(let i=0;i<kids.length;i++){
        const c=kids[i], n=unitLen(c);
        if(c.nodeType===3){ if(rem<=n){ node=c; off=rem; break; } rem-=n; }
        else if(rem===0){ node=el; off=i; break; }
        else rem-=n;
      }
      const r=document.createRange();
      r.setStart(node,off); r.collapse(true);
      sel.removeAllRanges(); sel.addRange(r);
    }

    function edSel(ed,saved){
      const s=getSelection();
      if(!saved&&s&&s.rangeCount){
        const r=s.getRangeAt(0);
        if(ed.el.contains(r.startContainer)&&ed.el.contains(r.endContainer))
          return {a:unitsBefore(ed.el,r.startContainer,r.startOffset,false),
            b:unitsBefore(ed.el,r.endContainer,r.endOffset,true)};
      }
      const len=edLen(ed.el), c=ed._caret==null?len:Math.min(ed._caret,len);
      return {a:c,b:c};
    }

    const edDraftKey=ed=>lsKey('cw-ed:'+ed.key,state.meta.id);
    function edSave(ed){
      ed._saveT=0;
      try{
        const segs=ed.segs();
        if(segs.length) localStorage.setItem(edDraftKey(ed),JSON.stringify({v:1,segs}));
        else localStorage.removeItem(edDraftKey(ed));
      }catch(e){}
    }
    addEventListener('pagehide',()=>editors.forEach(ed=>{ if(ed._saveT){ clearTimeout(ed._saveT); edSave(ed); } }));
    document.addEventListener('selectionchange',()=>{
      const s=getSelection();
      if(!s||!s.rangeCount) return;
      const host=asEl(s.anchorNode)&&asEl(s.anchorNode).closest('.cw-ed');
      if(host&&host._ed){
        const r=s.getRangeAt(0);
        if(host.contains(r.startContainer)) host._ed._caret=unitsBefore(host,r.startContainer,r.startOffset,false);
      }
    });

    function edChanged(ed){
      if(ed.onChange) ed.onChange();
      clearTimeout(ed._saveT);
      ed._saveT=setTimeout(()=>edSave(ed),300);
    }

    function edRender(ed,segs,caret){
      const kids=segs.map(s=>typeof s==='string'?document.createTextNode(s):chipNode(s));
      const last=segs[segs.length-1];
      if(last&&(typeof last!=='string'||last.endsWith('\n'))){
        const b=document.createElement('br'); b.setAttribute('data-cw-tail','');
        kids.push(b);
      }
      ed.el.replaceChildren(...kids);
      ed._caret=caret;
      if(document.activeElement===ed.el) edSetCaret(ed,caret);
      edChanged(ed);
    }

    function histPush(ed,st){
      const h=ed.hist;
      h.undo.push(st);
      if(h.undo.length>100) h.undo.shift();
      h.redo.length=0; h.t=Date.now();
    }
    function histNote(ed,kind){
      const h=ed.hist;
      if(kind!==h.kind||Date.now()-h.t>700) histPush(ed,{segs:ed.segs(),caret:edSel(ed).a});
      h.kind=kind;
    }
    function edUndo(ed,redo){
      const h=ed.hist, from=redo?h.redo:h.undo, to=redo?h.undo:h.redo;
      if(!from.length) return;
      to.push({segs:ed.segs(),caret:edSel(ed).a});
      const st=from.pop();
      h.kind='op';
      edRender(ed,st.segs,st.caret);
    }

    function edEdit(ed,fn,sel){
      if(ed.locked) return;
      const s=sel&&typeof sel==='object'?sel:edSel(ed,sel===true);
      const segs=ed.segs();
      histPush(ed,{segs,caret:s.a});
      ed.hist.kind='op';
      const [u,caret]=fn(toUnits(segs),s.a,s.b);
      edRender(ed,fromUnits(u),caret);
    }
    const edInsertText=(ed,text)=>edEdit(ed,(u,a,b)=>[u.slice(0,a).concat(text.split(''),u.slice(b)),a+text.length]);

    function edRemoveChip(ed,chip){
      const idx=unitsBefore(ed.el,ed.el,[...ed.el.childNodes].indexOf(chip),false);
      edEdit(ed,u=>[u.slice(0,idx).concat(u.slice(idx+1)),idx]);
    }

    function adjacentChip(ed,dir){
      const s=getSelection();
      if(!s||!s.rangeCount||!s.isCollapsed) return null;
      const el=ed.el, r=s.getRangeAt(0);
      let node=r.startContainer;
      if(node===el){ const c=el.childNodes[dir<0?r.startOffset-1:r.startOffset]; return isChip(c)?c:null; }
      if(node.nodeType!==3||node.parentNode!==el) return null;
      if(dir<0&&r.startOffset===0){
        let p=node.previousSibling;
        while(p&&p.nodeType===3&&!p.length) p=p.previousSibling;
        return isChip(p)?p:null;
      }
      if(dir>0&&r.startOffset===node.length){
        let n=node.nextSibling;
        while(n&&n.nodeType===3&&!n.length) n=n.nextSibling;
        return isChip(n)?n:null;
      }
      return null;
    }
    function edDelAdjacent(ed,dir){
      const c=adjacentChip(ed,dir);
      if(!c) return false;
      edRemoveChip(ed,c);
      return true;
    }

    function edNormalize(ed){
      const el=ed.el, kids=[...el.childNodes];
      if(kids.length===1&&kids[0].nodeName==='BR'){ el.replaceChildren(); ed._caret=0; return; }
      if(kids.some(n=>!(n.nodeType===3||isChip(n)||isTail(n)))){
        const c=edSel(ed).a;
        edRender(ed,fromUnits(toUnits(edSegs(el))),c);
        return;
      }
      const last=el.lastChild;
      if(last&&!isTail(last)&&(isChip(last)||last.nodeValue.endsWith('\n'))){
        const b=document.createElement('br'); b.setAttribute('data-cw-tail','');
        el.append(b);
      }
    }

    function edPaste(ed,text){
      const parts=parseRefText(text);
      let over=false;
      edEdit(ed,(u,a,b)=>{
        let chips=u.filter((x,i)=>typeof x!=='string'&&(i<a||i>=b)).length;
        const ins=[];
        for(const p of parts){
          if(p.text!=null){ for(const ch of p.text.split('')) ins.push(ch); continue; }
          const ref=refFromParsed(p);
          if(chips<ed.max){ chips++; ins.push(ref); }
          else { over=true; for(const ch of refFence(ref).split('')) ins.push(ch); }
        }
        return [u.slice(0,a).concat(ins,u.slice(b)),a+ins.length];
      });
      if(over&&ed.say) ed.say(edFull(ed)+'; the rest stayed as text');
    }

    function edCopyCut(e){
      const sel=getSelection();
      if(!sel||!sel.rangeCount||sel.isCollapsed) return;
      const range=sel.getRangeAt(0).cloneRange();
      const host=asEl(range.commonAncestorContainer);
      if(!host||!panel.contains(host)) return;
      const s=asEl(range.startContainer).closest('.cw-ref'), t=asEl(range.endContainer).closest('.cw-ref');
      if(s) range.setStartBefore(s);
      if(t) range.setEndAfter(t);
      const frag=range.cloneContents();
      const hostEd=host.closest('.cw-ed');
      if(!hostEd&&!frag.querySelector('.cw-ref')) return;
      e.clipboardData.setData('text/plain',serializeSegs(fragModel(frag)));
      e.preventDefault();
      if(e.type==='cut'&&hostEd&&hostEd._ed){
        const ed=hostEd._ed;
        const a=unitsBefore(ed.el,range.startContainer,range.startOffset,false);
        const b=unitsBefore(ed.el,range.endContainer,range.endOffset,true);
        edEdit(ed,u=>[u.slice(0,a).concat(u.slice(b)),a],{a,b});
      }
    }

    function refLabelOf(a){
      if(a.kind==='line') return a.path.split('/').pop()+':'+a.line+(a.end_line?'-'+a.end_line:'');
      if(a.kind==='block'){ const el=blockIndex().byKey.get(a.block); return el?proseLabel(el):(a.section||'page'); }
      return a.kind==='thread'?'review thread':(a.section||'page');
    }

    function anchorFromParsed(p){
      const h=p.ref;
      if(h.kind==='line'){
        const key=n=>h.path+'\t'+h.side+'\t'+n;
        const rec=spanByLineKey.get(key(h.line));
        let quote=p.body;
        if(!quote){
          const rows=[];
          for(let n=h.line;n<=refEnd(h);n++){ const r=spanByLineKey.get(key(n)); if(r) rows.push(r.meta.text); }
          quote=rows.join('\n')||h.path+':'+h.line;
        }
        return {kind:'line',path:h.path,side:h.side,line:h.line,end_line:h.end_line,
          hunk_id:rec&&rec.meta.hunkId||null,quote};
      }
      const el=blockIndex().byKey.get(h.block)||null;
      const section=(el&&sectionHeadingOf(el))||(h.label&&h.label.split(' · ')[0])||null;
      const quote=p.body||(el&&norm(textOf(el)).slice(0,500))||h.label||h.block;
      return {kind:'block',block:h.block,section,quote};
    }
    function refFromParsed(p){
      const anchor=anchorFromParsed(p);
      return {anchor,label:p.ref.label||refLabelOf(anchor)};
    }

    function chipRows(a){
      if(a.kind!=='line') return mk('span','cw-ref-quote',a.quote);
      const wrap=mk('span','cw-ref-lines diff'), key=n=>a.path+'\t'+a.side+'\t'+n;
      let found=false;
      for(let n=a.line;n<=refEnd(a);n++){
        const rec=spanByLineKey.get(key(n));
        if(!rec) continue;
        found=true;
        const f=rec.meta.text[0], row=mk('span',f==='+'?'a':f==='-'?'d':'c');
        for(const c of rec.span.childNodes){
          if(c.nodeType===1&&c.matches('.dline-plus,.cw-ref-dot-btn')) continue;
          row.append(c.cloneNode(true));
        }
        wrap.append(row);
      }
      if(found) return wrap;
      let num=a.line;
      for(const text of String(a.quote).split('\n')){
        const cls=text[0]==='+'?'a':text[0]==='-'?'d':'c';
        const shown=a.side==='RIGHT'?cls!=='d':cls!=='a';
        wrap.append(rowEl({text,cls,num:shown?num++:null}));
      }
      return wrap;
    }

    function openChip(chip){
      const tag=chip.firstChild;
      let body=chip.querySelector('.cw-ref-body');
      const open=!body||body.hidden;
      if(!body){
        let ref;
        try{ ref=JSON.parse(chip.dataset.ref); }catch(e){ return; }
        if(!validRef(ref)) return;
        body=mk('span','cw-ref-body');
        const acts=mk('span','cw-ref-acts');
        const copy=mkBtn('Copy'), fold=mkBtn('Collapse');
        copy.addEventListener('click',()=>{
          const t=refFence(ref);
          if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(()=>legacyCopy(t));
          else legacyCopy(t);
        });
        fold.addEventListener('click',()=>openChip(chip));
        acts.append(copy,fold);
        if(!chip.classList.contains('cw-ref-ro')){
          const rm=mkBtn('Remove');
          rm.addEventListener('click',()=>{ const host=chip.closest('.cw-ed'); if(host&&host._ed) edRemoveChip(host._ed,chip); });
          acts.append(rm);
        }
        body.append(chipRows(ref.anchor),acts);
        chip.append(body);
      }
      body.hidden=!open;
      tag.setAttribute('aria-expanded',String(open));
      chip.classList.toggle('cw-ref-open',open);
    }

    function threadRef(root){
      if(!root||!root.path||!root.line) return null;
      const anchor={kind:'line',path:root.path,side:root.side==='LEFT'?'LEFT':'RIGHT',line:root.line,end_line:null,
        hunk_id:root.hunk_id||null,quote:String(root.body||'').slice(0,200)||root.path+':'+root.line};
      const ref={anchor,label:refLabelOf(anchor)};
      return validRef(ref)?ref:null;
    }

    function chipNode(ref,ro){
      const c=mk('span','cw-ref'+(ro?' cw-ref-ro':''));
      c.setAttribute('contenteditable','false'); c.draggable=false;
      c.dataset.ref=JSON.stringify(ref);
      const tag=mkBtn('⧉ '+(ref.label||refLabelOf(ref.anchor)),'cw-ref-tag');
      tag.tabIndex=0; tag.setAttribute('aria-expanded','false');
      tag.addEventListener('click',()=>{ openChip(c); if(ro&&!sheetQ.matches) revealAnchor(ref.anchor); });
      c.append(tag);
      return c;
    }

    const validRef=s=>{
      const a=s&&s.anchor;
      if(!a||typeof a!=='object'||typeof a.quote!=='string'||(s.label!=null&&typeof s.label!=='string')) return false;
      if(a.kind==='line') return typeof a.path==='string'&&!!a.path&&(a.side==='LEFT'||a.side==='RIGHT')
        &&Number.isInteger(a.line)&&a.line>=1
        &&(a.end_line==null||(Number.isInteger(a.end_line)&&a.end_line>a.line&&a.end_line-a.line<REF_MAX_ROWS));
      return a.kind==='block'&&typeof a.block==='string'&&!!a.block;
    };

    function makeEditor({key,placeholder}){
      const el=mk('div','cw-ed');
      try{ el.contentEditable='plaintext-only'; }catch(e){}
      if(el.contentEditable!=='plaintext-only') el.contentEditable='true';
      el.setAttribute('role','textbox'); el.setAttribute('aria-multiline','true');
      el.setAttribute('aria-label',placeholder); el.dataset.placeholder=placeholder;
      const ed={el,key,hist:{undo:[],redo:[],t:0,kind:''},_caret:null,_saveT:0,max:ED_MAX,locked:false,onChange:null,onSend:null,say:null};
      el._ed=ed;
      ed.segs=()=>edSegs(el);
      ed.setSegs=(segs,caret)=>{ const s=fromUnits(toUnits(segs)); edRender(ed,s,caret==null?toUnits(s).length:caret); };
      ed.refs=()=>ed.segs().filter(s=>typeof s!=='string');
      ed.isEmpty=()=>ed.segs().every(s=>typeof s==='string'&&!s.trim());
      ed.insertRef=(ref,atSavedCaret)=>{
        if(ed.locked) return false;
        if(ed.refs().length>=ed.max){ if(ed.say) ed.say(edFull(ed)); return false; }
        edEdit(ed,(u,a,b)=>[u.slice(0,a).concat([ref,' '],u.slice(b)),a+2],atSavedCaret===true);
        return true;
      };
      ed.clear=()=>{
        ed.hist.undo.length=0; ed.hist.redo.length=0;
        el.replaceChildren(); ed._caret=0;
        if(ed.onChange) ed.onChange();
        clearTimeout(ed._saveT); edSave(ed);
      };
      const editMode=el.contentEditable;
      ed.lock=on=>{
        if(on){ ed.wasFocused=document.activeElement===el; if(ed.wasFocused) ed._caret=edSel(ed).a; }
        ed.locked=on;
        el.contentEditable=on?'false':editMode;
        if(on) el.setAttribute('aria-busy','true'); else el.removeAttribute('aria-busy');
        if(!on&&ed.wasFocused) ed.focus();
      };
      ed.focus=()=>{ el.focus(); edSetCaret(ed,ed._caret==null?edLen(el):ed._caret); };

      el.addEventListener('keydown',e=>{
        if(e.isComposing||e.keyCode===229) return;
        const mod=e.ctrlKey||e.metaKey, k=e.key.toLowerCase();
        if(mod&&!e.altKey&&k==='z'){ e.preventDefault(); edUndo(ed,e.shiftKey); return; }
        if(e.ctrlKey&&!e.metaKey&&k==='y'){ e.preventDefault(); edUndo(ed,true); return; }
        if(e.key==='Enter'){
          e.preventDefault();
          if(mod){ if(ed.onSend) ed.onSend(); } else edInsertText(ed,'\n');
          return;
        }
        if(e.key==='Backspace'&&edDelAdjacent(ed,-1)) e.preventDefault();
        else if(e.key==='Delete'&&edDelAdjacent(ed,1)) e.preventDefault();
      });
      el.addEventListener('beforeinput',e=>{
        const t=e.inputType;
        if(t==='historyUndo'||t==='historyRedo'){ e.preventDefault(); edUndo(ed,t==='historyRedo'); return; }
        if(e.isComposing) return;
        if(t==='insertParagraph'||t==='insertLineBreak'){ e.preventDefault(); edInsertText(ed,'\n'); return; }
        if(t==='deleteContentBackward'&&edDelAdjacent(ed,-1)){ e.preventDefault(); return; }
        if(t==='deleteContentForward'&&edDelAdjacent(ed,1)){ e.preventDefault(); return; }
        histNote(ed,/^delete/.test(t)?'del':'ins');
      });
      el.addEventListener('input',e=>{
        if(e.isComposing) return;
        if(ed.say) ed.say('');
        edNormalize(ed); edChanged(ed);
      });
      el.addEventListener('compositionstart',()=>{ ed._pre={segs:ed.segs(),caret:edSel(ed).a}; });
      el.addEventListener('compositionend',()=>{
        if(ed._pre){ histPush(ed,ed._pre); ed._pre=null; ed.hist.kind='op'; }
        edNormalize(ed); edChanged(ed);
      });
      el.addEventListener('paste',e=>{
        e.preventDefault();
        const text=e.clipboardData&&e.clipboardData.getData('text/plain');
        if(text) edPaste(ed,text);
      });
      el.addEventListener('drop',e=>e.preventDefault());

      try{
        const d=JSON.parse(localStorage.getItem(edDraftKey(ed))||'null');
        if(d&&d.v===1&&Array.isArray(d.segs)){
          const ok=d.segs.map(s=>typeof s==='string'||validRef(s)?s:s&&s.anchor&&typeof s.anchor.quote==='string'?s.anchor.quote:'');
          if(ok.length) ed.setSegs(ok);
        }
      }catch(e){}
      editors.add(ed);
      return ed;
    }

    const QUESTION_MAX=2000;
    const anchorKey=a=>JSON.stringify([a.kind,a.path,a.side,a.line,a.end_line||null,a.block]);
    function dedupeAnchors(list){
      const seen=new Set();
      return list.filter(a=>{ const k=anchorKey(a); if(seen.has(k)) return false; seen.add(k); return true; });
    }

    function threadComposer(view){
      const ed=view.editor;
      const box=mk('div','cw-compose'); box.dataset.mode='agent';
      const send=mkBtn('Send','cw-send fb-primary');
      const row=mk('div','fb-actions'); row.append(send);
      const note=mk('p','cw-compose-note'); note.append(mk('span','cw-compose-hint','Ctrl+Enter sends'));
      const status=mk('p','cw-compose-status'); status.setAttribute('role','status');
      box.append(ed.el,row,note,status);
      const c={box,send,status,busy:false,sync:()=>{ send.disabled=c.busy||ed.isEmpty(); }};
      ed.onChange=c.sync;
      ed.onSend=()=>sendView(view);
      ed.say=m=>{ if(m||!c.busy) status.textContent=m; };
      send.addEventListener('click',()=>sendView(view));
      c.sync();
      return c;
    }

    function sendView(view){
      const ed=view.editor, c=view.composer;
      if(c.busy||ed.isEmpty()) return;
      const segs=ed.segs();
      if(segs.filter(s=>typeof s==='string').join('').length>QUESTION_MAX){
        c.status.textContent='Too long: keep the text under '+QUESTION_MAX+' characters (references do not count).';
        return;
      }
      const chips=segs.filter(s=>typeof s!=='string').map(r=>r.anchor);
      const anchors=dedupeAnchors(view.seed?[view.seed,...chips]:chips);
      if(anchors.length>ED_MAX){ c.status.textContent='Too many references: '+ED_MAX+' max in total.'; return; }
      const body={text:serializeSegs(segs).trim(),anchors};
      if(threads.has(view.id)) body.thread_id=view.id;
      c.busy=true; c.sync(); ed.lock(true); c.status.textContent='Sending…';
      const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),30000);
      fetch(window.CW_LIVE.api+'/comment',{method:'POST',headers:headers(),body:JSON.stringify(body),signal:ctl.signal})
        .then(r=>r.json().catch(()=>({})).then(b=>({ok:r.ok,b})))
        .then(({ok,b})=>{
          c.busy=false; ed.lock(false);
          if(!ok){ c.sync(); c.status.textContent=(b.error||'Request failed')+(b.remedy?' ('+b.remedy+')':''); return; }
          ed.clear(); c.status.textContent=''; c.sync();
          if(!threads.has(view.id)) openThreadWhenReady(b.thread_id);
        })
        .catch(e=>{ c.busy=false; ed.lock(false); c.sync();
          c.status.textContent=(e&&e.name==='AbortError'?'Timed out':'Request failed -- check the daemon is still running')+'. Your text is kept: press Send to retry.'; })
        .finally(()=>clearTimeout(timer));
    }

    function buildThread(t){
      t.el=mk('div','cw-thread'); t.el.dataset.thread=t.id;
      const head=mk('div','cw-thread-head');
      t.badge=mk('span','cw-th-badge','Resolved');
      t.triageTag=mk('span','cw-th-triage','triage'); t.triageTag.hidden=true;
      t.resolveBtn=mkBtn('Resolve','cw-th-resolve fb-ghost');
      head.append(t.badge,t.triageTag,t.resolveBtn);
      t.msg=mk('p','cw-compose-status'); t.msg.setAttribute('role','status');
      t.body=mk('div','cw-thread-body');
      t.turnsEl=mk('div','cw-turns');
      t.editor=makeEditor({key:t.id,placeholder:'Reply in this thread'});
      t.composer=threadComposer(t);
      t.body.append(t.turnsEl);
      t.el.append(head,t.msg,t.body);
      t.resolveBtn.addEventListener('click',()=>{
        t.msg.textContent='';
        const want=!t.resolved;
        fetch(window.CW_LIVE.api+'/threads/'+encodeURIComponent(t.id)+'/resolve',
          {method:'POST',headers:headers(),body:JSON.stringify({resolved:want})})
          .then(r=>r.json().catch(()=>({})).then(body=>({ok:r.ok,body})))
          .then(({ok,body})=>{
            if(!ok){ t.msg.textContent=body.error||'Request failed'; return; }
            applyResolve(t.id,want);
          })
          .catch(()=>{ t.msg.textContent='Request failed -- check the daemon is still running.'; });
      });
    }

    function threadTitle(t){
      const f=t.turns[0]||{};
      const s=parseRefText(f.comment||f.question||'').map(p=>p.text!=null?p.text:'\u29c9 '+refFromParsed(p).label).join(' ');
      return s.replace(/\s+/g,' ').trim().slice(0,100);
    }
    function renderThread(t){
      if(!t.el) buildThread(t);
      const first=t.turns[0]||{};
      t.el.dataset.state=stateOf(t);
      t.resolveBtn.textContent=t.resolved?'Reopen':'Resolve';
      t.badge.hidden=!t.resolved;
      t.triageTag.hidden=first.source!=='triage';
      t.turnsEl.replaceChildren(...t.turns.map((r,i)=>turnEl(r,t,i===t.turns.length-1)));
    }

    function refEls(a){
      if(a.kind!=='line') return [placementFor(a)].filter(Boolean);
      const out=[];
      for(let n=a.line;n<=refEnd(a);n++){
        const rec=spanByLineKey.get(a.path+'\t'+a.side+'\t'+n);
        if(rec) out.push(rec.span);
      }
      return out;
    }
    let dotOf=new Map();
    function markThreadRefs(){
      const next=new Map();
      for(const t of threads.values()) for(const r of t.turns) for(const a of turnRefs(r)) for(const el of refEls(a)) next.set(el,t.id);
      dotOf=next;
      for(const [el,tid] of next){
        el.classList.add('cw-ref-dot'); el.dataset.cwSent='1';
        if(!el.classList.contains('dline')) continue;
        let b=el.querySelector('.cw-ref-dot-btn');
        if(!b){
          b=document.createElement('button'); b.type='button'; b.className='cw-ref-dot-btn'; b.tabIndex=-1;
          b.addEventListener('mousedown',e=>e.preventDefault());
          b.addEventListener('click',e=>{ e.stopPropagation(); openPanel({thread:dotOf.get(el)}); });
          el.append(b);
        }
        b.setAttribute('aria-label','Open thread: '+threadTitle(threads.get(tid)));
      }
    }

    const earlyResolve=new Map();
    let pendingOpen=null;
    function upsertTurn(r,fromSnapshot){
      if(!r||!r.thread_id) return;
      let t=threads.get(r.thread_id);
      const isNew=!t;
      if(isNew){ t={id:r.thread_id,turns:[],resolved:earlyResolve.get(r.thread_id)===true,el:null}; threads.set(t.id,t); earlyResolve.delete(t.id); }
      const i=t.turns.findIndex(x=>x.qid===r.qid);
      if(fromSnapshot&&i>=0&&r.status==='pending'&&t.turns[i].status!=='pending') return;
      if(r.status!=='pending') streams.delete(r.qid);
      if(i<0) t.turns.push(r); else t.turns[i]=r;
      renderThread(t);
      if(isNew){
        syncThreadEdits(t.id);
        renderThread(t);
      }
      markThreadRefs();
      renderPanelList();
      if(isNew&&pendingOpen===t.id){ pendingOpen=null; openPanel({thread:t.id}); }
    }

    function applyResolve(tid,resolved){
      const t=threads.get(tid);
      if(!t){ earlyResolve.set(tid,!!resolved); return; }
      t.resolved=!!resolved;
      renderThread(t);
      renderPanelList();
    }

    window.__cwOnThread=ev=>{
      if(!ev) return;
      if(ev.kind==='turn') upsertTurn(ev.record);
      else if(ev.kind==='resolve') applyResolve(ev.thread_id,ev.resolved);
    };

    window.__cwOnDelta=d=>{
      if(!d||!d.qid) return;
      let st=streams.get(d.qid);
      if(!st){ st={seq:0,text:'',progress:null}; streams.set(d.qid,st); }
      if(typeof d.seq==='number'&&d.seq<=st.seq) return;
      st.seq=d.seq; st.text+=d.text||'';
      const els=streamElsOf(d.qid);
      if(els.length) els.forEach(e=>{ e.firstChild.textContent=st.text; });
      else { const t=threads.get(d.thread_id); if(t&&t.el&&t.el.isConnected) renderThread(t); }
    };
    window.__cwOnProgress=d=>{
      if(!d||!d.qid) return;
      let st=streams.get(d.qid);
      if(!st){ st={seq:0,text:'',progress:null}; streams.set(d.qid,st); }
      st.progress={tool:d.tool,detail:d.detail};
      progressElsOf(d.qid).forEach(e=>{ e.textContent=progressText(st.progress); });
    };
    function pageEditToast(o){
      const msg={set textContent(t){ if(t) toast(t); }};
      toast('Page edited by agent',[
        {label:'Undo',run:()=>pageEditAct(o.oid,'revert',{},msg)},
        {label:'Open thread',run:()=>openPanel({thread:o.thread_id})}]);
    }
    window.__cwOnOutcome=o=>{
      const prev=o&&o.oid&&findOutcome(o.oid);
      upsertOutcome(o);
      if(o&&o.outcome==='page_edit'&&o.state==='applied'&&!prev) pageEditToast(o);
    };
    let snapshots=0;
    window.__cwOnSnapshot=d=>{
      streams.clear();
      ((d&&d.turns)||[]).forEach(x=>streams.set(x.qid,{seq:x.seq||0,text:x.text||'',progress:x.progress||null}));
      for(const t of threads.values()) if(t.turns.some(r=>r.status==='pending')) renderThread(t);
      if(snapshots++>0) loadQa();
    };

    const toastEl=mk('div'); toastEl.id='cw-toast'; toastEl.setAttribute('role','status');
    document.body.appendChild(toastEl);
    let toastTimer=null;
    function toast(text,actions){
      const kids=[mk('span',null,text)];
      for(const a of actions||[]){
        const b=mkBtn(a.label,'cw-toast-act');
        b.addEventListener('click',()=>{ toastEl.replaceChildren(); a.run(); });
        kids.push(b);
      }
      toastEl.replaceChildren(...kids);
      const arm=()=>{
        clearTimeout(toastTimer);
        toastTimer=setTimeout(()=>{ if(toastEl.matches(':focus-within')) arm(); else toastEl.replaceChildren(); },6000);
      };
      arm();
    }

    const PW_MIN=320, pwMax=()=>Math.min(innerWidth*0.7,760);

      w=Math.round(Math.max(PW_MIN,Math.min(pwMax(),w)));
      rootEl.style.setProperty('--cw-panel-w',w+'px');
      resizer.setAttribute('aria-valuenow',String(w));
      if(save){ try{ localStorage.setItem(pwKey,String(w)); }catch(e){} }
    }
    try{
      const saved=parseInt(localStorage.getItem(pwKey),10);
      if(saved>0) setPanelW(saved,false);
    }catch(e){}
    resizer.addEventListener('pointerdown',e=>{
      e.preventDefault(); resizer.setPointerCapture(e.pointerId); resizer.classList.add('cw-dragging');

      if(resizer.hasPointerCapture(e.pointerId)) setPanelW(innerWidth-e.clientX,false);

      if(!resizer.hasPointerCapture(e.pointerId)) return;

      setPanelW(panel.getBoundingClientRect().width,true);

    resizer.addEventListener('pointerup',endDrag);

    resizer.addEventListener('keydown',e=>{
      const cur=panel.getBoundingClientRect().width;

      else if(e.key==='ArrowRight') setPanelW(cur-24,true);

        resizer.removeAttribute('aria-valuenow');

      e.preventDefault();
    });
    panel.addEventListener('copy',edCopyCut);
    panel.addEventListener('cut',edCopyCut);

    const NEW='new';
    const newView={id:null};
    newView.editor=makeEditor({key:NEW,placeholder:'Ask the agent anything, or paste references'});
    newView.composer=threadComposer(newView);
    let newViewDirty=false;
    {
      const sync=newView.editor.onChange;
      newView.editor.onChange=()=>{ sync(); if(newViewDirty!==!newView.editor.isEmpty()) renderPanelList(); };
    }
    newView.hint=mk('p','hr-comments-empty','Ask the agent anything. References are optional.');
    const seeds=new Map();
    const viewOf=key=>threads.get(key)||(key===NEW?newView:seeds.get(key))||null;
    let panelView=null, panelOpener=null, panelLabel='Threads';
    const panelOpen=()=>!panel.hidden;
    function setSheet(s){ panel.dataset.sheet=s; grab.setAttribute('aria-expanded',String(s==='expanded')); }
    setSheet('collapsed');
    grab.addEventListener('click',()=>setSheet(panel.dataset.sheet==='expanded'?'collapsed':'expanded'));

    function paintPanelHead(){
      const t=panelView&&threads.get(panelView);
      const v=viewOf(panelView);
      pTitle.textContent=panelView===NEW?'New thread':t?threadTitle(t)||'Thread':v?'Ask about a review thread':panelLabel;
      grabText.textContent=panelLabel;
    }
    function showView(tid){
      const t=tid&&threads.get(tid), v=viewOf(tid);
      panelView=v?tid:null;
      pList.hidden=!!v; pThread.hidden=!v; pBack.hidden=!v;
      if(v){
        if(t) renderThread(t);
        pBody.replaceChildren(t?t.el:v.hint); pCompose.replaceChildren(v.composer.box); pBody.scrollTop=pBody.scrollHeight;
      }
      else { pBody.replaceChildren(); pCompose.replaceChildren(); }
      renderPanelList();
    }
    function openPanel(view,opts){
      const a=document.activeElement;
      if(a&&a!==document.body&&!panel.contains(a)) panelOpener=a;
      panel.hidden=false;
      rootEl.classList.add('cw-panel-open');
      dock.setAttribute('aria-expanded','true');
      setSheet('expanded');
      showView(view&&(view.new?NEW:view.thread));
      if(opts&&opts.focus===false) return;
      const v=viewOf(panelView);
      (sheetQ.matches?(v?pBack:pClose):v?v.editor:filterBtns.get(panelFilter)).focus();
    }
    function closePanel(){
      if(!panelOpen()) return;
      panel.hidden=true;
      rootEl.classList.remove('cw-panel-open');
      dock.setAttribute('aria-expanded','false');
      const o=panelOpener; panelOpener=null;
      (visible(o)?o:dock).focus();
    }
    const togglePanel=()=>panelOpen()?closePanel():openPanel(panelView?{thread:panelView}:null);
    pClose.addEventListener('click',closePanel);
    pNew.addEventListener('click',()=>openPanel({new:true}));
    pBack.addEventListener('click',()=>{
      const id=panelView;
      showView(null);
      (pRows.querySelector('button[data-key="'+id+'"]')||pClose).focus();
    });

    function openThreadWhenReady(tid){
      if(!tid) return;
      if(threads.has(tid)) openPanel({thread:tid}); else pendingOpen=tid;
    }

    function flashEl(el){
      const dline=el.classList.contains('dline');
      const cls=dline?'vd-flash-line':'cw-flash';
      el.classList.add(cls);
      setTimeout(()=>el.classList.remove(cls),dline?1400:1200);
    }
    function revealEl(el){
      openAncestorDetails(el);
      el.scrollIntoView({block:'center'});
      flashEl(el);
    }
    function revealAnchor(a){
      const el=a&&a.kind!=='free'&&placementFor(a);
      if(!el) return false;
      revealEl(el);
      return true;
    }
    function revealNote(n){
      const byId=new Map(state.notes.map(x=>[x.id,x]));
      const root=groupThreads(orderThreaded(state.notes),byId).find(g=>g.notes.includes(n)).root;
      const el=(rowById.get(n.id)||{}).el||(threadWrapByRoot.get(root.id)||{}).el||strayCardByRoot.get(root.id)
        ||(spanByLineKey.get(n.path+'\t'+n.side+'\t'+n.line)||{}).span;
      if(!el) return;
      if(sheetQ.matches) setSheet('collapsed');
      revealEl(el);
    }

    function renderPanelList(){
      const all=[...threads.values()];
      const outcomes=[...outcomesByQid.values()].flatMap(m=>[...m.values()]);
      const waiting=waitingCount(outcomes);
      const turnsByNote=new Map();
      for(const t of all){
        const a=(t.turns[0]||{}).anchor;
        if(a&&a.kind==='thread') turnsByNote.set(a.note_id,(turnsByNote.get(a.note_id)||[]).concat(t.turns));
      }
      const cand=(state.meta&&state.meta.pr)?triageCandidates(state.notes,turnsByNote).length:0;
      triageBtn.hidden=!cand;
      triageBtn.textContent='Triage '+plural(cand,'open thread');
      const focused=pRows.contains(document.activeElement)&&document.activeElement.dataset.key;
      const entries=[];
      newViewDirty=!newView.editor.isEmpty();
      if(newViewDirty) entries.push({kind:'agent',key:NEW,state:'draft',title:'New thread (draft)',meta:['draft'],
        go:()=>openPanel({new:true})});
      for(const t of all){
        const first=t.turns[0]||{}, st=stateOf(t);
        const w=waitingCount(outcomes.filter(o=>o.thread_id===t.id));
        entries.push({kind:'agent',key:t.id,state:st,title:threadTitle(t),
          meta:[st],badge:w?w+' waiting':'',full:(t.turns[t.turns.length-1]||{}).mode==='full',
          go:()=>{ openPanel({thread:t.id}); revealAnchor((first.anchors&&first.anchors[0])||first.anchor); }});
      }
      const byId=new Map(state.notes.map(n=>[n.id,n]));
      const where=n=>n.path+(n.line!=null?':'+n.line:'');
      const isDraft=n=>n.origin==='local'&&n.state==='draft';
      for(const n of orderThreaded(state.notes)){
        if(isDraft(n)) entries.push({kind:'draft',key:n.id,state:'draft',title:firstLine(n.body)||'(empty draft)',
          meta:['draft',where(n)],go:()=>revealNote(n)});
      }
      for(const g of groupThreads(orderThreaded(state.notes),byId)){
        if(isDraft(g.root)) continue;
        const r=g.root, replies=g.notes.length-1;
        const resolved=!!r.resolved||pendingResolveSet.has(r.id);
        entries.push({kind:'pr',key:r.id,state:resolved?'resolved':'open',title:firstLine(r.body)||'(no text)',
          meta:[r.author||'you',where(r)].concat(replies?[replies+(replies===1?' reply':' replies')]:[]),
          go:()=>revealNote(r)});
      }
      const counts=panelCounts(entries), open=counts.all;
      panelLabel='Threads ('+open+')'+(waiting?' · '+waiting+' wait for you':'');
      dockView={open,waiting,label:panelLabel}; paintDock();
      const inFilter=(e,k)=>k==='all'||e.kind===(k==='drafts'?'draft':k);
      const FILTER_LABEL={all:'All',agent:'Agent',pr:'PR',drafts:'Drafts'};
      for(const [k,b] of filterBtns){
        b.textContent=FILTER_LABEL[k]+' '+counts[k];
        b.setAttribute('aria-pressed',String(k===panelFilter));
      }
      const shown=entries.filter(e=>inFilter(e,panelFilter))
        .sort((a,b)=>(a.state==='resolved'?1:0)-(b.state==='resolved'?1:0));
      const rows=shown.map(e=>{
        const go=mkBtn(null,'cw-pr-row'); go.dataset.key=e.key; go.dataset.kind=e.kind; go.dataset.state=e.state;
        const meta=mk('span','cw-pr-meta',e.meta.join(' \u00b7 '));
        if(e.badge) meta.append(mk('span','cw-dock-badge yellow',e.badge));
        if(e.full) meta.append(mk('span','cw-mode-badge','Full'));
        go.append(mk('span','cw-pr-title',e.title||'(no text)'),meta);
        go.addEventListener('click',e.go);
        const li=document.createElement('li'); li.append(go);
        return li;
      });
      if(!rows.length) rows.push(mk('li','hr-comments-empty',panelFilter==='all'
        ?'No threads yet. Press + beside a diff line to comment, or select lines or prose to ask the agent.'
        :'Nothing here yet.'));
      pRows.replaceChildren(...rows);
      if(focused){ const r=pRows.querySelector('button[data-key="'+focused+'"]'); if(r) r.focus(); }
      paintPanelHead();
    }

    const vv=window.visualViewport;
    function syncVV(){
      rootEl.style.setProperty('--cw-vvh',vv.height+'px');
      rootEl.style.setProperty('--cw-kb',Math.max(0,innerHeight-vv.height-vv.offsetTop)+'px');
    }
    if(vv){ vv.addEventListener('resize',syncVV); vv.addEventListener('scroll',syncVV); syncVV(); }

    dock.setAttribute('aria-controls','cw-panel'); dock.setAttribute('aria-expanded','false');
    dock.removeAttribute('aria-haspopup');
    dock.addEventListener('click',()=>{ togglePanel(); });
    refreshPanelSubmit();
    renderPanelList();
    const refreshInline=refreshCommentsPanel;
    refreshCommentsPanel=()=>{ refreshInline(); renderPanelList(); };

    function diffSel(){
      const sel=window.getSelection();
      if(!sel||sel.isCollapsed||!sel.rangeCount) return null;
      const r=sel.getRangeAt(0);
      const last=selectionEndRow(r);
      const sm=lineMetaBySpan.get(closestDline(r.startContainer)), em=lineMetaBySpan.get(last);
      return sm&&em?{sel,sm,em,last}:null;
    }

    let selLast=null, selBand=[], gutterAnchor=null, gutterDrag=null, rangeHeld=false;
    function markSelectedLine(d){
      if(selLast&&(!d||d.last!==selLast)){
        selLast.classList.remove('dline-sel-last');
        selLast.querySelector('.dline-plus').removeAttribute('title');
        selLast=null;
      }
      let rows=[];
      if(d){
        const s=closestDline(d.sel.getRangeAt(0).startContainer);
        for(let n=s;n;n=n.nextElementSibling){ if(n.classList.contains('dline')) rows.push(n); if(n===d.last) break; }
        if(rows[rows.length-1]!==d.last) rows=[d.last];
      }
      for(const n of selBand) if(!rows.includes(n)) n.classList.remove('dline-in-sel');
      for(const n of rows) n.classList.add('dline-in-sel');
      selBand=rows;
      if(!d) return;
      selLast=d.last;
      selLast.classList.add('dline-sel-last');
      const plus=selLast.querySelector('.dline-plus');
      if(d.sm.line!==d.em.line) plus.title='Comment on lines '+d.sm.line+'-'+d.em.line;
      else plus.removeAttribute('title');
    }

    const selBar=mk('div'); selBar.id='cw-selbar'; selBar.hidden=true;
    selBar.setAttribute('role','toolbar'); selBar.setAttribute('aria-label','Selection');
    const sbWhat=mk('span'); sbWhat.id='cw-selbar-what';
    const sbTarget=document.createElement('select'); sbTarget.id='cw-selbar-target';
    sbTarget.setAttribute('aria-label','Add to thread');
    const sbAdd=mkBtn('Add'); sbAdd.id='cw-selbar-add'; sbAdd.title='Add to thread (Alt+Enter focuses this button)';
    selBar.append(sbWhat,sbTarget,sbAdd);
    document.body.appendChild(selBar);
    sbAdd.addEventListener('mousedown',e=>e.preventDefault());
    let sbAnchor=null, sbReturn=null;
    const selBarShown=()=>!selBar.hidden;
    function hideSelBar(){ selBar.hidden=true; sbAnchor=null; }
    function clearSelection(){
      stopDrag(); gutterAnchor=null; rangeHeld=false;
      const sel=window.getSelection();
      if(sel) sel.removeAllRanges();
      markSelectedLine(null);
      const hadFocus=selBar.contains(document.activeElement);
      hideSelBar();
      if(hadFocus&&sbReturn&&sbReturn.isConnected) sbReturn.focus();
      sbReturn=null;
    }
    document.addEventListener('keydown',e=>{
      if(!e.altKey||e.key!=='Enter'||e.isComposing||!selBarShown()) return;
      e.preventDefault();
      if(!selBar.contains(document.activeElement)) sbReturn=document.activeElement;
      sbAdd.focus();
    });

    function placeSelBar(range){
      const s=selBar.style;
      if(sheetQ.matches){ s.left=s.top=''; return; }
      const rects=range.getClientRects();
      const first=rects.length?rects[0]:range.getBoundingClientRect();
      const last=rects.length?rects[rects.length-1]:first;
      const w=selBar.offsetWidth, h=selBar.offsetHeight;
      const rightEdge=(panelOpen()?panel.getBoundingClientRect().left:innerWidth)-8;
      const reserve=64;
      let top=last.bottom+6;
      if(top+h>innerHeight-reserve){
        const above=first.top-6-h;
        top=above>=8?above:Math.max(8,innerHeight-reserve-h);
      }
      s.left=Math.max(8,Math.min(last.left,rightEdge-w))+'px';
      s.top=top+scrollY+'px';
    }

    function showSelBar(anchor,range){
      sbAnchor=anchor;
      const keep=selBarShown()?sbTarget.value:null;
      const open=[...threads.values()].filter(t=>!t.resolved).reverse();
      const opts=[['New thread',NEW],...open.map(t=>[threadTitle(t)||'Thread',t.id])];
      sbTarget.replaceChildren(...opts.map(([label,v])=>{ const o=mk('option',null,label); o.value=v; return o; }));
      const open0=panelOpen()&&panelView;
      const want=[keep,open0].find(v=>v&&opts.some(o=>o[1]===v));
      sbTarget.value=want||NEW;
      sbWhat.textContent=anchor.kind==='line'
        ?(anchor.end_line?'Lines '+anchor.line+'-'+anchor.end_line:'Line '+anchor.line)
        :'Selection in '+(anchor.section||'this page');
      selBar.hidden=false;
      placeSelBar(range);
    }

    function updateSelBar(){
      if(gutterDrag||rangeHeld||selBar.contains(document.activeElement)) return;
      const d=diffSel();
      markSelectedLine(d);
      const sel=window.getSelection();
      const prose=!d&&sel&&!sel.isCollapsed&&sel.rangeCount&&sel.toString().trim()
        &&planEl.contains(sel.anchorNode)&&!inLiveUi(sel.anchorNode);
      const anchor=d||prose?buildAskAnchor(sel):null;
      if(!anchor||!placementFor(anchor)){ hideSelBar(); return; }
      showSelBar(anchor,sel.getRangeAt(0));
    }
    let selTimer=null;
    document.addEventListener('selectionchange',()=>{
      if(selTimer) clearTimeout(selTimer);
      selTimer=setTimeout(updateSelBar,150);
    });

    function addSelection(){
      const anchor=sbAnchor;
      if(!anchor) return;
      const tid=sbTarget.value, existing=tid!==NEW&&threads.get(tid);
      const view=existing||newView;
      const phone=sheetQ.matches;
      openPanel(existing?{thread:tid}:{new:true},{focus:!phone});
      if(!view.editor.insertRef({anchor,label:refLabelOf(anchor)},true)) return;
      if(phone){ setSheet('collapsed'); toast('Added to '+(existing?threadTitle(existing)||'thread':'New thread')); }
      const els=refEls(anchor);
      clearSelection();
      els.forEach(flashEl);
    }
    sbAdd.addEventListener('click',addSelection);

    function commentRange(a,b){
      if(composerBusy()) return;
      const [lo,hi]=a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_PRECEDING?[b,a]:[a,b];
      const anchor=lineRangeAnchor(lo,hi);
      const rec=spanByLineKey.get(anchor.path+'\t'+anchor.side+'\t'+(anchor.end_line||anchor.line));
      setRowRange(lo,hi);
      window.getSelection().removeAllRanges();
      hideSelBar();
      if(!rec) return;
      openLineComposer(anchor,rec.meta);
      rangeHeld=!!openBox;
    }

    function setRowRange(a,b){
      const [lo,hi]=a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_PRECEDING?[b,a]:[a,b];
      let end=hi.lastChild;
      while(end&&end.nodeType===1&&end.matches('.dline-plus,.cw-ref-dot-btn')) end=end.previousSibling;
      const r=document.createRange();
      r.setStartAfter(lo.querySelector('.dline-num'));
      r.setEndAfter(end);
      const sel=window.getSelection();
      sel.removeAllRanges(); sel.addRange(r);
      markSelectedLine(diffSel());
    }

    // ponytail: no auto-scroll while dragging near the viewport edge; scroll first, or extend with Shift+click.
    function dragMove(e){
      if(!(e.buttons&1)){ dragEnd(); return; }
      const cur=closestDline(document.elementFromPoint(e.clientX,e.clientY));
      if(!cur||cur.parentNode!==gutterDrag.start.parentNode) return;
      if(cur===gutterDrag.start&&!gutterDrag.moved) return;
      gutterDrag.moved=true; gutterDrag.end=cur;
      setRowRange(gutterDrag.start,cur);
    }
    function stopDrag(){
      const moved=!!(gutterDrag&&gutterDrag.moved);
      gutterDrag=null;
      document.removeEventListener('pointermove',dragMove);
      document.removeEventListener('pointerup',dragEnd);
      document.removeEventListener('pointercancel',dragEnd);
      return moved;
    }
    // a drag that ended back on its start badge still gets a click there; it must not reopen the single-line composer
    function dragEnd(){
      const g=gutterDrag;
      if(!stopDrag()) return;
      commentRange(g.start,g.end);
      gutterSwallow=true;
      setTimeout(()=>{ gutterSwallow=false; },300);
    }
    gutterDown=(e,span)=>{
      gutterSwallow=false;
      if(e.pointerType==='touch'||e.button!==0||e.shiftKey) return;
      stopDrag();
      gutterAnchor=span;
      gutterDrag={start:span,moved:false};
      document.addEventListener('pointermove',dragMove);
      document.addEventListener('pointerup',dragEnd);
      document.addEventListener('pointercancel',dragEnd);
    };
    rowTap=span=>{
      if(!openBox||!gutterAnchor||span===gutterAnchor||span.parentNode!==gutterAnchor.parentNode) return false;
      commentRange(gutterAnchor,span);
      return true;
    };
    rootEl.classList.add('cw-gutter');

    onGutter=(meta,e)=>{
      const span=spanByLineKey.get(meta.lineKey).span;
      if(e&&e.shiftKey&&gutterAnchor&&gutterAnchor!==span&&gutterAnchor.parentNode===span.parentNode){
        commentRange(gutterAnchor,span);
        return;
      }
      clearSelection();
      gutterAnchor=span;
      openLineComposer(lineRangeAnchor(span,span),meta);
    };

    let openBox=null, openC=null, openFrom=null;
    function closeBox(restore=true){
      if(!openBox) return;
      if(rangeHeld){ rangeHeld=false; markSelectedLine(null); }
      const from=openFrom;
      openBox.remove(); openBox=openC=openFrom=null;
      if(restore&&from&&from.isConnected) from.focus();
    }
    const closeComposer=()=>closeBox();

    function composerBusy(){
      if(!openC||!openBox.isConnected||openC.isEmpty()) return false;
      openC.nudge();
      return true;
    }
    function openComposer(c,place){
      const from=document.activeElement;
      closeBox(false);
      openC=c; openBox=c.box;
      openFrom=from&&from!==document.body?from:null;
      place(c.box);
      // Safari/iOS don't focus buttons on click: a tap on a button blurs the textarea with no relatedTarget.
      let tapAt=0;
      c.box.addEventListener('pointerdown',()=>{ tapAt=Date.now(); },true);
      c.box.addEventListener('focusout',e=>{
        if(c.box.contains(e.relatedTarget)||Date.now()-tapAt<400) return;
        setTimeout(()=>{
          if(openC===c&&c.isEmpty()&&!c.box.contains(document.activeElement)) closeBox(false);
        },0);
      });
      c.ta.focus();
    }
    document.addEventListener('pointerdown',e=>{
      if(!openC||!openC.isEmpty()) return;
      const t=e.target;
      if(t.closest&&t.closest('.cw-compose')) return;
      if(openFrom&&openFrom.contains(t)) return;
      closeBox(false);
    });
    window.cwComposerEsc=()=>{
      if(document.querySelector('dialog[open]')) return false;
      if(openC&&openBox.isConnected){ if(openC.prompting()) openC.keepEditing(); else openC.cancel(); return true; }
      if(selBarShown()){ clearSelection(); return true; }
      if(panelOpen()){ closePanel(); return true; }
      return false;
    };

    openThreadAsk=(root,host,input)=>{
      const key='ask:'+root.id;
      let v=seeds.get(key);
      if(!v){
        const seed={kind:'thread',note_id:root.id,quote:String(root.body||'').slice(0,200)};
        v={id:null,seed,editor:makeEditor({key,placeholder:'Ask the agent about this review thread'}),
          hint:mk('p','hr-comments-empty','Asking about the review thread: '+(firstLine(seed.quote)||'(no text)'))};
        v.editor.max=ED_MAX-1;
        const ref=threadRef(root);
        if(ref&&!v.editor.refs().length) v.editor.setSegs([ref,' ']);
        v.composer=threadComposer(v);
        seeds.set(key,v);
      }
      if(input&&input.value){
        v.editor.setSegs(v.editor.segs().concat(input.value));
        input.value='';
      }
      openPanel({thread:key});
    };

    const openLineComposer=(anchor,meta)=>{
      const ref=placementFor(anchor);
      if(!ref||lineDraft(meta)){ openOrFocusDraft(meta); return; }
      if(composerBusy()) return;
      const c=makeComposer({header:lineComposerOpts(anchor),onDraft:directDraftFor(anchor),onCancel:closeComposer});
      openComposer(c,box=>ref.insertAdjacentElement('afterend',box));
    };

    function loadQa(retry=true){
      const each=(xs,f)=>(xs||[]).forEach(x=>{ try{ f(x); }catch(e){ console.error('code-walkthrough: replay failed',e); } });
      fetch(window.CW_LIVE.api+'/qa',{headers:{'X-CW-Token':window.CW_LIVE.token}})
        .then(r=>r.ok?r.json():null)
        .then(data=>{
          if(!data||!Array.isArray(data.turns)){ if(retry) setTimeout(()=>loadQa(false),1500); return; }
          each(data.turns,x=>upsertTurn(x,true));
          each(data.resolved,tid=>applyResolve(tid,true));
          each(data.outcomes,upsertOutcome);
        })
        .catch(()=>{ if(retry) setTimeout(()=>loadQa(false),1500); });
    }
    loadQa();
  }

  document.querySelectorAll('pre.diff').forEach(wireHunk);
  wireCommentsPanel();
  wireResolutionDialog();
  if(window.CW_LIVE) wireAsk();

  function wireSibling(){
    const sb=window.CW_LIVE&&window.CW_LIVE.sibling;
    const root=$('plan-content');
    if(!sb||!root) return;
    document.documentElement.classList.add('cw-sibling');
    const box=document.createElement('aside'); box.id='cw-sibling'; box.setAttribute('aria-label','Task revision');
    const line=document.createElement('p');
    const edits=String(sb.task_id||'').startsWith('e-');
    line.textContent=(edits?'Showing PR head with the agent edits':'Showing PR head with task '+(sb.title||''))+' (branch '+(sb.branch||'')+') ';
    box.append(line);
    if(typeof sb.parent_url==='string'&&/^(https?:\/\/|\/[^\/])/.test(sb.parent_url)){
      const a=document.createElement('a'); a.href=sb.parent_url; a.textContent='Back to PR head';
      line.append(a);
    }
    if(sb.prose_carried){
      const n=document.createElement('p'); n.className='cw-sibling-note';
      n.textContent='Overview and story are from the PR head and may be outdated.';
      box.append(n);
    }
    root.parentNode.insertBefore(box,root);
    const changed=new Set(Array.isArray(sb.changed_files)?sb.changed_files:[]);
    document.querySelectorAll('.hunk-path').forEach(el=>{
      if(!changed.has(el.textContent.trim())) return;
      const chip=document.createElement('span'); chip.className='cw-sibling-chip'; chip.textContent=edits?'changed by agent':'changed by task';
      el.insertAdjacentElement('afterend',chip);
    });
  }
  wireSibling();
  wireViewedCheckboxes();
  render();
})();
</script>
<script>
// A click on the file's PR link must not also open or close the block. Toggling is the
// summary's own doing, so stopping the event on the link keeps the summary from ever seeing
// it; the link's navigation is its default action and still happens. Bound on each anchor
// rather than delegated: a delegated listener only fires after the summary already acted.
document.querySelectorAll('summary a').forEach(a => {
  a.addEventListener('click', e => e.stopPropagation());
});
</script>
<script>
// Explanations -- per-hunk notes, a group's why line and its whole diagram panel -- on by
// default, from the one toggle in the Walkthrough heading. The file role lines are not
// affected -- see the body:not(.show-notes) rule in the stylesheet.
// Persisted so a reader who turned the prose off keeps it off across the next recap they open;
// file:// and a sandboxed share host both throw on localStorage, hence the try/catch on every
// access. Read against an explicit '0' rather than a truthy '1', so a reader who has never
// touched it gets the on default instead of whatever a missing key coerces to.
(function(){
  const KEY='vd-show-notes';
  const btn=document.getElementById('wt-notes-toggle');
  if(!btn) return;

  // A file's hunks are separate <pre> blocks only so a note can sit between them. Where no
  // note actually sits between two of them, a framed panel each, with its own sideways
  // scroll, is worse to read than the single block GitHub shows: so consecutive hunks with
  // nothing between them are merged into the first of the run, and a run breaks only at a
  // note the reader can currently see. With the notes off that is every hunk in the file.
  // Safe for the per-line commenting: that is wired per span, by the script above this one,
  // so a span carries its handler and its recorded identity along with it.
  const files=[...document.querySelectorAll('details.hunk')]
    .map(d=>[...d.querySelectorAll('pre.diff')]).filter(pres=>pres.length>1);
  // Which <pre> each line goes back to. Comment rows the reader adds later have no mark and
  // follow whichever line they were attached to.
  files.forEach(pres=>pres.forEach((pre,i)=>{
    for(const el of pre.children) el.dataset.h=i;
  }));
  const splitAll=()=>files.forEach(pres=>{
    for(const pre of pres){
      for(const sep of [...pre.querySelectorAll('[data-sep]')]) sep.remove();
    }
    for(const pre of pres){
      let i=null;
      for(const node of [...pre.childNodes]){
        if(node.dataset&&node.dataset.h!==undefined) i=+node.dataset.h;
        // Appended in document order, and a node already home is left alone, so visiting a
        // <pre> that just received lines from an earlier one is a no-op rather than a shuffle.
        if(i!==null&&pres[i]!==pre) pres[i].appendChild(node);
      }
    }
    for(const pre of pres) pre.hidden=false;
  });
  const mergeRuns=notesOn=>files.forEach(pres=>{
    let lead=pres[0];
    for(let i=1;i<pres.length;i++){
      const before=pres[i].previousElementSibling;
      if(notesOn&&before&&before.classList.contains('hunk-note-hunk')){ lead=pres[i]; continue; }
      // The block ends on its last line with no trailing newline, so without this the next
      // hunk's @@ header lands on the end of that line. Two newlines, not one: the blank line
      // is what makes the header read as the start of a new hunk rather than another line of
      // the previous one.
      const sep=document.createElement('span');
      sep.dataset.sep='1'; sep.textContent='\n\n';
      lead.appendChild(sep);
      while(pres[i].firstChild) lead.appendChild(pres[i].firstChild);
      pres[i].hidden=true;
    }
  });

  let on=true;
  try{ on = localStorage.getItem(KEY) !== '0'; }catch(e){}
  const apply=()=>{
    document.body.classList.toggle('show-notes',on);
    btn.textContent = on ? 'explanations' : 'no explanations';
    btn.setAttribute('aria-label', on
      ? 'Explanations shown. Activate to hide them.'
      : 'Explanations hidden. Activate to show them.');
    splitAll();
    mergeRuns(on);
    try{ localStorage.setItem(KEY,on?'1':'0'); }catch(e){}
  };
  btn.addEventListener('click',()=>{ on=!on; apply(); });
  apply();
})();
</script>
<script>
// Hunk-header and code layout for narrow screens. Soft-wrap defaults on for a narrow or touch
// screen and off on desktop until the reader picks; the choice persists (try/catch for the
// same file:// reason as the explanations toggle). The wrapping itself is CSS, see body.cw-wrap.
(function(){
  const KEY='cw-wrap';
  let on=window.matchMedia('(max-width:560px),(pointer:coarse)').matches;
  try{ const v=localStorage.getItem(KEY); if(v!==null) on=v==='1'; }catch(e){}
  const notes=document.getElementById('wt-notes-toggle');
  const btn=document.createElement('button');
  btn.type='button'; btn.id='cw-wrap-toggle';
  const apply=()=>{
    document.body.classList.toggle('cw-wrap',on);
    btn.textContent=on?'wrap on':'wrap off';
    btn.setAttribute('aria-label',on?'Code wraps. Activate to scroll sideways instead.'
      :'Code scrolls sideways. Activate to wrap lines.');
  };
  apply();
  if(notes) notes.after(btn);
  btn.addEventListener('click',()=>{
    on=!on; apply();
    try{ localStorage.setItem(KEY,on?'1':'0'); }catch(e){}
  });
  // A "/" is not a line-break opportunity, so a long path would split mid-word. <wbr> adds one
  // after each slash and has no text, so textContent (read as the literal PR path) is unchanged.
  document.querySelectorAll('.hunk-path').forEach(el=>{
    const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
    const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
    for(const t of nodes){
      if(!t.data.includes('/')) continue;
      const f=document.createDocumentFragment();
      t.data.split('/').forEach((s,i,a)=>{
        f.append(s+(i<a.length-1?'/':''));
        if(i<a.length-1) f.append(document.createElement('wbr'));
      });
      t.replaceWith(f);
    }
  });
  document.querySelectorAll('details.hunk .hunk-cx').forEach(c=>{
    c.title=c.textContent+' - '+c.title;
  });
})();
</script>
<script>
(function(){
  if(window.CW_LIVE){
    const LIVE=window.CW_LIVE;
    // Mirrors cw_run.py's STEPS tuple; keep in sync.
    const STEP_ORDER=['capture','split','skeleton','worktree','complexity','symdelta','visuals','small',
      'prose','routed','comments','threads','thread','prepare','render','run'];
    let liveStatus=LIVE.status, liveError=LIVE.error, liveRemedy=LIVE.remedy;
    let liveSteps=LIVE.steps||{}, liveBatches=LIVE.batches||{done:0,total:0};
    let liveTotal=LIVE.total||{};

    function runningStepName(){
      const names=Object.keys(liveSteps).filter(n=>liveSteps[n]&&liveSteps[n].status==='running');
      if(!names.length) return null;
      names.sort((a,b)=>{
        const ai=STEP_ORDER.indexOf(a.split('-')[0]), bi=STEP_ORDER.indexOf(b.split('-')[0]);
        return (ai<0?999:ai)-(bi<0?999:bi);
      });
      return names[names.length-1];
    }

    function ensureBanner(){
      let el=document.getElementById('cw-live-banner');
      if(!el){ el=document.createElement('div'); el.id='cw-live-banner'; document.body.prepend(el); }
      return el;
    }

    function renderBanner(){
      const el=ensureBanner();
      const parts=['Live','\u00b7 '+liveStatus];
      const running=runningStepName();
      if(running) parts.push('\u00b7 '+running);
      parts.push('\u00b7 batches '+(liveBatches.done||0)+'/'+(liveBatches.total||0));
      const prompt=liveTotal.prompt_tokens||0, completion=liveTotal.completion_tokens||0;
      parts.push('\u00b7 '+(prompt+completion)+' tokens');
      if(liveTotal.cost_usd!=null) parts.push('\u00b7 $'+liveTotal.cost_usd.toFixed(4));
      let text=parts.join(' ');
      if(liveStatus==='failed'){
        if(liveError) text+=' \u2014 '+liveError;
        if(liveRemedy) text+=' (remedy: '+liveRemedy+')';
      }
      el.classList.toggle('failed',liveStatus==='failed');
      el.textContent=text;
    }
    renderBanner();

    function busyEditing(){
      const a=document.activeElement;
      if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable)) return true;
      return !!document.querySelector('dialog[open]')||document.documentElement.classList.contains('cw-panel-open');
    }

    function scrollKey(){ return 'cw-scroll:'+LIVE.key+'/'+LIVE.id; }

    function doReload(){
      try{ sessionStorage.setItem(scrollKey(), String(window.scrollY)); }catch(e){}
      const flushed=window.__cwFlushPutNotes ? window.__cwFlushPutNotes() : Promise.resolve();
      const timeout=new Promise(resolve=>setTimeout(resolve,1500));
      Promise.race([flushed,timeout]).then(()=>location.reload());
    }

    function showReloadPill(){
      if(document.getElementById('cw-live-reload')) return;
      const btn=document.createElement('button');
      btn.id='cw-live-reload';
      btn.textContent='Updated, reload';
      btn.addEventListener('click',doReload);
      document.body.appendChild(btn);
    }

    function onPageUpdated(){
      if(busyEditing()){ showReloadPill(); return; }
      doReload();
    }

    try{
      const key=scrollKey();
      const saved=sessionStorage.getItem(key);
      if(saved!=null){
        sessionStorage.removeItem(key);
        window.scrollTo(0,+saved||0);
      }
    }catch(e){}

    const es=new EventSource(LIVE.api+'/events?k='+encodeURIComponent(LIVE.token));
    es.addEventListener('snapshot',e=>{
      const data=JSON.parse(e.data);
      liveStatus=data.status; liveError=data.error; liveRemedy=data.remedy;
      liveSteps=data.steps||{}; liveBatches=data.batches||liveBatches; liveTotal=data.total||liveTotal;
      renderBanner();
      if(typeof data.rev==='number'&&data.rev>LIVE.rev) onPageUpdated();
      if(window.__cwOnSnapshot) window.__cwOnSnapshot(data);
    });
    es.addEventListener('step',e=>{
      const data=JSON.parse(e.data);
      if(data.name==='run'&&(data.status==='done'||data.status==='failed')) liveStatus=data.status;
      liveSteps=Object.assign({},liveSteps,{[data.name]:{status:data.status,error:data.error,remedy:data.remedy}});
      if(data.error) liveError=data.error;
      if(data.remedy) liveRemedy=data.remedy;
      if(data.batches) liveBatches=data.batches;
      renderBanner();
    });
    es.addEventListener('usage',e=>{
      const data=JSON.parse(e.data);
      liveTotal=data.total||liveTotal;
      renderBanner();
    });
    es.addEventListener('rebuilt',()=>{ onPageUpdated(); });
    es.addEventListener('thread',e=>{
      if(window.__cwOnThread) window.__cwOnThread(JSON.parse(e.data));
    });
    ['delta','progress','outcome'].forEach(name=>{
      es.addEventListener(name,e=>{
        const hook=window['__cwOn'+name[0].toUpperCase()+name.slice(1)];
        if(hook) hook(JSON.parse(e.data));
      });
    });
    es.addEventListener('posted',e=>{
      if(window.__cwOnPosted) window.__cwOnPosted(JSON.parse(e.data));
    });
  }
})();
</script>
<script>
(function(){
  const NODE='.cw-ov-node',JUMP='.cw-ov-node,.cw-ov-chip';
  function clear(svg){
    svg.classList.remove('cw-ov-focusing');
    svg.querySelectorAll('.cw-ov-reach').forEach(e=>e.classList.remove('cw-ov-reach'));
  }
  function focus(node){
    const svg=node.ownerSVGElement,i=node.dataset.ov;
    clear(svg);
    svg.classList.add('cw-ov-focusing');
    node.classList.add('cw-ov-reach');
    svg.querySelectorAll('[data-from]').forEach(e=>{
      if(e.dataset.from!==i&&e.dataset.to!==i) return;
      e.classList.add('cw-ov-reach');
      svg.querySelectorAll(NODE).forEach(n=>{ if(n.dataset.ov===e.dataset.from||n.dataset.ov===e.dataset.to) n.classList.add('cw-ov-reach'); });
    });
  }
  const nodeOf=e=>e.target.closest?e.target.closest(NODE):null;
  ['mouseover','focusin'].forEach(t=>document.addEventListener(t,e=>{ const n=nodeOf(e); if(n) focus(n); }));
  ['mouseout','focusout'].forEach(t=>document.addEventListener(t,e=>{ const n=nodeOf(e); if(n) clear(n.ownerSVGElement); }));
  function jump(e){
    const t=e.target.closest?e.target.closest(JUMP):null;
    if(!t||!t.dataset.path||!window.__cwGoToFile) return false;
    const zoom=t.closest('#mermaid-zoom');
    if(zoom) zoom.close();
    window.__cwGoToFile(t.dataset.path);
    return true;
  }
  document.addEventListener('click',jump);
  document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&jump(e)) e.preventDefault(); });
})();
</script>
