<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- DIFF_TITLE --></title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --border:#2a2f3a;
    --text:#e6e9ef; --muted:#9aa3b2; --accent:#7aa2f7; --green:#9ece6a;
    --yellow:#e0af68; --red:#f7768e; --cyan:#7dcfff; --purple:#bb9af7;
    --markbg:rgba(224,175,104,.28);
    /* Group colours: walkthrough.py and sections.py cycle through these by index, built from the
       six named colours so light mode repaints them. */
    --g1:var(--accent); --g2:var(--yellow); --g3:var(--green);
    --g4:var(--purple); --g5:var(--cyan); --g6:var(--red);
    --mono:ui-monospace,'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
    /* One type scale. Every font-size below points at a step, so a size change happens here
       once rather than in thirty rules, and the mobile block overrides the steps instead of
       restating each rule. Icon-button glyph sizes stay literal: they size an affordance, not
       text, and moving them with the scale shifts the hit targets. */
    --fs-base:16px; --fs-xl:26px;
    --fs-md:15px; --fs-sm:13px; --fs-xs:12px;
    /* Diff lines get their own step: smaller is the one place where more of a long line fits
       instead of scrolling sideways, which is the whole problem on a phone. */
    --fs-code:12.5px;
  }
  /* Colour semantics on this page -- what each variable MEANS here, and which code owns it.
     Recorded once after two independent fixes both reached for --purple for unrelated things.
     Mermaid can't resolve a CSS var() inside classDef/linkStyle, so the symbol-delta graph's
     edge colours (scripts/sections.py LINK_COLOR_*) are hex literals mirroring these variables'
     dark-theme values -- kept in sync with this table by hand, not by the browser.

     --accent  interactive affordance (focus rings, the section toggles, links) AND the new
               call edge in the graph (CSS .node.new / sections.py LINK_COLOR_NEW)
     --cyan    function-name syntax highlight (CSS only)
     --red     complexity rose (.hunk-cx.up); removed/deleted lines (CSS only)
     --green   added lines and the add count (CSS only)
     --purple  complexity fell (.hunk-cx.down); keyword syntax, diff hunk headers (CSS only)
     --yellow  warnings/attention (.dec.warn, risks list, comments-toggle, failed render) AND
               the moved call edge in the graph (sections.py LINK_COLOR_MOVED) -- a move is
               structural, not good or bad, so it avoids --red/--green/--purple's judgement
     --muted   neutral/dim text AND the removed call edge in the graph, drawn dashed (CSS
               .sw-gone / sections.py LINK_COLOR_GONE)
  */
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f2f6; --border:#dce0e8;
      --text:#1c2230; --muted:#5c6675; --accent:#2f5fd0; --green:#3a7128;
      --yellow:#9a6b12; --red:#c23a55; --cyan:#0e7490; --purple:#7048b6;
      --markbg:rgba(154,107,18,.22);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:var(--fs-base);line-height:1.6;
    padding:32px 20px 64px}
  .wrap{max-width:min(1400px,92vw);margin:0 auto}
  /* Prose runs the full wrapper width, matching the panels and diagrams, because that is what
     was asked for twice. It puts a line past the 65-80 characters a measure normally wants, so
     line-height carries a bit more of the load; put a max-width back here if it ever reads too
     long on a very wide screen. */
  .wrap>p{font-size:var(--fs-base);line-height:1.7}
  .wrap>ul{font-size:var(--fs-base);line-height:1.7;padding-left:20px}
  .wrap>ul li{margin:4px 0}
  h1{font-size:var(--fs-xl);margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 28px;font-size:var(--fs-sm)}
  .cw-title{overflow-wrap:anywhere;line-height:1.25}
  .cw-title-sub{margin:0 0 16px;overflow-wrap:anywhere}
  h2{font-size:var(--fs-md);letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin:36px 0 14px;border-bottom:1px solid var(--border);
    padding-bottom:8px}
  .panel{background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:18px 20px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
  /* auto-fit, not a fixed 3: the row carries 2 to 4 facts depending on whether this
     recap has a verdict and a complexity measurement, and a fixed column count leaves
     the fourth stranded alone on a second row. */
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:12px;margin-bottom:4px}
  @media(max-width:760px){.facts{grid-template-columns:1fr}}
  .fact{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .fact b{display:block;font-size:var(--fs-sm);color:var(--accent);margin-bottom:4px}
  .fact span{font-size:var(--fs-sm);color:var(--text)}
  svg{max-width:100%;height:auto;display:block;margin:0 auto}
  svg:not(.cw-vis svg) text{font-family:var(--mono);fill:var(--text)}
  svg .lane{stroke:var(--border);stroke-dasharray:4 4}
  svg .box{fill:var(--panel2);stroke:var(--border)}
  svg .arrow{stroke:var(--muted);fill:none;marker-end:url(#m)}
  /* Tracks the page's own type scale like everything else, so a step change reaches this
     hand-drawn diagram text too. Icon-button glyphs are the one exception to that, see the type
     scale note above -- they size a hit target, not text. */
  svg .lbl{font-size:var(--fs-xs)}
  svg .head{font-size:var(--fs-sm);font-weight:600}
  svg .note{fill:var(--muted);font-size:var(--fs-xs)}
  pre{background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    padding:14px 16px;overflow-x:auto;margin:0;
    font-family:var(--mono);font-size:var(--fs-code);line-height:1.6}
  /* inline identifiers (paths, path:symbol names, function/config names) inside prose;
     em-sized so it tracks whichever text it sits in, overflow-wrap so a long path can't
     blow out the line on mobile even though it has no spaces to break at */
  code{font-family:var(--mono);font-size:.9em;background:var(--panel2);
    border:1px solid var(--border);border-radius:4px;padding:.1em .4em;
    overflow-wrap:anywhere}
  .add{color:var(--green)} .del{color:var(--red)} .dim{color:var(--muted)}
  .cmt{color:var(--muted);font-style:italic}
  .k{color:var(--purple)} .f{color:var(--cyan)}
  .grill{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:760px){.grill{grid-template-columns:1fr}}
  .dec{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:8px;padding:12px 14px}
  .dec b{font-size:var(--fs-sm)}
  .dec p{margin:6px 0 0;font-size:var(--fs-xs);color:var(--muted)}
  .dec.warn{border-left-color:var(--yellow)}
  .dec.dead{border-left-color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
  td,th{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.05em}
  ul.risks{margin:0;padding-left:20px;font-size:var(--fs-sm)}
  ul.risks li{margin:8px 0}
  ul.risks b{color:var(--yellow)}
  .foot{margin-top:36px;color:var(--muted);font-size:var(--fs-xs);text-align:center}

  /* dstat: per-file change rows inside one panel, not a card per row */
  .dstat .row{display:grid;grid-template-columns:1fr auto auto;gap:12px;
    align-items:center;padding:5px 0;
    font-family:var(--mono);font-size:var(--fs-code);line-height:1.5}
  .dstat .row+.row{border-top:1px solid var(--border)}
  .dstat .path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    direction:rtl;text-align:left}
  @media(max-width:560px){
    .dstat .row{grid-template-columns:1fr auto}
    .dstat .bar{display:none}
    :root{--fs-base:15px; --fs-xl:22px; --fs-md:14px; --fs-sm:12.5px; --fs-xs:11.5px;
      /* 12px, measured on a real 390px viewport against a 45-file Go diff: 45 characters per
         line before sideways scroll, against 43 at the desktop 12.5px. 11.5px buys 2 more
         and costs legibility, and 12px is what GitHub's own mobile diff uses. No size makes
         an 80-120 char Go line fit; soft-wrapping is the real fix and is a separate change. */
      --fs-code:12px}
    .wrap>p{line-height:1.65}
    .wrap>ul{line-height:1.65;padding-left:18px}
    h2{margin:26px 0 10px}
    body{padding:20px 14px 48px}
  }
  .bar{display:inline-flex;gap:1px}
  .bar i{width:6px;height:9px;border-radius:1px;display:block}
  .bar i.a{background:var(--green)}
  .bar i.d{background:var(--red)}
  /* Empty track. Every bar is ten cells wide and filled against the widest file, so the unfilled
     tail has to be visible or a small change reads as a short bar instead of a scaled one. */
  .bar i.e{background:var(--border)}

  /* hunk: keyboard-operable disclosure, no JS accordion needed */
  details.hunk{background:var(--panel);border:1px solid var(--border);
    border-radius:10px;margin-bottom:10px;overflow:hidden}
  /* Two columns, triangle then content: the path now wraps instead of ellipsizing (see
     .hunk-lines below), and a grid -- not a flex row -- is what keeps the triangle pinned to
     the first line while the rest of the summary grows underneath it. */
  details.hunk>summary{cursor:pointer;padding:10px 14px;
    font-family:var(--mono);font-size:var(--fs-code);line-height:1.5;
    display:grid;grid-template-columns:14px 1fr;column-gap:10px;
    list-style:none}
  details.hunk>summary::-webkit-details-marker{display:none}
  details.hunk>summary:hover{background:var(--panel2)}
  details.hunk[open]>summary{border-bottom:1px solid var(--border)}
  details.hunk>summary::before{content:'▸';color:var(--muted);align-self:start;
    margin-top:.2em;transition:transform .12s}
  details.hunk[open]>summary::before{transform:rotate(90deg)}
  details.hunk>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* The summary's one column-2 grid item. Path and stat share a wrapping row; .hunk-was forces
     itself onto its own row below via flex-basis:100%, a plain flex trick, rather than a
     second grid row that would need its own explicit placement. */
  details.hunk .hunk-lines{display:flex;flex-wrap:wrap;column-gap:12px;row-gap:4px;
    align-items:baseline;min-width:0}
  /* break-word, not anywhere: the "/" breaks come from the <wbr> the wrap script adds after each
     slash, and anywhere would still split a segment mid-word. break-word keeps the fallback
     for one segment wider than the row. */
  details.hunk .hunk-path{flex:0 1 auto;min-width:0;overflow-wrap:break-word;
    white-space:normal}
  /* margin-left:auto, not the path's old min-width:60%, is what holds the stat at the right
     edge now: the path has to shrink to its text so the PR link sits against the filename
     rather than out at 60% of the row with a gap behind it. */
  details.hunk .hunk-stat{flex:none;margin-left:auto}
  details.hunk .hunk-count{flex:none;font-size:var(--fs-xs);color:var(--muted)}
  details.hunk .hunk-count:empty{display:none}
  /* outdated/resolved are per-comment and per-thread counts respectively (see renderNotes),
     coloured like every other outdated/resolved marker on the page; the leading "N comments"
     segment stays --muted above since it isn't either state. */
  details.hunk .hunk-count .hunk-count-outdated{color:var(--yellow)}
  details.hunk .hunk-count .hunk-count-resolved{color:var(--green)}
  details.hunk .hunk-was{flex:0 0 100%;color:var(--muted);font-size:var(--fs-xs);
    overflow-wrap:anywhere;white-space:normal}
  /* GitHub-style Viewed checkbox, last in the row after .hunk-stat's own margin-left:auto has
     already pushed that group to the right -- flex:none keeps it its own width beside it. The
     label wraps the input so a click on either toggles it; wireViewedCheckboxes stops that
     click from also bubbling into the summary's own open/close toggle. */
  details.hunk .hunk-viewed{flex:none;display:inline-flex;align-items:center;gap:4px;
    font-size:var(--fs-xs);color:var(--muted);cursor:pointer;user-select:none}
  details.hunk .hunk-viewed-cb{accent-color:var(--accent);cursor:pointer;margin:0}
  details.hunk .hunk-viewed-cb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* Complexity chips, moved out of the summary into their own quiet row -- no card, no
     border, just muted inline furniture below the path a reader already read. */
  details.hunk .hunk-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:8px 14px 0;color:var(--muted)}
  details.hunk .hunk-note{padding:10px 14px 0;font-size:var(--fs-sm);color:var(--muted)}
  details.hunk pre{margin:10px 14px 14px}

  /* Walkthrough group headings: the reading order analysis.json asked for. Plain sentence
     case, unlike the uppercase h2 section headings, so a theme reads as a label inside the
     section rather than as another section. */
  .wt-group{display:flex;gap:8px;align-items:baseline;margin:24px 0 6px;padding:0;border:0;
    font-size:var(--fs-sm);color:var(--text)}
  .wt-group .wt-count,.wt-group .wt-viewed{color:var(--muted);font-size:var(--fs-xs);font-weight:400}
  /* .wrap>p sets the prose size and outranks a bare class, so this has to name both or
     a group's one-line why renders at full paragraph size. */
  .wrap>p.wt-why{margin:0 0 10px;color:var(--muted);font-size:var(--fs-xs)}

  /* Complexity chip. Red for risen (must not be missed), purple for fallen, muted grey for the
     neutral states -- a new function's bare count, no change, and removed. Not green: the +N/-N
     counts beside it are already green, and two greens read as one measurement. Not cyan or
     --accent either -- this page already spends that blue on focus rings, the section toggles
     and mermaid's new-edge colour, so a fourth meaning on the same hue read as
     "interactive" on a phone, not "complexity fell". .gone borrows the dashed-border convention
     the graph's own gone nodes use (.sw-gone below): a deletion is a structural fact, not a
     verdict, so it must not read as either warning or improvement. Every state also has its sign
     in the chip text, so colour is never the only channel. */
  details.hunk .hunk-cx{flex:0 1 auto;min-width:0;max-width:100%;overflow:hidden;
    text-overflow:ellipsis;font-size:var(--fs-xs);padding:1px 6px;border-radius:999px;
    border:1px solid var(--border);color:var(--muted);white-space:nowrap}
  details.hunk .hunk-cx.up{color:var(--red);
    border-color:color-mix(in srgb,var(--red) 45%,transparent)}
  details.hunk .hunk-cx.down{color:var(--purple);
    border-color:color-mix(in srgb,var(--purple) 45%,transparent)}
  details.hunk .hunk-cx.gone{border-style:dashed}

  /* Section heading row, shared by the walkthrough and the graph: title on the left, that
     section's controls pushed right. The row is the h2 itself rather than a wrapper, so the
     heading's bottom border stays under both. */
  h2.h2-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
  h2.h2-row .ctl{display:flex;align-items:center;gap:10px}
  /* Maximise icon, one style shared by every diagram's header row (this h2's .ctl): opens the same
     #mermaid-zoom dialog a click on the diagram itself already does (see wire()/openZoom in the
     template script), just reachable from the header too. */
  .vd-max-btn{width:32px;height:32px;flex:none;align-self:center;display:inline-flex;
    align-items:center;justify-content:center;background:var(--panel2);
    border:1px solid var(--border);color:var(--text);border-radius:6px;cursor:pointer;
    padding:0;transition:background .12s}
  .vd-max-btn:hover{background:var(--border)}
  .vd-max-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* One appearance, both states. Each toggle's label names the state you are in, so tinting
     the default state grey said it twice and read as switched off; --accent is this page's
     interactive colour, so the control wears it whatever it says, and hover/press move the
     background instead. */
  #wt-notes-toggle,#cw-wrap-toggle,.vd-level-toggle{background:var(--panel2);border:1px solid var(--accent);
    color:var(--accent);border-radius:6px;padding:4px 10px;cursor:pointer;
    font:600 var(--fs-xs) system-ui;letter-spacing:.06em;text-transform:uppercase;
    transition:background .2s}
  #wt-notes-toggle:hover,#cw-wrap-toggle:hover,
  .vd-level-toggle:hover{background:color-mix(in srgb,var(--accent) 14%,var(--panel2))}
  #wt-notes-toggle:active,#cw-wrap-toggle:active,
  .vd-level-toggle:active{background:color-mix(in srgb,var(--accent) 22%,var(--panel2))}
  #wt-notes-toggle:focus-visible,#cw-wrap-toggle:focus-visible,
  .vd-level-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* Explanations are on by default; pressing the toggle drops this class and takes every
     per-hunk note and each group's why line with it. .hunk-note without the -hunk suffix is the
     file's one-line role, which stays either way. */
  body:not(.show-notes) .hunk-note-hunk,
  body:not(.show-notes) .wt-why{display:none}
  /* The file name is the link to the file on the PR. Text colour is kept and only the
     underline carries the accent: 45 paths repainted blue is a wall of link, and the path is
     still the thing being read. Same muted decoration the note links use. */
  details.hunk .hunk-path a{color:inherit;text-decoration:underline;text-underline-offset:2px;
    text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent)}

  .note{font-size:var(--fs-base);line-height:1.6;color:var(--muted);margin:10px 0 0}
  a{color:var(--accent)}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hunk-note a,.dstat a{text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  .hunk-note a{margin-left:6px;white-space:nowrap}

  /* Row tint, GitHub-style, not just the text: display:block on an inline span makes it a
     full row, and width:max-content/min-width:100% is what lets that row's background still
     fill (and extend past) the viewport once the hunk scrolls sideways. Selectors stay flat
     class matches, not a `.diff >` combinator, because .fb-item's quoted-hunk snippets below
     reuse these same classes one level deeper. */
  /* walkthrough.py joins line spans with a literal "\n"; once .a/.d/.c/.h go display:block,
     each bare newline text node becomes its own anonymous block and renders as a blank row.
     line-height:0 here collapses those; line-height:1.6 below restores real height on the spans. */
  .diff{line-height:0}
  .diff .a,.diff .d,.diff .c,.diff .h{display:block;width:max-content;min-width:100%;line-height:1.6}
  /* GitHub-style: the row background alone marks added/removed, text stays var(--text) so
     hljs tokens (or their absence, on a language hljs doesn't tokenise) read normally. */
  .diff .a{background:color-mix(in srgb,var(--green) 14%,transparent)}
  .diff .d{background:color-mix(in srgb,var(--red) 14%,transparent)}
  .diff .h{color:var(--purple)}
  /* Soft-wrap, toggled by #cw-wrap-toggle (body.cw-wrap). CSS only, so line text, anchors and
     selection ranges are the same nodes either way. Hanging indent: the row's padding-left
     holds the gutter (20px, see .dline) plus the number badge, and the negative text-indent
     pulls the first line back so the badge sits in the gutter while continuation lines start
     under the code. --cw-num is the badge's box (min-width + margin-right, see .dline-num);
     it only drifts if a line number outgrows that width. */
  body{--cw-num:40px}
  body.cw-wrap details.hunk pre.diff .a,body.cw-wrap details.hunk pre.diff .d,
  body.cw-wrap details.hunk pre.diff .c,body.cw-wrap details.hunk pre.diff .h{
    width:auto;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
  body.cw-wrap details.hunk pre.diff .dline{padding-left:calc(20px + var(--cw-num));
    text-indent:calc(-1 * var(--cw-num))}
  body.cw-wrap details.hunk pre.diff .dline-num{text-indent:0}
  /* Narrow screens: the file card, its pre and the line-number badge each pad the sides, which
     left ~40 characters of code. The pre needs no left padding of its own because .dline
     already reserves the 20px gutter for the "+" and reference dot. Placed after the
     details.hunk rules above, so these win on source order. */
  @media(max-width:560px){
    body{--cw-num:34px}
    details.hunk>summary{padding:10px}
    details.hunk .hunk-meta,details.hunk .hunk-note{padding-left:10px;padding-right:10px}
    details.hunk pre.diff{margin:8px 4px 10px;padding:10px 6px 10px 0}
    details.hunk .dline-num{min-width:28px;margin-right:6px;padding-right:6px}
  }
  /* hljs token colours, mapped onto this page's own vars rather than a vendored theme --
     scoped to .diff so it can't bleed into pre.mermaid or a prose <code>. */
  .diff .hljs-keyword,.diff .hljs-literal,.diff .hljs-type{color:var(--purple)}
  .diff .hljs-string,.diff .hljs-regexp{color:var(--green)}
  .diff .hljs-number{color:var(--yellow)}
  .diff .hljs-comment{color:var(--muted);font-style:italic}
  .diff .hljs-title,.diff .hljs-title.function_,.diff .hljs-built_in{color:var(--cyan)}
  .diff .hljs-attr,.diff .hljs-variable,.diff .hljs-meta{color:var(--yellow)}

  pre.mermaid{background:none;border:none;padding:0;text-align:center;
    font-family:inherit;min-height:80px}
  /* Mermaid writes its own inline max-width on the svg, which otherwise wins over anything
     here: on a phone that shrank the whole diagram to a barely-visible strip (measured 6px
     tall against a real page). This selector's specificity beats the bare `svg{}` rule above
     for every mermaid diagram, flow included. */
  .mermaid svg{width:100%;height:auto;max-width:none}

  /* Dragging a graph to pan must never leave a native text selection behind or lose the drag
     to the browser starting one: mermaid renders every label as a real <text> node, and a
     pointerdown that begins a drag also begins selecting that text underneath it. Scoped to
     the panning surfaces only -- symbol-delta levels, the zoom modal's clone -- so <pre class="diff"> and prose stay selectable. -webkit- prefix is still
     required by Safari on SVG. */
  .vd-symbols .mermaid,.vd-symbols .mermaid svg,
  #mermaid-zoom-body,#mermaid-zoom-body svg{
    -webkit-user-select:none;user-select:none}

  /* mermaid zoom: full-size click-to-expand for the inline diagram */
  .vd-symbols .mermaid svg{width:auto;max-width:100%}
  .vd-failed{margin:0;padding:14px 16px;color:var(--yellow)}
  #mermaid-zoom{width:95vw;height:92vh;max-width:95vw;max-height:92vh;padding:0;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    color:var(--text)}
  #mermaid-zoom::backdrop{background:rgba(0,0,0,.6)}
  #mermaid-zoom-controls{position:absolute;top:10px;left:10px;z-index:2;display:flex;
    gap:6px;align-items:center;font-size:var(--fs-xs);color:var(--muted)}
  /* position:relative: the node menu positions itself absolutely inside this element for
     the fullscreen clone. */
  #mermaid-zoom-body{width:100%;height:100%;overflow:hidden;position:relative;
    padding:20px;box-sizing:border-box}
  #mermaid-zoom-body svg{max-width:none;margin:0 auto;display:block}
  #mermaid-zoom-close{position:absolute;top:10px;right:10px;z-index:3;
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:14px;
    line-height:1;transition:background .12s}
  #mermaid-zoom-close:hover{background:var(--border)}
  #mermaid-zoom-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* Node menu on any graph whose box carries a data-ids map: popup and focus-dimming.
     Scoped to svg.vd-nav, set by tagNavNodes below only when that map is present, so FLOW
     (no data-ids) stays untouched while both symbol-delta levels are in scope. */
  svg.vd-nav :is(.node,.cluster)[data-path]{cursor:pointer;-webkit-touch-callout:none}
  svg.vd-nav :is(.node,.cluster)[data-path]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* Mermaid writes an ID-scoped .node rule per render that outranks a plain rect selector,
     same reason .node.new/.node.gone above need !important. */
  svg.vd-nav :is(.node,.cluster).vd-sel rect{stroke:var(--accent)!important;stroke-width:2px!important}
  /* Same !important-outranks-!important reason as .node.vd-sel rect above: a removed node
     (.node.gone, opacity:.7!important below) or an added one outside the reachable set must
     still drop to .22, not win on its own !important rule instead. */
  svg.vd-nav.vd-focusing :is(.node,.cluster):not(.vd-reach){opacity:.22!important}
  svg.vd-nav.vd-focusing .vd-edge:not(.vd-reach){opacity:.12}
  svg.vd-nav :is(.node,.cluster),svg.vd-nav .vd-edge{transition:opacity .22s ease}
  .vd-menu{position:absolute;z-index:20;min-width:190px;background:var(--panel);
    border:1px solid var(--border);border-radius:9px;padding:5px;
    box-shadow:0 10px 26px rgba(8,10,16,.45);font-size:var(--fs-sm)}
  .vd-menu-path{font-family:var(--mono);font-size:var(--fs-xs);color:var(--muted);
    padding:5px 8px 7px;border-bottom:1px solid var(--border);margin-bottom:4px;
    overflow-wrap:anywhere}
  .vd-menu button{display:flex;gap:9px;align-items:center;width:100%;text-align:left;
    background:none;border:0;color:var(--text);font:inherit;padding:9px 8px;
    border-radius:6px;cursor:pointer}
  .vd-menu button:hover,.vd-menu button:focus-visible{background:var(--panel2);outline:none}
  .vd-menu button:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
  .vd-menu-ic{color:var(--accent);font-family:var(--mono);font-size:13px;width:14px}
  .vd-nav-toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
    padding:8px 13px;font-size:var(--fs-xs);color:var(--muted);opacity:0;
    transition:opacity .25s ease;pointer-events:none;z-index:30}
  .vd-nav-toast.on{opacity:1}
  #cw-live-banner{position:fixed;top:0;left:0;right:0;z-index:50;
    background:var(--panel);border-bottom:1px solid var(--border);
    padding:6px 14px;font-size:var(--fs-xs);color:var(--muted);
    font-family:var(--mono);text-align:center}
  #cw-live-banner.failed{color:var(--red)}
  #cw-live-reload{position:fixed;left:16px;bottom:16px;z-index:40;
    display:inline-flex;align-items:center;height:38px;padding:0 14px;white-space:nowrap;
    background:var(--panel2);border:1px solid var(--accent);color:var(--text);border-radius:999px;
    font:600 var(--fs-sm) system-ui;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #cw-live-reload:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* Brief highlight so "Go to file" is visible arriving at the hunk, not just landing on it. */
  details.hunk.vd-flash{border-color:var(--accent)}
  /* Same idea for "Go to symbol" landing on a line rather than a hunk. The global
     prefers-reduced-motion rule below already zeroes this transition under reduce. */
  .dline.vd-flash-line{background:color-mix(in srgb,var(--accent) 24%,transparent);transition:background .4s ease}

  /* The graph's generated key, inline beside the level toggle and only for a level that
     actually draws such a node (see _symbols_legend). Sentence case on purpose: two
     uppercase runs side by side in the heading shout. Matches the mermaid `class ...
     new/gone` sections.py emits: solid accent for new, dashed muted for gone. */
  .vd-legend{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);
    color:var(--muted);text-transform:none;letter-spacing:0}
  .sw{width:11px;height:11px;border-radius:3px;margin-left:10px}
  .vd-legend .sw:first-child{margin-left:0}
  .sw-new{border:2px solid var(--accent)}
  .sw-gone{border:2px dashed var(--muted);opacity:.7}
  /* Mermaid's own classDef can't resolve a CSS var(), so node colour is applied here instead:
     sections.py's `class S0,S1 new` still lands that class name on the rendered <g>, and this
     targets it as ordinary page CSS. Mermaid also writes an ID-scoped .node rule per render that
     outranks this by specificity, so stroke, stroke-width, stroke-dasharray and opacity need
     !important too. */
  .mermaid svg .node.new rect,
  .mermaid svg .node.new polygon,
  .mermaid svg .node.new path{stroke:var(--accent)!important;stroke-width:2px!important}
  .mermaid svg .node.gone{opacity:.7!important}
  .mermaid svg .node.gone rect,
  .mermaid svg .node.gone polygon,
  .mermaid svg .node.gone path{stroke:var(--muted)!important;stroke-dasharray:4 4!important}
  .mermaid svg .edgeLabel foreignObject{overflow:visible}
  /* mermaid writes an ID-scoped background rule per render that this can't select, so
     !important is needed on the two backgrounds; box-shadow (not padding) keeps the plate
     centred, since padding would grow it asymmetrically against a translate already computed
     without it. */
  .mermaid svg .edgeLabel .labelBkg{background:var(--panel)!important;border-radius:4px;
    box-shadow:0 0 0 5px var(--panel),0 0 0 6px var(--muted)}
  .mermaid svg span.edgeLabel{background:transparent!important;font-weight:700}
  /* Each level is its own box: only one is ever unhidden at a time (see the level script), so
     the click-to-expand wiring below treats each as its own box. It carries the panel itself
     rather than the .panel class, which would put one element in two click-to-zoom code paths
     at once. */
  .vd-symbols .mermaid{cursor:zoom-in;position:relative;max-height:min(72vh,720px);
    background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px 20px}
  .vd-symbols .mermaid:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* Same alignment idiom as h2.h2-row .ctl. */
  .vd-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:10px 0}
  /* The graph's plain-text moved list, under its note */
  .vd-moved{margin:10px 0 0;padding-left:20px;font-size:var(--fs-sm);color:var(--muted)}
  .vd-moved li{margin:4px 0}

  .fb-item{background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    padding:8px 10px;font-size:var(--fs-xs)}
  .fb-item .cw-md{overflow-wrap:anywhere}
  /* Visible landing spot for the comments panel's click-to-focus jump (see wireCommentsPanel below). */
  .fb-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* Same dashed-and-dimmed convention as .sw-gone / .hunk-cx.gone above: a structural fact,
     not a warning. */
  .fb-item.stale{border-style:dashed;opacity:.75}
  .fb-item.reply{margin-left:14px;border-left:2px solid var(--border)}
  .fb-item .q{color:var(--muted);font-style:italic;display:block;margin-bottom:4px;
    border-left:2px solid var(--yellow);padding-left:6px}
  .fb-item .s{color:var(--muted);font-size:var(--fs-xs);display:block;margin-bottom:2px}
  /* The author's own line, ahead of .s: this is what a reader scans a column of rows for, so
     it gets the row's normal size and body text colour instead of the demoted --fs-xs/--muted
     metadata treatment .s carries. .you dims an unsent draft of the reader's own so it never
     reads as an indistinguishable real login. */
  .fb-item .fb-who{display:inline;color:var(--text);font-weight:600;font-size:var(--fs-sm)}
  .fb-item .fb-who.you{color:var(--muted)}
  .fb-item .fb-head{margin-bottom:2px}
  .fb-item .fb-time{margin-left:6px;color:var(--muted);font-size:var(--fs-xs);text-decoration:none}
  .fb-item a.fb-time:hover{text-decoration:underline;color:var(--accent)}
  .fb-item a.fb-time:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* Floats left of .fb-who, same convention as .del-btn's float:right below: .fb-head simply
     flows around it, no flex wrapper needed. */
  .fb-item .fb-av{float:left;width:18px;height:18px;line-height:18px;border-radius:50%;
    margin:1px 6px 0 0;text-align:center;font-size:11px;font-weight:600;color:#fff}
  .fb-item .del-btn{float:right;background:none;border:none;color:var(--red);
    cursor:pointer;font-size:14px;padding:0 2px}
  .fb-actions{display:flex;gap:8px;margin-top:8px}
  .fb-item button{margin-left:6px}
  .fb-primary,.fb-ghost,.fb-danger{display:inline-flex;align-items:center;gap:6px;
    min-height:32px;padding:6px 12px;border:1px solid var(--border);border-radius:6px;
    font:600 var(--fs-xs) system-ui;cursor:pointer;
    transition:background .12s,transform .12s}
  .fb-primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
  .fb-primary[hidden],.fb-ghost[hidden],.fb-danger[hidden]{display:none}
  .fb-primary:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 88%,#000)}
  .fb-ghost{background:var(--panel2);color:var(--text)}
  .fb-ghost:hover:not(:disabled){background:var(--border)}
  .fb-danger{background:transparent;color:var(--red);
    border-color:color-mix(in srgb,var(--red) 55%,var(--border))}
  .fb-danger:hover:not(:disabled){background:color-mix(in srgb,var(--red) 12%,transparent)}
  .fb-primary:disabled,.fb-ghost:disabled,.fb-danger:disabled{opacity:.45;cursor:not-allowed}
  .fb-primary:active:not(:disabled),.fb-ghost:active:not(:disabled),
  .fb-danger:active:not(:disabled){transform:scale(.97)}
  .fb-primary:focus-visible,.fb-ghost:focus-visible,.fb-danger:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px}
  /* A draft's own body, inline in place of the static text node other notes render. Reuses
     .fb-item's font-size/colour; only needs its own box and full-width sizing. */
  .fb-item textarea.fb-draft-body{display:block;width:100%;margin-top:4px;
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:6px;min-height:48px;resize:vertical;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:var(--fs-sm);line-height:1.5}
  .fb-item textarea.fb-draft-body:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* A stale note's original hunk, collapsed by default (can run a screenful). A div, not
     <pre>, so it stays out of wireHunk()'s and the explanations toggle's `pre.diff`
     selectors -- this is a quoted snippet, not a commentable hunk. Reuses the page's
     `.diff .a/.d/.h/.c` colouring above, which is already scoped to any `.diff` ancestor. */
  .fb-item details{margin-top:6px}
  .fb-item details>summary{cursor:pointer;color:var(--muted);font-size:var(--fs-xs)}
  .fb-item details>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .fb-item details .diff{display:block;white-space:pre;overflow-x:auto;margin-top:6px;
    padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;
    font-family:var(--mono);font-size:var(--fs-xs)}
  .fb-item .q-label{display:block;color:var(--muted);font-size:var(--fs-xs);margin-bottom:2px}
  /* .fb-item button (0,1,1) would otherwise rely on the browser default outline alone; every
     other custom control on this page gets an explicit focus-visible ring, so these should too. */
  .fb-item button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* Persistent reply box, GitHub's own thread idiom: always visible under a thread whose root
     isn't one of my own unposted drafts, no button to reveal it. float:none/flex overrides
     .fb-av's float:left above, since this row is a single input line, not text wrapping
     around an avatar. */
  .fb-item.fb-reply{display:flex;align-items:flex-start;gap:8px}
  .fb-item.fb-reply .fb-av{float:none;flex:none}
  .fb-reply-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
  .fb-reply-box{width:100%;box-sizing:border-box;display:flex;align-items:flex-end;gap:6px;padding:3px 4px 3px 10px;
    background:var(--panel2);border:1px solid var(--border);border-radius:6px}
  .fb-reply-box:focus-within{outline:2px solid var(--accent);outline-offset:1px}
  .fb-reply-input{flex:1;min-width:0;box-sizing:border-box;min-height:26px;max-height:160px;resize:none;overflow-y:hidden;
    background:none;border:0;outline:0;color:var(--text);padding:4px 0;font:inherit;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:var(--fs-sm);line-height:18px}
  .fb-reply-box .fb-reply-send{position:relative;flex:none;width:26px;height:26px;margin:0;padding:0;border-radius:50%;
    border:0;background:var(--accent);color:var(--bg);font-size:14px;line-height:1;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center}
  .fb-reply-box .fb-reply-send[hidden]{display:none}
  .fb-reply-box .fb-reply-send:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .fb-reply-acts{display:flex;flex-wrap:wrap;gap:12px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.4}
  .fb-item .fb-quiet,.fb-actions .fb-quiet{margin:0;padding:4px 0;border:0;background:none;color:var(--muted);
    font:inherit;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:var(--fs-xs);line-height:1.4;cursor:pointer}
  .fb-item .fb-quiet:hover,.fb-actions .fb-quiet:hover{color:var(--text);text-decoration:underline}
  .fb-quiet:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .fb-item.fb-own-draft{border-left:3px dashed var(--yellow)}
  .fb-draft-tag{margin-left:6px;color:var(--yellow);font-size:var(--fs-xs)}

  /* A resolved thread collapses like a stray's .hr-lo fold above, same <details> idiom. Flex,
     same reason hr-lo>summary is below: the chip appended after the comment count (see
     buildResolutionChip) needs to wrap on a narrow screen instead of overflowing. Font,
     white-space and line-height reset for the same reason .dline-note resets them above: this
     lives inside <pre class="diff"> too (resolvedWrapFor), so without the reset the summary's
     login+path text and any un-rec'd .fb-item row inside (see buildItem) inherit the ancestor's
     monospace, nowrap and line-height:0 and never wrap; overflow-wrap covers the path segment,
     which has no spaces to break at. */
  details.hr-thread-resolved{background:var(--panel2);border:1px solid var(--border);
    border-radius:8px;padding:8px 10px;margin-top:6px;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    white-space:normal;line-height:1.6;overflow-wrap:anywhere}
  details.hr-thread-resolved>summary{cursor:pointer;color:var(--muted);font-size:var(--fs-xs);
    display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
  details.hr-thread-resolved>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  details.hr-thread-resolved .fb-item{margin-top:8px}
  details.hr-thread-resolved .hr-check{color:var(--green)}

  /* Interactive chip variants, next to the passive .chip-outdated/.chip-guess below: a control
     needs hover/active/focus states, not just a colour. chip-fix is either a <button> that
     opens #hr-resolution or an <a> straight to a ticket (see buildResolutionChip) -- same look
     either way, since both are "this chip does something" controls. chip-nofix is a plain
     <span>, not a disabled <button> -- it must stay out of tab order and never announce as a
     control, since "nothing to show" is a fact to read, not an affordance to press.
     appearance/border/font reset chip-fix back to .chip's shared box regardless of which
     element renders it, since a <button> or <a> would otherwise carry the UA control's own
     font and border. Hover/active read as a rising accent wash, same idiom as #hr-comments-btn;
     the hover box-shadow stands in for a border without adding border-width, which would grow
     the box and require animating a layout property to get there. */
  .chip-fix{appearance:none;border:0;font:inherit;font-weight:600;line-height:1.4;padding:2px 7px;
    color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);
    cursor:pointer;text-decoration:none;transition:background .2s,color .2s,box-shadow .2s}
  /* content's alt-text half (after the /) is the CSS way to say aria-hidden: there's no
     pseudo-element DOM node to hang a real attribute on. */
  .chip-fix::after{content:" ↗" / ""}
  .chip-fix:hover{background:color-mix(in srgb,var(--accent) 28%,transparent);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
  .chip-fix:active{background:color-mix(in srgb,var(--accent) 40%,transparent)}
  .chip-fix:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chip-nofix{color:var(--muted);background:var(--panel);border:1px solid var(--border)}

  /* Dialog content for whichever outcome buildResolutionContent renders: the thread's
     path:line goes in the header instead (see openResolutionDialog), so only the outcome's
     own fields need a class here. hr-resolution-why trails the sha and diff as a closing
     note, muted like the page's other secondary notes (e.g. hunk-note) rather than a
     headline competing with the snippet above it. */
  .hr-resolution-why{margin:10px 0 0;font-weight:400;color:var(--muted);font-size:var(--fs-sm);
    overflow-wrap:anywhere}
  .hr-resolution-text{margin:6px 0 0;color:var(--text);font-size:var(--fs-sm);overflow-wrap:anywhere}
  .hr-resolution-path{margin:8px 0 4px;font-family:var(--mono);font-size:var(--fs-xs);
    color:var(--muted);overflow-wrap:anywhere}

  /* Same dialog idiom as #hr-comments, just a touch wider for a diff hunk's line length. */
  #hr-resolution{width:min(640px,92vw);max-height:82vh;padding:0;background:var(--panel);
    border:1px solid var(--border);border-radius:10px;color:var(--text)}
  #hr-resolution::backdrop{background:rgba(0,0,0,.6)}
  /* Reads as a label, not a page title -- muted and small so the snippet stays the
     biggest thing in the dialog. */
  #hr-resolution-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 16px;border-bottom:1px solid var(--border);font-weight:600;
    font-family:var(--mono);font-size:var(--fs-xs);color:var(--muted);overflow-wrap:anywhere}
  #hr-resolution-close{background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:14px;line-height:1;
    flex:none;transition:background .12s}
  #hr-resolution-close:hover{background:var(--border)}
  #hr-resolution-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #hr-resolution-body{padding:14px 16px;overflow-y:auto;max-height:calc(82vh - 60px)}

  #hr-dirty{max-width:min(1400px,92vw);margin:0 auto 20px;background:var(--panel);
    border:1px solid var(--border);border-left:3px solid var(--yellow);border-radius:8px;
    padding:10px 16px;font-size:var(--fs-sm);color:var(--text)}

  #cw-dock{position:fixed;right:16px;bottom:16px;z-index:40;
    display:flex}
  #hr-comments-btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;white-space:nowrap;
    background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:999px;
    font:600 var(--fs-sm) system-ui;cursor:pointer;user-select:none;-webkit-user-select:none;
    box-shadow:0 6px 20px rgba(0,0,0,.35);transition:transform .15s,border-color .15s}
  #hr-comments-btn:hover{border-color:var(--accent)}
  #hr-comments-btn:active{transform:scale(.97)}
  #hr-comments-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cw-dock-badge{border-radius:999px;padding:1px 8px;font:600 var(--fs-xs) system-ui;
    background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
  .cw-dock-badge.purple{background:color-mix(in srgb,var(--purple) 18%,transparent);color:var(--purple)}
  .cw-dock-badge.yellow{background:color-mix(in srgb,var(--yellow) 18%,transparent);color:var(--yellow)}
  @media (max-width:480px){.cw-dock-full{display:none}}

  /* Same dialog idiom as #mermaid-zoom, sized for a list rather than a diagram. */
  #hr-comments{position:fixed;inset:0;margin:auto;width:min(560px,92vw);max-height:82vh;padding:0;background:var(--panel);
    border:1px solid var(--border);border-radius:10px;color:var(--text)}
  #hr-comments::backdrop{background:rgba(0,0,0,.6)}
  #hr-comments-head{display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600}
  #hr-comments-close{background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:14px;line-height:1;
    transition:background .12s}
  #hr-comments-close:hover{background:var(--border)}
  #hr-comments-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #hr-comments-body{padding:14px 16px;overflow-y:auto;max-height:calc(82vh - 60px)}
  #hr-comments-help{margin:0 0 12px;color:var(--muted);font-size:var(--fs-xs)}
  #hr-comments-list{list-style:none;margin:0 0 14px;padding:0;display:flex;
    flex-direction:column;gap:6px}
  #hr-comments-list button{width:100%;text-align:left;background:var(--panel2);
    border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer;
    display:flex;flex-direction:column;gap:2px;color:var(--text);transition:background .12s}
  #hr-comments-list button:hover{background:var(--border)}
  #hr-comments-list button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hr-comments-where{font-size:var(--fs-xs);color:var(--muted)}
  .hr-comments-preview{font-size:var(--fs-sm);overflow-wrap:anywhere}
  .hr-comments-empty{color:var(--muted);font-size:var(--fs-sm)}
  #hr-comments-actions button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #hr-comments-gh-note{color:var(--muted);font-size:var(--fs-xs);margin:0 0 8px}
  #hr-comments-status{min-height:1.2em;font-size:var(--fs-xs);color:var(--muted);margin:0}
  #hr-comments-reveal{display:block;width:100%;background:var(--panel2);
    border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px;
    min-height:80px;margin-top:8px;font-family:var(--mono);font-size:var(--fs-xs)}

  /* Leftover notes: one card per THREAD with no current line to ride along with (outdated, or
     its line dropped from the diff) -- see buildSnippet/strayCardFor. Folded into a collapsed
     <details> inside the stray's own file hunk, GitHub's outdated-thread idiom; only a path with
     no hunk on the page (never made the walkthrough) falls back into the #hr-leftovers section
     instead. */
  details.hr-lo{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:10px 14px;margin-bottom:12px}
  details.hunk>details.hr-lo{margin:0 14px 14px}
  /* Path, chip and count share the row now instead of one plain text string, since a card can
     carry all three where the old per-path fold only ever showed a count. */
  details.hr-lo>summary{cursor:pointer;color:var(--muted);font-size:var(--fs-sm);
    display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
  .hr-lo-path{font-family:var(--mono);overflow-wrap:anywhere;color:var(--text)}

  /* Sentence case and a small square-ish radius, not a pill: a chip here is a passive label
     riding inside a summary line, not a control. */
  .chip{display:inline-block;font-size:var(--fs-xs);padding:2px 7px;border-radius:3px;
    font-weight:600;line-height:1.4;white-space:nowrap}
  .chip-outdated,.chip-guess{color:var(--yellow);background:color-mix(in srgb,var(--yellow) 16%,transparent)}

  /* Thread-level code snippet (see buildSnippet): the ROOT note's diff_hunk, rendered once per
     thread instead of once per comment. .dl mirrors the page's own per-line comment row shape
     but stays read-only quoted code, never a commentable .dline. */
  .thread-snippet{margin:0 0 8px}
  .snip-pre{margin:0;background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    padding:8px 0;overflow-x:auto;font-family:var(--mono);font-size:var(--fs-code);line-height:1.6}
  .dl{display:flex;white-space:pre;padding:0 12px}
  /* A bare [hidden] loses to the plain .dl rule above on a specificity tie broken by source
     order; attribute+class outranks .dl on its own, scoped to just these rows rather than
     reaching for a page-wide [hidden]{display:none!important} override. */
  .dl[hidden]{display:none}
  .dl.anchor{border-left:3px solid var(--accent);margin-left:-3px;padding-left:9px;
    background:color-mix(in srgb,var(--text) 5%,var(--panel2))}
  /* Explicit, not inherited: the thread-snippet wrapper carries .diff too (for row colouring),
     so .diff's line-height:0 would otherwise leak in via .linklike's font:inherit and collapse
     these buttons/links' line box. */
  .snippet-controls{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;line-height:1.6}
  .linklike{background:none;border:none;color:var(--accent);text-decoration:underline;
    text-underline-offset:2px;cursor:pointer;font:inherit;font-size:var(--fs-xs);padding:0}
  .linklike:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  a.linklike{display:inline-block}
  details.hr-lo>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hr-lo .fb-item{margin-top:8px}

  /* per-line commenting: each commentable diff line is its own focusable control, but only
     the .dline-plus button opens a draft -- the row itself is plain text underneath, so a
     click that is really a text selection (or a copy) never fires one. */
  .dline{cursor:text;position:relative;padding-left:20px}
  .dline:hover{background:var(--panel2)}
  .dline:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .dline.has-comment{background:var(--markbg)}
  /* Same specificity and later source than .vd-flash-line below, so without this the comment
     tint would win the cascade tie and hide the flash on a line that already has one. */
  .dline.has-comment.vd-flash-line{background:color-mix(in srgb,var(--accent) 24%,transparent)}
  .dline-num{display:inline-block;min-width:32px;margin-right:8px;padding-right:8px;
    border-right:1px solid var(--border);color:var(--muted);text-align:right;user-select:none}
  /* GitHub's own idiom: a "+" in the gutter reserved by .dline's padding-left, hidden until
     hover/focus/touch-reveal. Sized off itself, not the row, so it never disturbs .diff's
     line-height:0 row layout or the number badge next to it. */
  .dline-plus{display:none;position:absolute;left:1px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;border:none;border-radius:4px;background:var(--accent);color:#fff;
    font:700 11px/1 system-ui;cursor:pointer;padding:0;user-select:none}
  .dline:hover .dline-plus,
  .dline:focus-visible .dline-plus,
  .dline.dline-touch-active .dline-plus,
  .dline.dline-sel-last .dline-plus{display:flex;align-items:center;justify-content:center}
  .dline.dline-sel-last .dline-plus{box-shadow:0 0 0 2px var(--purple)}
  /* a gradient layer, not background-color, so the added/removed tint underneath still shows */
  .dline.dline-in-sel{background-image:linear-gradient(color-mix(in srgb,var(--purple) 14%,transparent),color-mix(in srgb,var(--purple) 14%,transparent))}
  .cw-gutter .dline-num{cursor:pointer}
  .dline.cw-ref-dot:not(.dline-sel-last):not(.dline-touch-active) .dline-plus{display:none}
  .dline.dline-touch-active .cw-ref-dot-btn{display:none}
  .cw-ref-dot-btn{position:absolute;left:4px;top:50%;width:12px;height:12px;margin-top:-6px;padding:0;border:0;
    background:none;cursor:pointer}
  .cw-ref-dot-btn::after{content:'';position:absolute;left:3px;top:3px;width:6px;height:6px;border-radius:50%;
    background:var(--purple)}
  .cw-ref-dot-btn:hover::after{box-shadow:0 0 0 3px color-mix(in srgb,var(--purple) 30%,transparent)}
  .cw-ref-dot-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:50%}
  .cw-ref-dot:not(.dline){box-shadow:-6px 0 0 -3px var(--purple)}
  #cw-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:52;
    display:flex;align-items:center;gap:10px;box-sizing:border-box;width:max-content;max-width:min(420px,calc(100vw - 32px));
    padding:8px 12px;border:1px solid var(--purple);border-radius:8px;background:var(--panel2);color:var(--text);
    font-size:var(--fs-sm);box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #cw-toast:empty{display:none}
  .cw-toast-act{flex:none;background:none;border:0;padding:2px 4px;color:var(--accent);font:600 var(--fs-sm) system-ui;
    cursor:pointer;text-decoration:underline}
  .cw-toast-act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #cw-selbar{position:absolute;left:0;top:0;z-index:52;display:flex;align-items:center;gap:8px;box-sizing:border-box;
    width:max-content;max-width:calc(100vw - 16px);padding:6px 8px;background:var(--panel2);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font:var(--fs-sm) system-ui;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #cw-selbar[hidden]{display:none}
  #cw-selbar-what{font-weight:600;white-space:nowrap}
  #cw-selbar-target{min-width:0;max-width:200px;background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:6px;padding:4px 6px;font:inherit}
  #cw-selbar button{border-radius:6px;padding:4px 12px;font:600 var(--fs-sm) system-ui;cursor:pointer;white-space:nowrap}
  #cw-selbar-add{background:var(--purple);border:1px solid var(--purple);color:var(--bg)}
  #cw-selbar-add:hover{background:color-mix(in srgb,var(--purple) 85%,var(--text))}
  #cw-selbar :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cw-flash{outline:2px solid var(--purple);outline-offset:2px}
    #plan-content ::selection{background:color-mix(in srgb,var(--purple) 30%,transparent);color:inherit}
  /* Lives inside <pre class="diff">, so it inherits its monospace and its white-space:pre.
     The font is reset because this is prose, and white-space for the same reason: left on pre a
     note never wrapped, it ran off to the right (a row 382px wide holding 855px of content).
     line-height is reset too -- .diff's own line-height:0 (for collapsing its "\n" row
     separators) would otherwise collapse this prose onto one overlapping line. */
  .dline-note{display:block;margin:6px 0;white-space:normal;line-height:1.6;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}

  #cw-panel button:focus-visible,
  .cw-thread button:focus-visible,.cw-compose button:focus-visible,
  .cw-compose textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  :root{--cw-panel-w:clamp(360px,34vw,560px)}
  /* above #cw-live-banner (z 50); the drafts bar (z 45) stays below */
  #cw-panel{position:fixed;top:0;right:0;bottom:0;z-index:51;width:var(--cw-panel-w);
    display:flex;flex-direction:column;box-sizing:border-box;background:var(--panel);color:var(--text);
    border-left:1px solid var(--border);box-shadow:-8px 0 24px rgba(0,0,0,.35)}
  #cw-panel [hidden]{display:none!important}
  #cw-panel[hidden]{display:none}
  #cw-panel-grab{display:none}
  #cw-panel-resize{position:absolute;left:-4px;top:0;bottom:0;width:8px;z-index:1;cursor:col-resize;touch-action:none}
  #cw-panel-resize:hover,#cw-panel-resize:focus-visible,#cw-panel-resize.cw-dragging{background:var(--accent);opacity:.5;outline:0}
  #cw-panel-head{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;
    border-bottom:1px solid var(--border);font-weight:600}
  #cw-panel-title{flex:1 1 auto;min-width:0;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;
    -webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
  .cw-panel-icon{flex:none;width:28px;height:28px;background:var(--panel2);border:1px solid var(--border);
    color:var(--text);border-radius:6px;cursor:pointer;font-size:14px;line-height:1}
  .cw-panel-icon:hover{border-color:var(--accent)}
  #cw-panel-list,#cw-panel-thread{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  #cw-panel-rows{list-style:none;margin:0;padding:10px 14px;display:flex;flex-direction:column;gap:6px;
    flex:1 1 auto;min-height:0;overflow-y:auto}
  .cw-pr-row{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;
    background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--purple);
    color:var(--text);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit;font-size:var(--fs-sm)}
  .cw-pr-row:hover{border-top-color:var(--accent);border-right-color:var(--accent);border-bottom-color:var(--accent)}
  .cw-pr-row[data-kind="draft"]{border-left-color:var(--yellow)}
  .cw-pr-row[data-kind="pr"]{border-left-color:var(--accent)}
  .cw-pr-row[data-state="resolved"]{border-left-color:var(--green);opacity:.6}
  .cw-pr-row[data-key="new"]{opacity:.75;font-style:italic}
  #cw-panel-filters{flex:none;display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 0}
  .cw-pr-filter{background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:999px;
    padding:2px 10px;cursor:pointer;font:inherit;font-size:var(--fs-xs)}
  .cw-pr-filter[aria-pressed="true"]{border-color:var(--accent);color:var(--text)}
  .cw-pr-title{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cw-pr-meta{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--muted)}
  #cw-panel-foot{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;
    border-top:1px solid var(--border)}
  #cw-panel-submit{margin-left:auto}
  #cw-panel-status{flex:1 1 100%;margin:0;font-size:var(--fs-xs);color:var(--muted)}
  #cw-panel-status:empty{display:none}
  #cw-panel-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 14px}
  #cw-panel-compose{flex:none;min-width:0}
  #cw-panel .cw-thread{margin:0;padding:0;border-left:0;background:none}
  @media (min-width:601px) and (pointer:fine){
    .cw-panel-open #cw-dock{right:calc(var(--cw-panel-w) + 16px)}
    .cw-panel-open #cw-toast{left:calc(50% - var(--cw-panel-w)/2)}
  }
  @media (min-width:1100px) and (pointer:fine){
    .cw-panel-open body{padding-right:calc(var(--cw-panel-w) + 20px)}
  }
  @media (max-width:600px),(pointer:coarse){
    #cw-panel-resize{display:none}
    #cw-panel{top:auto;left:0;right:0;bottom:0;width:auto;border-left:0;
      border-top:1px solid var(--border);border-radius:12px 12px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.35);
      height:min(90vh,calc(100vh - 12px));
      height:min(90dvh,calc(100dvh - 12px))}
    #cw-panel[data-sheet="collapsed"]{height:56px}
    #cw-panel[data-sheet="collapsed"]>:not(#cw-panel-grab){display:none}
    .cw-typing #cw-panel{bottom:var(--cw-kb,0px);height:min(90dvh,calc(var(--cw-vvh,100dvh) - 12px))}
    #cw-panel-grab{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
      height:28px;padding:0;background:none;border:0;color:var(--text);font:600 var(--fs-sm) system-ui;cursor:pointer}
    #cw-panel-grab::before{content:'';width:36px;height:4px;border-radius:2px;background:var(--border)}
    #cw-panel[data-sheet="collapsed"] #cw-panel-grab{height:56px}
    #cw-panel[data-sheet="expanded"] .cw-grab-text{display:none}
    .cw-panel-open #cw-dock{display:none}
  }
  .cw-thread,.cw-compose{display:block;box-sizing:border-box;max-width:100%;margin:6px 0;
    padding:8px 10px;border-left:3px solid var(--purple);
    background:color-mix(in srgb,var(--purple) 8%,transparent);white-space:normal;line-height:1.6;
    font:var(--fs-sm)/1.6 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow-wrap:anywhere}
  .cw-thread [hidden]{display:none!important}
  .cw-thread-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .cw-th-resolve{margin-left:auto}
  .cw-th-badge{color:var(--purple);font-weight:600;font-size:var(--fs-xs)}
  .cw-th-triage{border:1px solid var(--border);border-radius:999px;padding:0 6px;color:var(--muted);font-size:var(--fs-xs)}
  .cw-turn{margin:8px 0}
  .cw-turn-q{margin:0;color:var(--muted);font-style:italic;overflow-wrap:anywhere;white-space:pre-wrap}

  .cw-turn-err{color:var(--red)}
  .cw-dots i{display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:50%;
    background:var(--purple);opacity:.6}
  .cw-working span+span{margin-left:4px;color:var(--muted)}

  }
  @keyframes cw-dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .cw-caret{display:inline-block;width:2px;height:1em;margin-left:1px;vertical-align:text-bottom;background:var(--purple)}
  .cw-pageedit{display:block;box-sizing:border-box;max-width:100%;margin:8px 0;padding:8px 10px;
    border-left:3px solid var(--purple);background:color-mix(in srgb,var(--purple) 6%,transparent);
    white-space:normal;overflow-wrap:anywhere}
  .cw-pageedit-label{margin:0 0 4px;color:var(--muted);font:var(--fs-xs)/1.4 system-ui,sans-serif}
  .cw-pageedit-chip{margin-left:8px;padding:0 6px;border:1px solid var(--border);border-radius:10px}
  .cw-pageedit-body>:first-child{margin-top:0}
  .cw-pageedit pre,.cw-pageedit-table{max-width:100%;overflow-x:auto}
  .cw-pageedit-err{color:var(--red);font-size:var(--fs-xs)}
  .cw-pageedit details{margin:6px 0;color:var(--muted);font-size:var(--fs-sm)}
  .cw-pageedit-orig{white-space:pre-wrap}
  .cw-pageedit-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
  .cw-pageedit button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cw-pageedit-msg{font-size:var(--fs-xs);color:var(--muted)}
  .cw-pageedit-hidden{display:none!important}
  .cw-working button{margin-left:8px}
  .cw-progress{display:block;margin-top:2px;font-size:var(--fs-xs);color:var(--muted)}
  .cw-stopped{margin-left:6px;color:var(--muted)}
  .cw-outcome{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:6px 0 0;padding:6px 8px;
    border:1px solid var(--border);border-radius:6px;background:var(--panel2)}
  .cw-outcome-text{min-width:0;flex:1 1 14em;overflow-wrap:anywhere}
  .cw-outcome-why{display:block;color:var(--muted)}
  .cw-edits{display:block}
  .cw-dc[data-state="dismissed"]{color:var(--muted)}
  .cw-edits-files{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:var(--fs-xs);overflow-wrap:anywhere}
  .cw-mode-badge{margin-left:8px;padding:0 6px;border:1px solid var(--accent);border-radius:10px;color:var(--accent);
    font:600 var(--fs-xs)/1.5 system-ui,sans-serif;vertical-align:middle}
  .cw-queued{color:var(--muted);font-size:var(--fs-xs)}

  .cw-denied ul{margin:2px 0 0;padding-left:18px;color:var(--muted);overflow-wrap:anywhere}
  .cw-outcome-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .cw-ghdraft{display:block;border-color:var(--yellow);border-left:3px dashed var(--yellow);
    background:color-mix(in srgb,var(--yellow) 8%,transparent);white-space:normal;overflow-wrap:anywhere}
  .cw-ghdraft[data-state="published"]{border-color:var(--green);border-left:3px solid var(--green);
    background:color-mix(in srgb,var(--green) 8%,transparent)}

    background:var(--panel2);color:var(--muted)}
  .cw-ghdraft-badge{margin:0;color:var(--yellow);font-weight:600;font-size:var(--fs-xs)}
  .cw-ghdraft[data-state="published"] .cw-ghdraft-badge{color:var(--green)}
  .cw-ghdraft[data-state="dismissed"] .cw-ghdraft-badge{color:var(--muted)}
  .cw-ghdraft-target{margin:2px 0 6px;color:var(--muted);font-size:var(--fs-xs)}
  .cw-ghdraft-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:0 0 6px}
  .cw-ghdraft-col{min-width:0}
  .cw-ghdraft-col h4{margin:0 0 2px;color:var(--muted);font:600 var(--fs-xs) system-ui}
  .cw-ghdraft-body{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
  .cw-ghdraft textarea{display:block;width:100%;min-height:64px;box-sizing:border-box;margin:0 0 6px;

  /* 44px minimum tap target on touch, kept last in the sheet on purpose: #mermaid-zoom-close
     carries an unconditional rule elsewhere (width/height) at this same ID specificity, and a

  @media (pointer:coarse){

    .cw-ed{min-height:88px}

    .fb-reply-box .fb-reply-send::before{content:'';position:absolute;inset:-9px}
    .fb-item .fb-quiet,.fb-actions .fb-quiet{min-height:44px}
    /* Hit area grows, visible size doesn't: a 44px button here would overlap the line number
       and the row above/below. ::before extends the tappable region on all sides instead,
       via inset rather than negative margins, so it never adds to .dline-plus's own box and

<body>
<div id="hr-dirty" role="status" hidden>Commits since this page was built.</div>

<!-- Ahead of #plan-content in source order (fixed visual position is unchanged) so a keyboard
     user reaches this button without tabbing through every commentable diff line first. -->
<div id="cw-dock"><button type="button" id="hr-comments-btn" aria-haspopup="dialog">Comments <span class="cw-dock-badge">0</span></button></div>
<dialog id="hr-comments" aria-label="Your comments">
  <div id="hr-comments-head">
    <span>Your comments</span>
    <button type="button" id="hr-comments-close" aria-label="Close comments panel">✕</button>
  </div>
  <div id="hr-comments-body">
    <p id="hr-comments-help">Copy gh command posts these yourself, right now, when there is a
