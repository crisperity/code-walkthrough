      const d=localDrafts().length, r=pendingResolveSet.size, show=canGhCommand&&(d>0||r>0);
      const ths=document.getElementById('cw-panel-submit');
      if(ths){ ths.hidden=!show; ths.textContent='Submit review \u00b7 '+(d+r); }
    }
    refreshPanelSubmit=updatePanelSubmit;

    let nonce=null, lastResolves=[], full=[], excluded=new Set(), review={pending:false,comments:0},
      loading=false, posting=false, starting=false, done=false, seq=0, opener=postBtn, progress=new Map(), failedNoteIds=[];

    const selectedIds=()=>full.filter(n=>!excluded.has(n.id)).map(n=>n.id);

    function syncSend(){
      const rc=selEvent()==='REQUEST_CHANGES'&&!summary.value.trim();
      const idle=!selectedIds().length&&!lastResolves.length&&!review.pending;
      sendBtn.disabled=nonce==null||loading||posting||done||rc||idle;
    }

    function renderRows(){
      notesList.innerHTML='';
      for(const n of full){
        const li=document.createElement('li');
        const label=document.createElement('label');
        const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!excluded.has(n.id);
        cb.addEventListener('change',()=>{
          if(cb.checked) excluded.delete(n.id); else excluded.add(n.id);
          preview(true);
        });
        const w=document.createElement('span'); w.className='hr-comments-where';
        const parent=n.reply_to&&state.notes.find(x=>x.id===n.reply_to);
        w.textContent=(n.reply_to?(parent&&parent.author?'reply to '+parent.author:'reply')+' at ':'')+where(n);
        label.append(cb,w);
        const pre=document.createElement('pre'); pre.textContent=firstLine(n.body);
        li.append(label,pre);
        notesList.appendChild(li);
      }
    }

    function renderRest(data){
      resolvesList.innerHTML='';
      for(const r of data.resolves||[]){
        const li=document.createElement('li');
        const w=document.createElement('div'); w.className='hr-comments-where';
        w.textContent='resolve thread at '+where(r);
        const pre=document.createElement('pre'); pre.textContent=firstLine(r.body);
        li.append(w,pre);
        resolvesList.appendChild(li);
      }
      inReviewList.innerHTML='';
      for(const n of data.in_review||[]){
        const li=document.createElement('li');
        li.textContent='already in your pending review: '+where(n)+' '+firstLine(n.body);
        inReviewList.appendChild(li);
      }
      review=data.review||{pending:false,comments:0};
      pendingNote.hidden=!review.pending;
      pendingNote.textContent='You already have a pending review on GitHub with '+review.comments
        +' comments. They will be submitted with this review.';
      const own=data.own_pr===true;
      const approve=evRadios.find(r=>r.value==='APPROVE');
      approve.disabled=own;
      approveNote.hidden=!own;
      approveNote.textContent=own?"You can't approve your own pull request.":'';
      if(own&&approve.checked) evRadios[0].checked=true;
    }

    function resetLocal(ids){
      let changed=false;
      for(const id of ids||[]){
        const m=state.notes.find(x=>x.id===id);
        if(m&&m.state!=='draft'){ m.state='draft'; changed=true; }
      }
      if(changed){ persistLocal(); renderNotes(); updatePanelSubmit(); }
    }

    function preview(narrow){
      const mine=++seq;
      loading=true; syncSend();
      status.textContent='Loading…';
      const req={resolve:[...pendingResolveSet]};
      if(narrow) req.ids=selectedIds();
      return fetch(window.CW_LIVE.api+'/post/preview',{
        method:'POST',headers:headers(),body:JSON.stringify(req),
      }).then(r=>r.json().then(body=>({ok:r.ok,body})))
        .then(({ok,body})=>{
          if(mine!==seq) return;
          loading=false;
          if(!ok){ nonce=null; status.textContent=errText(body); syncSend(); return; }
          status.textContent='';
          actionsEl.hidden=false;
          resetLocal(body.reset);
          nonce=body.nonce; lastResolves=body.resolves||[];
          if(!narrow){ full=body.notes||[]; excluded.clear(); renderRows(); }
          renderRest(body);
          syncSend();
        })
        .catch(()=>{
          if(mine!==seq) return;
          loading=false; nonce=null;
          status.textContent='Request failed -- check the daemon is still running.';
          syncSend();
        });
    }

    function resetDialog(){
      excluded=new Set(); full=[]; nonce=null; done=false; posting=false;
      progress=new Map(); itemsList.innerHTML=''; partial.hidden=true; actionsEl.hidden=false; status.textContent='';
      notesList.innerHTML=''; resolvesList.innerHTML=''; inReviewList.innerHTML='';
      pendingNote.hidden=true; approveNote.hidden=true;
      evRadios.forEach(r=>{ r.checked=r.value==='COMMENT'; r.disabled=false; });
      summary.value=''; options.open=false; cancelBtn.textContent='Cancel';
      const pr=state.meta&&state.meta.pr;
      titleEl.textContent=pr!=null?'Submit review on #'+pr:'Submit review';
      syncSend();
    }

    function start(from){
      if(starting||posting||dlg.open) return;
      starting=true;
      opener=from;
      from.disabled=true;
      putNotesNow(false).then(()=>{
        from.disabled=false; starting=false;
        if(dlg.open) return;
        resetDialog();
        dlg.showModal();
        preview(false);
      },()=>{ from.disabled=false; starting=false; });
    }
    postBtn.addEventListener('click',()=>start(postBtn));
    openSubmitReview=from=>start(from||postBtn);

    evRadios.forEach(r=>r.addEventListener('change',syncSend));
    summary.addEventListener('input',syncSend);
    const closeIdle=()=>{ if(!posting) dlg.close(); };
    close.addEventListener('click',closeIdle);
    cancelBtn.addEventListener('click',closeIdle);
    leaveBtn.addEventListener('click',closeIdle);
    backdropClose(dlg,closeIdle);
    dlg.addEventListener('cancel',e=>{ if(posting) e.preventDefault(); });
    dlg.addEventListener('close',()=>{
      const o=opener&&opener.isConnected&&!opener.hidden&&!opener.disabled&&opener.offsetParent!==null?opener
        :document.getElementById('hr-comments-btn')||document.body;
      o.focus();
    });

    function setRow(key,text){
      let li=progress.get(key);
      if(!li){ li=document.createElement('li'); progress.set(key,li); itemsList.appendChild(li); }
      li.textContent=text;
    }
    const rowText=(label,item,okText)=>(item.ok?'✓ ':'✗ ')+label+(item.ok?' '+okText:': '+(item.error||'failed'));

    window.__cwOnPosted=item=>{
      if(!item) return;
      if(item.kind==='note'){
        const n=full.find(x=>x.id===item.id);
        setRow('note:'+item.id,rowText(n?where(n):item.id,item,'in your pending review'));
        const mine=state.notes.find(x=>x.id===item.id);
        if(item.ok&&mine&&mine.state==='draft'){ mine.state='in_review'; persistLocal(); renderNotes(); }
      } else if(item.kind==='submit'){
        setRow('submit',rowText('submit review'+(item.event?' ('+item.event+')':''),item,'done'));
      } else if(item.kind==='resolve'){
        const r=lastResolves.find(x=>x.thread_id===item.id);
        setRow('resolve:'+item.id,rowText(r?'resolve '+where(r):'resolve '+item.id,item,'resolved'));
      }
    };

    function prefillRows(){
      progress=new Map(); itemsList.innerHTML='';
      for(const n of full) if(!excluded.has(n.id)) setRow('note:'+n.id,'… '+where(n));
      for(const r of lastResolves) setRow('resolve:'+r.thread_id,'… resolve '+where(r));
    }

    function clearResolved(body){
      const ok=new Set((body.results||[]).filter(r=>r.kind==='resolve'&&r.ok).map(r=>r.id));
      lastResolves.filter(r=>ok.has(r.thread_id)).forEach(r=>clearPendingResolve(r.root_id));
    }

    function finish(body){
      if(body.ok){
        clearResolved(body);
        done=true; status.textContent='Review submitted.'; cancelBtn.textContent='Close';
      } else if(body.partial){
        clearResolved(body);
        const kindOf=id=>((body.results||[]).find(r=>r.id===id)||{}).kind;
        const failed=body.failed||[];
        const failedNotes=failed.filter(f=>kindOf(f.id)==='note');
        const failedResolves=failed.filter(f=>kindOf(f.id)==='resolve');
        const submitFailed=failed.some(f=>f.id==='submit');
        const n=body.in_review||0, k=failedNotes.length;
        let text=k
          ?n+' of '+(n+k)+(n+k===1?' comment is':' comments are')+' in your pending review, which only you can see. '
            +k+' failed and '+(k===1?'is still a local draft.':'are still local drafts.')
          :plural(n,'comment')+(n===1?' is':' are')+' in your pending review, which only you can see.';
        if(failedResolves.length) text+=' '+plural(failedResolves.length,'thread')+' could not be resolved: '+(failedResolves[0].error||'unknown error')+'.';
        if(submitFailed) text+=' Submitting it failed: '+((failed.find(f=>f.id==='submit')||{}).error||'unknown error')+'.';
        partialText.textContent=text;
        failedNoteIds=failedNotes.map(f=>f.id);
        nowBtn.textContent='Submit the '+n+' now';
        retryBtn.onclick=k?retry:submitNow;
        partial.hidden=false; actionsEl.hidden=true; status.textContent='';
        syncSend();
        return;
      } else {
        clearResolved(body);
        done=true; status.textContent=body.render_error||body.error||'Posted with errors.';
      }
      partial.hidden=true; syncSend();
    }

    function postJson(payload){
      posting=true; syncSend();
      status.textContent='Posting…';
      return fetch(window.CW_LIVE.api+'/post',{
        method:'POST',headers:headers(),body:JSON.stringify(payload),
      }).then(r=>r.json().then(body=>({ok:r.ok,status:r.status,body})))
        .then(({ok,status:code,body})=>{
          posting=false;
          if(!ok){
            progress=new Map(); itemsList.innerHTML='';
            status.textContent=errText(body);
            if(code===409&&body.error==='changed since preview'){
              partial.hidden=true;
              preview(false).then(()=>{ if(nonce!=null) status.textContent='The list changed since you opened this; review it again.'; });
            }
            syncSend();
            return;
          }
          finish(body);
        })
        .catch(()=>{
          posting=false;
          progress=new Map(); itemsList.innerHTML='';
          status.textContent='Request failed -- check the daemon is still running.';
          syncSend();
        });
    }

    function send(){
      if(nonce==null) return;
      partial.hidden=true; prefillRows();
      return postJson({nonce,resolve:[...pendingResolveSet],ids:selectedIds(),
        event:selEvent(),body:summary.value});
    }
    function retry(){
      partial.hidden=true;
      const only=new Set(failedNoteIds);
      preview(false).then(()=>{
        if(nonce==null) return;
        excluded=new Set(full.filter(n=>!only.has(n.id)).map(n=>n.id));
        renderRows();
        return preview(true).then(()=>{ if(nonce!=null) send(); });
      });
    }
    function submitNow(){
      partial.hidden=true;
      return postJson({submit_only:true,event:selEvent(),body:summary.value,resolve:[...pendingResolveSet]});
    }
    sendBtn.addEventListener('click',send);
    nowBtn.addEventListener('click',submitNow);
    updatePanelSubmit();
  }

  function wireCommentsPanel(){
    const btn=$('hr-comments-btn'), dlg=$('hr-comments'), close=$('hr-comments-close'),
      list=$('hr-comments-list'), ghBtn=$('hr-comments-gh-btn'), ghNote=$('hr-comments-gh-note'),
      status=$('hr-comments-status'), reveal=$('hr-comments-reveal');
    if(!btn||!dlg||!close||!list||!ghBtn||!ghNote||!status||!reveal) return;

    function renderList(){
      const notes=myNotesForPanel();
      dockSet(btn,'Comments',[{text:notes.length}]);
      list.innerHTML='';
      if(!notes.length){
        const li=document.createElement('li'); li.className='hr-comments-empty';
        li.textContent='No comments yet -- click a diff line to add one.';
        list.appendChild(li);
        return;
      }
      for(const n of notes){
        const li=document.createElement('li');
        const row=document.createElement('button'); row.type='button';
        const where=document.createElement('span'); where.className='hr-comments-where';
        where.textContent=n.path+':'+n.line;
        const preview=document.createElement('span'); preview.className='hr-comments-preview';
        preview.textContent=n.body?(n.body.length>80?n.body.slice(0,80)+'…':n.body):'(empty draft)';
        row.append(where,preview);
        row.addEventListener('click',()=>{
          dlg.close();
          const rec=rowById.get(n.id);
          const target=rec?rec.el:(spanByLineKey.get(n.path+'\t'+n.side+'\t'+n.line)||{}).span;
          if(target){ openAncestorDetails(target); target.focus(); }
        });
        li.appendChild(row);
        list.appendChild(li);
      }
    }
    refreshCommentsPanel=renderList;

    function copyText(text,onSuccess){
      const manual=()=>{
        status.textContent='Copy failed -- select the text below and copy it by hand.';
        reveal.hidden=false; reveal.value=text; reveal.focus(); reveal.select();
      };
      if(navigator.clipboard&&navigator.clipboard.writeText){
        try{
          navigator.clipboard.writeText(text).then(onSuccess)
            .catch(()=>{ if(legacyCopy(text)) onSuccess(); else manual(); });
        }catch(e){
          if(legacyCopy(text)) onSuccess(); else manual();
        }
      } else if(legacyCopy(text)){
        onSuccess();
      } else {
        manual();
      }
    }

    const canGhCommand=!!(state.meta&&state.meta.pr!=null&&state.meta.head_pushed);
    if(!canGhCommand){
      ghBtn.hidden=true;
      ghNote.hidden=false;
      ghNote.textContent=(state.meta&&state.meta.pr==null)
        ?'No PR for this comparison.'
        :'The compared commit has not been pushed yet.';
    }
    if(window.CW_LIVE){
      ghBtn.hidden=true;
      wirePost(canGhCommand);
    }

    ghBtn.addEventListener('click',()=>{
      reveal.hidden=true;
      const byId=new Map(state.notes.map(n=>[n.id,n]));
      // Only non-stale local drafts go in the block; a reply whose parent hasn't posted yet
      // (no gh_id to address with in_reply_to) is left out and counted instead.
      const drafts=state.notes.filter(n=>n.state==='draft'&&n.origin==='local'&&!n.stale);
      const blocks=[]; let skipped=0, posted=0;
      for(const n of drafts){
        const replyTo=n.reply_to||n.in_reply_to;
        let payload;
        if(replyTo){
          const parent=byId.get(replyTo);
          if(!parent||parent.gh_id==null){ skipped++; continue; }
          payload={body:n.body,in_reply_to:parent.gh_id};
        } else {
          payload={body:n.body,commit_id:state.meta.head_sha,path:n.path,line:n.line,side:n.side};
        }
        // JSON.stringify escapes the body; the heredoc delimiter is quoted so the shell never
        // interprets anything inside it.
        blocks.push("gh api repos/"+state.meta.repo+"/pulls/"+state.meta.pr+"/comments --input - <<'HR'\n"
          +JSON.stringify(payload)+"\nHR");
        posted++;
      }
      // One RESOLVE_THREAD_MUTATION block per thread the reader marked resolved locally.
      let resolved=0;
      for(const rootId of pendingResolveSet){
        const root=byId.get(rootId);
        if(!root||!root.gh_thread_id) continue;
        resolved++;
        const payload={query:RESOLVE_THREAD_MUTATION,variables:{id:root.gh_thread_id}};
        blocks.push("gh api graphql --input - <<'HR'\n"+JSON.stringify(payload)+"\nHR");
      }
      if(!blocks.length){
        status.textContent='Nothing ready to post.'
          +(skipped?' ('+skipped+' reply skipped -- parent not posted yet)':'');
        return;
      }
      const parts=[];
      if(posted) parts.push(posted+' gh command'+(posted===1?'':'s'));
      if(resolved) parts.push(resolved+' resolve mutation'+(resolved===1?'':'s'));
      copyText(blocks.join('\n'),()=>{
        status.textContent='Copied '+parts.join(' and ')+'.'
          +(skipped?' ('+skipped+' reply skipped -- parent not posted yet)':'');
      });
    });

    btn.addEventListener('click',()=>{
      renderList();
      status.textContent='';
      reveal.hidden=true;
      dlg.showModal();
    });
    close.addEventListener('click',()=>dlg.close());
    backdropClose(dlg,()=>dlg.close());
    // Esc also fires this (the dialog's default cancel behaviour closes it), so both paths
    // return focus to the button that opened it, same as the mermaid zoom dialog's own close.
    dlg.addEventListener('close',()=>{ btn.focus(); });

    renderList();
  }

  // #hr-resolution has many possible openers (one chip per resolved thread), unlike
  // #hr-comments' single button -- openResolutionDialog stashes the clicked chip in
  // resolutionOpener so close can focus the right one back.
  function wireResolutionDialog(){
    const dlg=$('hr-resolution'), close=$('hr-resolution-close');
    if(!dlg||!close) return;
    close.addEventListener('click',()=>dlg.close());
    dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });
    dlg.addEventListener('close',()=>{ if(resolutionOpener) resolutionOpener.focus(); });
  }

  function closestDline(node){
    const el=node&&(node.nodeType===1?node:node.parentElement);
    return el&&el.closest('.dline');
  }

  function selectionEndRow(range){
    let end=closestDline(range.endContainer);
    const start=closestDline(range.startContainer);
    if(!end||end===start) return end;
    if(range.endContainer===end&&range.endOffset>1) return end;
    const tail=range.cloneRange(); tail.setStart(end,0);
    const frag=tail.cloneContents();
    frag.querySelectorAll('.dline-num,.dline-plus').forEach(n=>n.remove());
    if(frag.textContent.trim()) return end;
    for(let p=end.previousElementSibling;p;p=p.previousElementSibling) if(p.classList.contains('dline')) return p;
    return end;
  }

  function blockKeyFrom(sectionSlug,text){
    const t=String(text).replace(/\s+/g,' ').trim();
    let h=0x811c9dc5;
    for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
    const slug=String(sectionSlug||'').replace(/[^A-Za-z0-9:_.-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,150);
    return (slug+'|'+h.toString(16).padStart(8,'0')).slice(0,200);
  }

  function refFenceFor(body){
    let run=0;
    for(const m of String(body||'').matchAll(/`+/g)) run=Math.max(run,m[0].length);
    return '`'.repeat(Math.max(3,run+1));
  }

  const REF_OPEN_RE=/^(`{3,})ref (.+)$/;
  const REF_LINE_HEAD=/^ref (?:"((?:[^"\\]|\\.)*)"|(\S+)):(\d+)(?:-(\d+))? (LEFT|RIGHT)$/;
  const REF_BLOCK_HEAD=/^ref ([A-Za-z0-9:_.|-]{1,200})(?: ("(?:[^"\\]|\\.)*"))?$/;

  function refHeader(r){
    const a=r.anchor;
    if(a.kind==='line'){
      const p=/[\s"]/.test(a.path)?JSON.stringify(a.path):a.path;
      return 'ref '+p+':'+a.line+(a.end_line?'-'+a.end_line:'')+' '+a.side;
    }
    return 'ref '+a.block+(r.label?' '+JSON.stringify(r.label):'');
  }

  function refFence(r){
    const q=r.anchor.quote, f=refFenceFor(q);
    return f+refHeader(r)+'\n'+(q?q+'\n':'')+f;
  }

  const REF_MAX_ROWS=500;
  const refEnd=a=>Math.min(a.end_line||a.line,a.line+REF_MAX_ROWS-1);

  function parseRefHeader(h){
    let m=REF_LINE_HEAD.exec(h);
    if(m){
      const line=+m[3], end=m[4]==null?null:+m[4];
      if(line<1||(end!=null&&(end<line||end-line>=REF_MAX_ROWS))) return null;
      let path=m[2];
      if(m[1]!=null){ try{ path=JSON.parse('"'+m[1]+'"'); }catch(e){ return null; } }
      if(!path) return null;
      return {kind:'line',path,line,end_line:end>line?end:null,side:m[5]};
    }
    m=REF_BLOCK_HEAD.exec(h);
    if(!m) return null;
    let label=null;
    if(m[2]){ try{ label=JSON.parse(m[2]); }catch(e){ return null; } }
    return {kind:'block',block:m[1],label:typeof label==='string'?label:null};
  }

  function serializeSegs(segs){
    let out='', owed=false;
    for(const s of segs){
      if(typeof s==='string'){
        if(!s) continue;
        if(owed){ out+='\n'; owed=false; }
        out+=s;
      } else {
        if(out){ out+='\n'; owed=false; }
        out+=refFence(s);
        owed=true;
      }
    }
    return out;
  }

  function parseRefText(text){
    const lines=String(text).replace(/\r\n?/g,'\n').split('\n'), out=[];
    let run=[];
    const flush=()=>{ const t=run.join('\n'); if(t) out.push({text:t}); run=[]; };
    for(let i=0;i<lines.length;i++){
      const m=REF_OPEN_RE.exec(lines[i]);
      const ref=m&&parseRefHeader('ref '+m[2]);
      if(ref){
        const close=new RegExp('^'+m[1]+'`*[ \\t]*$');
        let j=i+1;
        while(j<lines.length&&!close.test(lines[j])) j++;
        if(j<lines.length){ flush(); out.push({ref,body:lines.slice(i+1,j).join('\n')}); i=j; continue; }
      }
      run.push(lines[i]);
    }
    flush();
    return out;
  }

  // Counts every row the Threads panel lists, per filter chip; resolved rows stay listed
  // (dimmed) but are not counted, so the label, dock badge and chips agree.
  function panelCounts(entries){
    const c={all:0,agent:0,pr:0,drafts:0};
    for(const e of entries){
      if(e.state==='resolved') continue;
      c.all++; c[e.kind==='draft'?'drafts':e.kind]++;
    }
    return c;
  }

  function wireAsk(){
    const planEl=$('plan-content');
    if(!planEl) return;

    const BLOCK_SEL='p,li,pre,table,blockquote,h2,h3,h4,.fact,.panel';
    const norm=s=>String(s).replace(/\s+/g,' ').trim();
    const mkBtn=(text,cls)=>{ const b=mk('button',cls,text); b.type='button'; return b; };
    const firstLine=s=>String(s||'').split('\n')[0].slice(0,100);
    const headers=()=>({'X-CW-Token':window.CW_LIVE.token,'Content-Type':'application/json'});
    const asEl=node=>node&&(node.nodeType===1?node:node.parentElement);
    const inLiveUi=node=>{ const el=asEl(node); return !!(el&&el.closest('.cw-thread,.cw-compose,.cw-pageedit')); };
    const LIVE_SEL='.cw-thread,.cw-compose,.cw-pageedit,.fb-item,.dline-plus,.cw-ref-dot-btn';

    function textOf(el){
      if(!el.querySelector(LIVE_SEL)) return el.textContent;
      const c=el.cloneNode(true);
      c.querySelectorAll(LIVE_SEL).forEach(n=>n.remove());
      return c.textContent;
    }

    function blockOf(node){
      const el=asEl(node);
      if(!el) return null;
      const b=el.closest(BLOCK_SEL);
      if(b&&b!==planEl&&planEl.contains(b)) return b;
      const w=el.closest('[id]');
      return w&&w!==planEl&&planEl.contains(w)?w:null;
    }

    function sectionIdOf(el){
      for(let n=el;n&&n!==planEl;n=n.parentElement) if(n.id) return n.id;
      return '';
    }

    function sectionHeadingOf(el){
      let found=null;
      for(const h of planEl.querySelectorAll('h2,h3')){
        if(h===el||(h.compareDocumentPosition(el)&Node.DOCUMENT_POSITION_FOLLOWING)) found=h;
        else break;
      }
      return found?found.textContent.trim():(document.title||'');
    }

    function blockKey(el){
      return blockKeyFrom(sectionIdOf(el)||sectionHeadingOf(el),textOf(el));
    }

    let blockIdx=null;
    function blockIndex(){
      if(blockIdx) return blockIdx;
      blockIdx={list:[],byKey:new Map(),pos:new Map()};
      let section=document.title||'', n=0;
      planEl.querySelectorAll(BLOCK_SEL).forEach(el=>{
        if(el.closest(LIVE_SEL)) return;
        const k=blockKey(el);
        blockIdx.list.push({el,text:norm(textOf(el))});
        if(!blockIdx.byKey.has(k)) blockIdx.byKey.set(k,el);
        if(el.matches('h2,h3')){ section=el.textContent.trim(); n=0; } else n++;
        blockIdx.pos.set(el,{section,n});
      });
      return blockIdx;
    }

    let settleTimer=null;
    new MutationObserver(()=>{
      blockIdx=null;
      clearTimeout(settleTimer);
      settleTimer=setTimeout(resyncPageEdits,300);
    }).observe(planEl,{childList:true,subtree:true,characterData:true});
    if(document.readyState!=='complete') addEventListener('load',()=>resyncPageEdits());

    function proseLabel(el){
      const p=blockIndex().pos.get(el);
      return p?(p.n?p.section+' · ¶'+p.n:p.section):sectionHeadingOf(el);
    }

    function lineRangeAnchor(startSpan,endSpan){
      const sm=lineMetaBySpan.get(startSpan), rows=[];
      let on=false;
      for(const c of startSpan.parentElement.children){
        if(c===startSpan) on=true;
        const m=lineMetaBySpan.get(c);
        if(on&&m) rows.push(m);
        if(c===endSpan) break;
      }
      const last=rows.filter(m=>m.side===sm.side).pop();
      return {kind:'line',path:sm.path,side:sm.side,line:sm.line,
        end_line:last.line!==sm.line?last.line:null,hunk_id:sm.hunkId||null,quote:rows.map(m=>m.text).join('\n')};
    }

    function buildAskAnchor(sel){
      const range=sel.getRangeAt(0);
      const ss=closestDline(range.startContainer), es=selectionEndRow(range);
      if(lineMetaBySpan.get(ss)&&lineMetaBySpan.get(es)) return lineRangeAnchor(ss,es);
      const b=blockOf(range.startContainer);
      if(!b) return null;
      return {kind:'block',block:blockKey(b),section:sectionHeadingOf(b),quote:sel.toString()};
    }

    function placementFor(anchor){
      if(anchor.kind==='thread'){
        const root=noteById(anchor.note_id);
        if(!root) return null;
        let last=null, lastOrder=-1;
        for(const n of state.notes){
          if(n.id!==root.id&&n.reply_to!==root.id) continue;
          const rec=rowById.get(n.id);
          if(rec&&rec.el.isConnected&&(n.order||0)>=lastOrder){ last=rec.el; lastOrder=n.order||0; }
        }
        return last&&!last.closest('.hr-lo,.hr-thread-resolved')?last:null;
      }
      if(anchor.kind==='line'){
        const rec=spanByLineKey.get(anchor.path+'\t'+anchor.side+'\t'+(anchor.end_line||anchor.line));
        return rec&&rec.span;
      }
      const idx=blockIndex();
      if(anchor.block&&idx.byKey.has(anchor.block)) return idx.byKey.get(anchor.block);
      const q=norm(anchor.quote||'').slice(0,60);
      if(q){
        const hit=idx.list.find(b=>b.text.includes(q));
        if(hit) return hit.el;
      }
      if(anchor.section){
        return [...planEl.querySelectorAll('h1,h2,h3,h4')].find(h=>h.textContent.trim()===anchor.section)||null;
      }
      return null;
    }

    function directDraftFor(anchor){
      if(!anchor||anchor.kind!=='line'||!anchor.path||!anchor.side||!anchor.line) return null;
      return text=>{
        const rec=spanByLineKey.get(anchor.path+'\t'+anchor.side+'\t'+anchor.line);
        const m=rec?rec.meta:{};
        const note=newDraft({
          path:anchor.path,line:anchor.line,side:anchor.side,end_line:anchor.end_line||null,
          hunk_id:anchor.hunk_id||m.hunkId||null,anchor_text:m.text||anchor.quote,anchor_line:anchor.line,
          order:m.order!=null?m.order:Math.max(0,...state.notes.map(x=>x.order||0))+1,
        });
        note.body=text;
        saveNote(note);
        renderNotes();
      };
    }

    function makeComposer({header,onDraft,onCancel}){
      const hasPr=!!(state.meta&&state.meta.pr!=null);
      const tx=hasPr?{btn:'Add to review',ph:'Comment for the PR review',
        note:'Saved as a draft. Posts to the PR when you Submit review.'}
        :{btn:'Save note',ph:'Write a note',note:'Saved as a note on this page.'};
      const box=mk('div','cw-compose'); box.dataset.mode='pr';
      const head=mk('div','cw-compose-head');
      head.append(mk('span','cw-compose-title',header));
      const ta=mk('textarea','cw-compose-text');
      ta.placeholder=tx.ph; ta.setAttribute('aria-label',tx.ph);
      const send=mkBtn(tx.btn,'cw-send fb-primary');
      const row=mk('div','fb-actions'); row.append(send);
      const cancelBtn=mkBtn('Cancel','cw-cancel fb-ghost'); row.append(cancelBtn);
      const hint=mk('span','cw-compose-hint','Esc closes, Ctrl+Enter saves');
      const note=mk('p','cw-compose-note'); note.append(mk('span',null,tx.note),hint);
      const status=mk('p','cw-compose-status'); status.setAttribute('role','status');
      const prompt=mk('div','fb-actions cw-discard'); prompt.hidden=true;
      const keepBtn=mkBtn('Keep editing','fb-ghost'), dropBtn=mkBtn('Discard','fb-danger');
      const btns=mk('div','cw-discard-btns'); btns.append(keepBtn,dropBtn);
      prompt.append(mk('span','cw-discard-q','Discard this comment?'),btns);
      box.append(head,ta,note,row,prompt,status);
      const isEmpty=()=>!ta.value.trim();
      const prompting=()=>!prompt.hidden;
      const sync=()=>{ send.disabled=isEmpty(); };
      function keepEditing(){ prompt.hidden=true; row.hidden=false; ta.focus(); }
      function cancel(){
        if(isEmpty()){ onCancel(); return; }
        row.hidden=true; prompt.hidden=false; keepBtn.focus();
      }
      function nudge(){
        status.textContent='Finish or discard this comment first.';
        ta.focus();
        box.classList.remove('cw-nudge'); void box.offsetWidth; box.classList.add('cw-nudge');
        setTimeout(()=>box.classList.remove('cw-nudge'),900);
      }
      const act=()=>{
        if(send.disabled) return;
        onDraft(ta.value);
        onCancel();
      };
      send.addEventListener('click',act);
      cancelBtn.addEventListener('click',cancel);
      keepBtn.addEventListener('click',keepEditing);
      dropBtn.addEventListener('click',()=>onCancel());
      ta.addEventListener('input',sync);
      ta.addEventListener('keydown',e=>{
        if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); act(); }
      });
      sync();
      return {box,ta,send,isEmpty,prompting,keepEditing,cancel,nudge,sync};
    }

    function lineComposerOpts(anchor){
      const rec=spanByLineKey.get(anchor.path+'\t'+anchor.side+'\t'+anchor.line);
      const first=rec&&rec.meta.text?rec.meta.text[0]:' ';
      const kind=anchor.side==='LEFT'?'removed (old file)':first==='+'?'added':'context';
      const lines=anchor.end_line?'Lines '+anchor.line+'-'+anchor.end_line:'Line '+anchor.line;
      return lines+' ('+kind+')';
    }

    const threads=new Map();
    function triageCandidates(notes,turnsByNote){
      return notes.filter(n=>{
        if(n.origin!=='github'||!n.gh_thread_id||n.reply_to||n.in_reply_to||n.resolved) return false;
        const turns=(turnsByNote&&turnsByNote.get(n.id))||[];
        return !turns.some(r=>r.source==='triage'||r.status==='pending');
      });
    }
    function waitingCount(outcomes){
      let c=0;
      for(const o of outcomes) if(o&&o.state==='proposed') c++;
      return c;
    }
    function stateOf(t){
      if(t.resolved) return 'resolved';
      if(t.turns.some(r=>r.status==='pending')) return 'working';
      const last=t.turns[t.turns.length-1];
      return last&&last.status==='error'?'error':'answered';
    }

    function checkLine(c){
      const cmd=String(c&&c.command||'');
      if(c&&c.ok===true) return cmd+' passed';
      return cmd+(c&&typeof c.exit==='number'?' failed (exit '+c.exit+')':' did not run');
    }
    function cherryPickCommand(sha){
      const s=String(sha||'');
      return /^[0-9a-f]{7,40}$/i.test(s)?'git cherry-pick '+s:null;
    }
    function handoverInstruction(id,oid){
      const idPart=id?' with id '+JSON.stringify(String(id))+' and':' with';
      return 'In the code-walkthrough MCP server, call walkthrough_get'+idPart+' parts ["threads"], then do the handed task with oid '+
        JSON.stringify(String(oid))+' in my checkout and call walkthrough_reply with thread_id from that task, that oid and a short summary as text.';
    }
    function taskPlanFromForm(title,steps,files){
      const lines=(s,n)=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,n);
      return {title:String(title||'').trim(),steps:lines(steps,12),files:lines(files,20)};
    }

    const streams=new Map();         // qid -> {seq,text,progress}
    const outcomesByQid=new Map();   // qid -> Map(oid -> folded outcome record)
    const streamElsOf=qid=>[...document.querySelectorAll('.cw-streaming')].filter(e=>e.dataset.qid===qid);
    const progressElsOf=qid=>[...document.querySelectorAll('.cw-progress')].filter(e=>e.dataset.qid===qid);
    function progressText(p){
      if(!p) return '';
      if(typeof p==='string') return p;
      const d=p.detail||'';
      if(p.tool==='Read') return 'Reading '+d;
      if(/^(Edit|Write)$/.test(p.tool)) return 'Editing '+d;
      if(p.tool==='propose_task') return 'Planning a code task';
      if(p.tool==='Grep') return 'Searching for '+d;
      if(p.tool==='Glob') return 'Listing files';
      if(p.tool==='propose_resolve') return 'Suggesting a resolve';
      if(p.tool==='propose_page_edit') return 'Editing the page';
      if(p.tool==='propose_github_draft') return 'Drafting a GitHub comment';
      if(p.tool==='queued') return 'Queued behind '+d;
      if(p.tool==='Bash') return d?'Running '+d:'Running a command';
      return p.tool||'';
    }
    const noteById=id=>state.notes.find(n=>n.id===id);

    function postJson(path,body){
      return fetch(window.CW_LIVE.api+path,{method:'POST',headers:headers(),body:JSON.stringify(body||{})})
        .then(r=>r.json().catch(()=>({})).then(b=>({ok:r.ok,status:r.status,body:b})));
    }

    function stopBtn(t,r){
      const b=mkBtn('Stop','cw-stop fb-ghost');
      b.addEventListener('click',()=>{
        b.disabled=true;
        postJson('/comment/'+encodeURIComponent(r.qid)+'/cancel',{})
          .then(({ok,status,body})=>{ if(!ok&&status!==404){ b.disabled=false; t.msg.textContent=body.error||'Request failed'; } })
          .catch(()=>{ b.disabled=false; t.msg.textContent='Request failed -- check the daemon is still running.'; });
      });
      return b;
    }

    const turnRefs=r=>(r.anchors||[r.anchor]).filter(a=>a&&a.kind!=='free');
    function retryBtn(t,r){
      const b=mkBtn('Retry','cw-retry fb-ghost');
      b.addEventListener('click',()=>{
        b.disabled=true; t.msg.textContent='';
        const body={anchors:turnRefs(r),text:r.comment||r.question||'',thread_id:t.id};
        postJson('/comment',body)
          .then(({ok,body})=>{ if(!ok){ b.disabled=false; t.msg.textContent=body.error||'Request failed'; } })
          .catch(()=>{ b.disabled=false; t.msg.textContent='Request failed -- check the daemon is still running.'; });
      });
      return b;
    }

    const pageEdits=new Map();   // oid -> {node, orig, sig}
    const hiddenBy=new WeakMap();   // original element -> Set of applied replace oids hiding it
    let peSeq=0;

    function renderMermaidEdit(pre,src){
      const id='cw-pe-'+(peSeq++);
      const cleanup=()=>{ const d=document.getElementById('d'+id); if(d) d.remove(); };
      const fail=()=>{
        cleanup();
        pre.classList.remove('mermaid');
        pre.after(mk('p','cw-pageedit-err','The diagram failed to render; showing its source.'));
      };
      if(!window.mermaid){ fail(); return; }
      window.mermaid.render(id,src).then(({svg})=>{
        cleanup();
        const doc=new DOMParser().parseFromString(svg,'image/svg+xml');
        if(doc.querySelector('parsererror')) throw new Error('bad svg');
        pre.replaceChildren(document.importNode(doc.documentElement,true));
      }).catch(fail);
    }

    function pageEditContent(b){
      const text=String((b&&b.text)||'');
      const box=mk('div','cw-pageedit-body');
      if(b&&b.type==='mermaid') box.append(mk('pre','mermaid',text));
      else if(b&&b.type==='list') box.append(mdEl(text.split('\n').map(l=>/^\s*([-*]|\d+\.)\s/.test(l)?l:'- '+l.trim()).join('\n')));
      else box.append(mdEl(text));
      return box;
    }

    function pageEditTarget(o){
      const t=threads.get(o.thread_id);
      const t0=(t&&t.turns[0])||{};
      const a=(t0.anchors&&t0.anchors.find(x=>x.kind==='block'||x.kind==='section'))||t0.anchor||{};
      const target=o.payload&&o.payload.target;
      const heading=a.section&&[...planEl.querySelectorAll('h1,h2,h3,h4')].find(x=>x.textContent.trim()===a.section);
      if(a.kind==='section'&&target===a.section) return {el:heading||null,outdated:!heading};
      const idx=blockIndex();
      const el=target&&idx.byKey.get(target);
      if(el) return {el,outdated:false};
      const q=norm(a.quote||'').slice(0,60);
      const hit=q&&idx.list.find(b=>b.text.includes(q));
      return {el:hit?hit.el:heading||null,outdated:true};
    }

    function resyncPageEdits(){
      for(const [oid,cur] of [...pageEdits]){
        if(!cur.node.isConnected||!cur.outdated) continue;
        const d=pageEditTarget(cur.o);
        if(d.el!==cur.destEl||!d.outdated){ removePageEdit(oid); syncPageEdit(cur.o); }
      }
    }

    function pageEditAct(oid,verb,btn,msg){
      btn.disabled=true; msg.textContent='';
      postJson('/outcomes/'+encodeURIComponent(oid)+'/'+verb,{})
        .then(({ok,body})=>{
          if(!ok||!body.outcome){ btn.disabled=false; msg.textContent=(body&&body.error)||'Request failed'; loadQa(); return; }
          upsertOutcome(body.outcome);
        })
        .catch(()=>{ btn.disabled=false; msg.textContent='Request failed -- check the daemon is still running.'; });
    }

    function openThreadOf(t){ openPanel({thread:t.id}); }

    function removePageEdit(oid){
      const cur=pageEdits.get(oid);
      if(!cur) return;
      cur.node.remove();
      if(cur.orig){
        const s=hiddenBy.get(cur.orig);
        if(s){ s.delete(oid); if(!s.size){ hiddenBy.delete(cur.orig); cur.orig.classList.remove('cw-pageedit-hidden'); } }
      }
      pageEdits.delete(oid);
    }

    function syncPageEdit(o){
      const p=o.payload||{};
      const sig=JSON.stringify(p);
      const cur=pageEdits.get(o.oid);
      if(cur&&cur.sig===sig&&o.state==='applied') return;
      removePageEdit(o.oid);
      const t=threads.get(o.thread_id);
      if(o.state!=='applied'||!t) return;
      const dest=pageEditTarget(o);
      const n=mk('div','cw-pageedit'); n.dataset.oid=o.oid;
      const label=mk('p','cw-pageedit-label','added by agent from your comment');
      if(dest.outdated) label.append(mk('span','cw-pageedit-chip','outdated'));
      const msg=mk('span','cw-pageedit-msg'); msg.setAttribute('role','status');
      const undo=mkBtn('Undo','fb-ghost');
      undo.addEventListener('click',()=>pageEditAct(o.oid,'revert',undo,msg));
      const open=mkBtn('Open thread','fb-ghost');
      open.addEventListener('click',()=>openThreadOf(t));
      const acts=mk('div','cw-pageedit-actions'); acts.append(undo,open,msg);
      n.append(label,pageEditContent(p.block));
      let orig=null;
      if(p.op==='replace'&&dest.el&&!dest.outdated){
        orig=dest.el;
        const det=document.createElement('details');
        det.append(mk('summary',null,'original'),mk('p','cw-pageedit-orig',textOf(orig)));
        n.append(det);
        if(!hiddenBy.has(orig)) hiddenBy.set(orig,new Set());
        hiddenBy.get(orig).add(o.oid);
        orig.classList.add('cw-pageedit-hidden');
      }
      n.append(acts);
      if(dest.el) dest.el.insertAdjacentElement('afterend',n); else planEl.prepend(n);
      pageEdits.set(o.oid,{node:n,orig,sig,o,outdated:dest.outdated,destEl:dest.el});
      n.querySelectorAll('pre.mermaid').forEach(pre=>renderMermaidEdit(pre,pre.textContent));
    }

    function syncThreadEdits(tid){
      for(const m of outcomesByQid.values())
        for(const o of m.values()) if(o.thread_id===tid&&o.outcome==='page_edit') syncPageEdit(o);
    }

    function pageEditWhat(p){
      const noun={prose:'prose',list:'a list',mermaid:'a diagram'}[(p.block||{}).type]||'a block';
      return p.op==='replace'?'replaced this block with '+noun:'added '+noun+' after this block';
    }

      }

    const ghKept=new Map();
    const ghEdit=new Map();
    const ghMsg=new Map();
    const errText=b=>((b&&b.error)||'Request failed')+(b&&b.remedy?' ('+b.remedy+')':'');
    const NET_ERR='Request failed -- check the daemon is still running.';

    function findOutcome(oid){
      for(const m of outcomesByQid.values()) if(m.has(oid)) return m.get(oid);
      return null;
    }

    function setGhMsg(oid,text){
      ghMsg.set(oid,text);
      document.querySelectorAll('.cw-ghdraft-msg').forEach(e=>{ if(e.dataset.oid===oid) e.textContent=text; });
    }

    outcomeHooks.oidFor=noteId=>{
      for(const [oid,nid] of ghKept) if(nid===noteId) return oid;
      for(const m of outcomesByQid.values())
        for(const o of m.values())
          if(o.outcome==='github_draft'&&o.payload&&o.payload.note_id===noteId
            &&o.state!=='published'&&o.state!=='dismissed') return o.oid;
      return null;
    };
    outcomeHooks.published=(oid,url)=>{
      const rec=findOutcome(oid);
      if(!rec) return;
      upsertOutcome(Object.assign({},rec,{state:'published',
        payload:Object.assign({},rec.payload,url?{gh_url:url}:{})}));
    };

    function createGhDraft(p){
      const tg=p.target||{};
      const f=ghDraftFields(tg,tg.kind==='reply'?noteById(tg.note_id):null);
      if(!f) return null;
      const order=Math.max(0,...state.notes.map(x=>x.order||0))+1;
      let extra={order};
      if(tg.kind==='new'){
        const rec=spanByLineKey.get(f.path+'\t'+f.side+'\t'+f.line);
        const m=rec?rec.meta:{};
        extra={hunk_id:f.hunk_id||m.hunkId||null,anchor_text:m.text||'',anchor_line:f.line,
          order:m.order!=null?m.order:order};
      }
      const note=newDraft(Object.assign({},f,extra));
      note.body=p.body;
      saveNote(note);
      renderNotes();
      return note;
    }

    function ghAct(o,verb,body,btns,beforeUpsert){
      btns.forEach(b=>{ b.disabled=true; });
      setGhMsg(o.oid,'');
      return postJson('/outcomes/'+encodeURIComponent(o.oid)+'/'+verb,body)
        .then(({ok,body:b})=>{
          if(!ok||!b.outcome){ btns.forEach(x=>{ x.disabled=false; }); setGhMsg(o.oid,errText(b)); loadQa(); return false; }
          if(beforeUpsert) beforeUpsert();
          upsertOutcome(b.outcome);
          return true;
        })
        .catch(()=>{ btns.forEach(x=>{ x.disabled=false; }); setGhMsg(o.oid,NET_ERR); return false; });
    }

    function ghKeep(o,btns){
      const p=o.payload||{};
      const have=p.note_id||ghKept.get(o.oid);
      const existing=have&&noteById(have);
      if(existing) return Promise.resolve(existing);
      const note=createGhDraft(p);
      if(!note){ setGhMsg(o.oid,'This comment points at a thread that is no longer on the page.'); return Promise.resolve(null); }
      ghKept.set(o.oid,note.id);
      return ghAct(o,'keep',{note_id:note.id},btns).then(ok=>ok?note:null);
    }

    function ghPublish(o,btns){
      btns.forEach(b=>{ b.disabled=true; });
      ghKeep(o,btns).then(note=>{
        if(!note){ btns.forEach(b=>{ b.disabled=false; }); return; }
        btns.forEach(b=>{ b.disabled=true; });
        return publishNote(note,o.oid,txt=>setGhMsg(o.oid,txt)).then(ok=>{
          if(!ok) btns.forEach(b=>{ b.disabled=false; });
        });
      });
    }

    function ghTargetText(tg){
      const loc=(tg.path||'')+(tg.line!=null?':'+tg.line:'');
      if(tg.kind==='reply'){
        const root=noteById(tg.note_id);
        return 'reply to '+((root&&root.author)||'the reviewer')+' at '+loc;
      }
      return 'new review comment, '+loc+(tg.side?' '+tg.side:'');
    }

    function ghDraftCard(t,o){
      const p=o.payload||{}, tg=p.target||{};
      const body=String(p.body||''), orig=typeof p.original==='string'?p.original:body;
      const d=mk('div','cw-outcome cw-ghdraft'); d.dataset.oid=o.oid; d.dataset.state=o.state;
      const badge={proposed:'GitHub draft, not published',kept:'Kept as a draft',
        published:'Published',dismissed:'Dismissed'}[o.state]||'GitHub draft, not published';
      d.append(mk('p','cw-ghdraft-badge',badge),mk('p','cw-ghdraft-target',ghTargetText(tg)));
      const msg=mk('p','cw-ghdraft-msg',ghMsg.get(o.oid)||''); msg.dataset.oid=o.oid; msg.setAttribute('role','status');
      const acts=mk('div','cw-ghdraft-actions');
      if(o.state==='proposed'&&ghEdit.has(o.oid)){
        const ta=mk('textarea'); ta.value=ghEdit.get(o.oid); ta.setAttribute('aria-label','Edit the drafted comment');
        const save=mkBtn('Save','fb-ghost'), cancel=mkBtn('Cancel','fb-ghost');
        const cancelEdit=()=>{ ghEdit.delete(o.oid); renderThread(t); };
        ta.addEventListener('input',()=>ghEdit.set(o.oid,ta.value));
        const doSave=()=>{
          if(!ta.value.trim()){ setGhMsg(o.oid,'Type a comment first.'); return; }
          ghAct(o,'edit',{payload:{body:ta.value}},[save,cancel],()=>ghEdit.delete(o.oid));
        };
        save.addEventListener('click',doSave);
        cancel.addEventListener('click',cancelEdit);
        ta.addEventListener('keydown',e=>{
          if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); doSave(); }
          else if(e.key==='Escape'){ e.preventDefault(); cancelEdit(); }
        });
        acts.append(save,cancel);
        d.append(ta,acts,msg);
        return d;
      }
      if(orig&&orig!==body){
        const cols=mk('div','cw-ghdraft-cols');
        const col=(h,txt)=>{ const c=mk('div','cw-ghdraft-col'); c.append(mk('h4',null,h),mk('p','cw-ghdraft-body',txt)); return c; };
        cols.append(col('Original (your words)',orig),col('Drafted',body));
        d.append(cols);
      } else d.append(mk('p','cw-ghdraft-body',body));
      if(o.state==='proposed'||o.state==='kept'){
        const btns=[];
        const add=(text,cls,fn)=>{ const b=mkBtn(text,cls); b.addEventListener('click',fn); btns.push(b); acts.append(b); return b; };
        if(o.state==='proposed') add('Keep as draft','cw-gh-keep fb-ghost',()=>{ ghKeep(o,btns); });
        else add('Jump','cw-gh-jump fb-ghost',()=>{
          const rec=rowById.get(p.note_id||ghKept.get(o.oid));
          if(rec){ openAncestorDetails(rec.el); rec.el.scrollIntoView({block:'center'}); rec.el.focus(); }
        });
        if(window.crypto&&window.crypto.subtle){
          const pb=add('Publish now','cw-gh-publish fb-ghost',()=>ghPublish(o,btns));
          const nid=p.note_id||ghKept.get(o.oid);
          if(nid){ pb.dataset.publishFor=nid; pb.disabled=publishing.has(nid); }
        }
        if(o.state==='proposed'){
          if(orig&&orig!==body) add('Use my words','cw-gh-verbatim fb-ghost',()=>{ ghAct(o,'verbatim',{},btns); });
          add('Edit','cw-gh-edit fb-ghost',()=>{ ghEdit.set(o.oid,body); renderThread(t); });
          add('Dismiss','cw-gh-dismiss fb-ghost',()=>{ ghAct(o,'dismiss',{},btns); });
        }
      } else if(o.state==='published'){
        const url=p.gh_url||o.gh_url;
        if(typeof url==='string'&&/^https:\/\//.test(url)){
          const a=mk('a','cw-gh-link','View on GitHub'); a.href=url; a.target='_blank'; a.rel='noopener noreferrer';
          acts.append(a);
        }
      }
      d.append(acts,msg);
      return d;
    }

    const taskEdit=new Map();
    const taskMsg=new Map();
    function setTaskMsg(oid,text){
      taskMsg.set(oid,text);
      document.querySelectorAll('.cw-task-msg').forEach(e=>{ if(e.dataset.oid===oid) e.textContent=text; });
    }

    function taskAct(o,path,body,btns,beforeUpsert){
      btns.forEach(b=>{ b.disabled=true; });
      setTaskMsg(o.oid,'');
      return postJson(path,body)
        .then(({ok,body:b})=>{
          if(!ok||(b&&b.error)){ btns.forEach(x=>{ x.disabled=false; }); setTaskMsg(o.oid,errText(b)); return null; }
          if(beforeUpsert) beforeUpsert();
          if(b.outcome) upsertOutcome(b.outcome);
          return b;
        })
        .catch(()=>{ btns.forEach(x=>{ x.disabled=false; }); setTaskMsg(o.oid,NET_ERR); return null; });
    }

    function openPage(oid,r){
      if(typeof r.url==='string'&&/^(https?:\/\/|\/[^\/])/.test(r.url)){
        if(!window.open(r.url,'_blank','noopener')) setTaskMsg(oid,'The browser blocked the new tab. Allow pop-ups, then press the button again.');
      } else setTaskMsg(oid,'No page to open.');
    }
    function showSibling(o,b,btns){
      const label=b.textContent, oidPath=verb=>'/outcomes/'+encodeURIComponent(o.oid)+'/'+verb;
      b.textContent='Opening...';
      taskAct(o,oidPath('show'),{},btns).then(r=>{
        b.textContent=label;
        if(!r) return;
        openPage(o.oid,r);
        btns.forEach(x=>{ x.disabled=false; });
      });
    }

    function copyTask(text,msgOid){
      const ok=()=>setTaskMsg(msgOid,'Copied.');
      const fb=()=>{ if(legacyCopy(text)) ok(); else setTaskMsg(msgOid,'Copy failed in this browser.'); };
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok).catch(fb);
      else fb();
    }

    function taskEditForm(t,o,d,msg){
      const draft=taskEdit.get(o.oid);
      const f=el=>{ el.dataset.oid=o.oid; return el; };
      const field=(label,el)=>{ const l=mk('label',null,label); l.append(el); return l; };
      const title=f(mk('input')); title.type='text'; title.value=draft.title; title.className='cw-task-in-title';
      const steps=f(mk('textarea')); steps.value=draft.steps; steps.rows=5; steps.className='cw-task-in-steps';
      const files=f(mk('textarea')); files.value=draft.files; files.rows=3; files.className='cw-task-in-files';
      const sync=()=>taskEdit.set(o.oid,{title:title.value,steps:steps.value,files:files.value});
      [title,steps,files].forEach(el=>el.addEventListener('input',sync));
      const save=mkBtn('Save','fb-ghost'), cancel=mkBtn('Cancel','fb-ghost');
      const cancelEdit=()=>{ taskEdit.delete(o.oid); renderThread(t); };
      const doSave=()=>{
        const plan=taskPlanFromForm(title.value,steps.value,files.value);
        if(!plan.title||!plan.steps.length){ setTaskMsg(o.oid,'Add a title and at least one step.'); return; }
        taskAct(o,'/outcomes/'+encodeURIComponent(o.oid)+'/edit',{payload:plan},[save,cancel],()=>taskEdit.delete(o.oid));
      };
      save.addEventListener('click',doSave);
      cancel.addEventListener('click',cancelEdit);
      d.addEventListener('keydown',e=>{
        if(e.key==='Escape'){ e.preventDefault(); cancelEdit(); }
        else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); doSave(); }
      });
      const acts=mk('div','cw-task-actions'); acts.append(save,cancel);
      d.append(field('Title',title),field('Steps, one per line (up to 12)',steps),
        field('Files, one per line (up to 20)',files),acts,msg);
    }

    function checksEl(task){
      const cs=Array.isArray(task.checks)?task.checks:[];
      if(!cs.length) return null;
      const box=mk('div','cw-task-files','Checks');
      const ul=document.createElement('ul');
      for(const c of cs){
        const li=document.createElement('li');
        if(c.tail){
          const dt=document.createElement('details'); dt.append(mk('summary',null,checkLine(c)));
          const pre=document.createElement('pre'); pre.textContent=String(c.tail); dt.append(pre); li.append(dt);
        } else li.textContent=checkLine(c);
        ul.append(li);
      }
      box.append(ul);
      return box;
    }

    function taskCard(t,o){
      const p=o.payload||{}, task=p.task||{};
      const d=mk('div','cw-outcome cw-task'); d.dataset.oid=o.oid; d.dataset.state=o.state;
      const msg=mk('p','cw-task-msg',taskMsg.get(o.oid)||''); msg.dataset.oid=o.oid; msg.setAttribute('role','status');
      const title=String(p.title||'');
      if(o.state==='dismissed'||o.state==='discarded'){
        d.append(mk('p','cw-task-badge','Code task '+o.state+': '+title));
        return d;
      }
      const handedDone=o.state==='done'&&task.handed===true;
      const badge={proposed:'Code task, waits for you',handed:'Handed to your session',running:'Code task, running',
        done:handedDone?'Done by your session':'Done',failed:'Code task failed',stopped:'Stopped'}[o.state]||'Code task';
      const bd=mk('p','cw-task-badge',badge);
      if(o.state==='proposed'&&p.edited) bd.append(mk('span',null,' (edited by you)'));
      d.append(bd);
      if(o.state==='proposed'&&taskEdit.has(o.oid)){ taskEditForm(t,o,d,msg); return d; }
      d.append(mk('p','cw-task-title',title));
      const acts=mk('div','cw-task-actions');
      const btns=[];
      const add=(text,cls,fn)=>{ const b=mkBtn(text,'fb-ghost'+(cls?' '+cls:'')); b.addEventListener('click',()=>fn(b)); btns.push(b); acts.append(b); return b; };
      const oidPath=verb=>'/outcomes/'+encodeURIComponent(o.oid)+'/'+verb;
      if(o.state==='proposed'||o.state==='handed'){
        const ol=document.createElement('ol');
        for(const s of (p.steps||[])) ol.append(mk('li',null,s));
        d.append(ol);
        if((p.files||[]).length) d.append(mk('p','cw-task-files','Files: '+p.files.join(', ')));
      }
      if(o.state==='handed'){
        const wid=(window.CW_LIVE||{}).id;
        const inst=handoverInstruction(wid,o.oid);
        const pre=mk('pre','cw-task-handover'); pre.append(mk('code',null,inst)); pre.tabIndex=0;
        d.append(pre);
        if(wid) add('Copy instruction',null,()=>copyTask(inst,o.oid));
        add('Dismiss',null,()=>taskAct(o,oidPath('dismiss'),{},btns));
        d.append(acts,mk('p','cw-task-note','Waiting for your session to reply. Nothing runs here.'),msg);
        return d;
      }
      if(o.state==='proposed'){
        add('Run in scratch worktree','cw-task-run',()=>taskAct(o,oidPath('run'),{},btns));
        add('Hand to my session','cw-task-hand',()=>taskAct(o,oidPath('handover'),{},btns));
        add('Edit plan',null,()=>{
          taskEdit.set(o.oid,{title,steps:(p.steps||[]).join('\n'),files:(p.files||[]).join('\n')});
          renderThread(t);
          const first=[...document.querySelectorAll('.cw-task-in-title')].find(e=>e.dataset.oid===o.oid);
          if(first) first.focus();
        });
        add('Dismiss',null,()=>taskAct(o,oidPath('dismiss'),{},btns));
        d.append(acts,mk('p','cw-task-note','Writes to a separate worktree and a local branch. Never pushed. Or hand it to your own Claude Code session, which edits your real checkout with your permission prompts.'),msg);
        return d;
      }
      if(o.state==='running'){
        const dots=mk('span','cw-dots'); dots.setAttribute('aria-hidden','true');
        for(let i=0;i<3;i++) dots.appendChild(document.createElement('i'));
        const prog=mk('span','cw-progress',progressText((streams.get(task.qid)||{}).progress));
        prog.dataset.qid=task.qid||'';
        const w=mk('p','cw-working'); w.append(dots,mk('span',null,'Working in a scratch worktree'),prog);
        d.append(w);
        if(task.qid) add('Stop',null,()=>taskAct(o,'/comment/'+encodeURIComponent(task.qid)+'/cancel',{},btns));
        d.append(acts,msg);
        return d;
      }
      if(handedDone){
        if(task.summary) d.append(mk('p','cw-task-sum',task.summary));
        d.append(msg);
        return d;
      }
      if(o.state==='done'){
        if(task.stat) d.append(mk('p','cw-task-stat',task.stat));
        const fl=Array.isArray(task.files)?task.files:[];
        if(fl.length){
          const ul=document.createElement('ul');
          for(const f of fl){
            const li=mk('li',null,String(f.path||'')+' ');
            li.append(mk('span','cw-task-add','+'+(f.add||0)),document.createTextNode(' '),mk('span','cw-task-del','-'+(f.del||0)));
            ul.append(li);
          }
          d.append(ul);
        }
        if(task.branch){ const bp=mk('p','cw-task-files','Branch: '); bp.append(mk('code',null,task.branch)); d.append(bp); }
        if(task.summary) d.append(mk('p','cw-task-sum',task.summary));
        { const ce=checksEl(task); if(ce) d.append(ce); }
        add('Show with this change',null,b=>showSibling(o,b,btns));
        const cp=cherryPickCommand(task.sha);
        if(cp) add('Copy cherry-pick command',null,()=>copyTask(cp,o.oid));
        add('Discard',null,()=>taskAct(o,oidPath('discard'),{},btns));
        d.append(acts,msg);
        return d;
      }
      d.append(mk('p','cw-task-sum',o.state==='failed'?(task.error||'The task failed.'):'The task was stopped before it finished.'));
      { const ce=checksEl(task); if(ce) d.append(ce); }
      add('Discard',null,()=>taskAct(o,oidPath('discard'),{},btns));
      d.append(acts,msg);
      return d;
    }
