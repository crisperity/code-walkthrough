<script>
(async () => {
  if (!window.mermaid) return;
  const v = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  mermaid.initialize({
    // The graph's two levels render themselves explicitly below instead of through this
    // sweep (see there for why); the scoped, awaited loop below covers FLOW, the only other
    // `.mermaid` block, one element at a time -- awaited so FLOW's render finishes before the
    // levels start theirs, since mermaid's id/def bookkeeping is shared across every render call
    // on the page and two in flight at once can corrupt each other's.
    startOnLoad: false,
    securityLevel: 'strict',
    theme: 'base',
    fontFamily: v('--mono'),
    // A raw "Syntax error in text / mermaid version 11.15.0" box where a diagram should be
    // blames the source, when what actually failed is usually dagre's cluster layout on a wide
    // graph; stop mermaid painting that over the startOnLoad diagrams.
    suppressErrorRendering: true,
    // Default is 500 and the whole-repo module map ran to 477 before it was capped, close
    // enough that a slightly bigger repo would have hit the ceiling instead of the cap.
    maxEdges: 2000,
    flowchart: { useMaxWidth: false },
    sequence: { useMaxWidth: false },
    themeVariables: {
      background: v('--panel'), primaryColor: v('--panel2'),
      primaryTextColor: v('--text'), primaryBorderColor: v('--border'),
      // A default (un-linkStyled) edge falls back to this; --muted reads as near-invisible
      // grey against the dark background. --text is the page's own highest-contrast
      // foreground colour in both schemes, so the edge reads as clearly as the labels it
      // connects.
      lineColor: v('--text'), textColor: v('--text'),
      clusterBkg: v('--bg'), clusterBorder: v('--border'),
      tertiaryColor: v('--bg'), tertiaryBorderColor: v('--border'),
      edgeLabelBackground: v('--panel')
    }
  });
  // ponytail: theme is read once at load. Flipping the OS theme with the page open leaves
  // the diagram on the old palette. Reload fixes it. Re-render on a
  // matchMedia('(prefers-color-scheme: dark)') change listener if that ever gets annoying.
  // One element at a time, each in its own try/catch: a batched `mermaid.run()` call fails
  // every element it was given on a single throw, even a sibling it had already written a
  // working svg for moments earlier. This also keeps a FLOW failure from aborting this whole
  // IIFE, which would otherwise leave every graph level permanently hidden too.
  // svg has no z-index; g.root paints its children in document order -- clusters, edgePaths,
  // edgeLabels, nodes -- so a node box painted after an edge path or an edge label covers it
  // wherever they overlap: an arrow crossing a box, or a count badge landing on one, both
  // disappear underneath it. Moving nodes, then edgePaths, then edgeLabels to the end of
  // g.root -- each appendChild relocates an existing child, so calling in this order reorders
  // regardless of the starting position -- leaves clusters, nodes, edgePaths, edgeLabels: an
  // arrow now paints above the boxes it crosses, and its count badge above the arrow. Shared
  // here rather than duplicated at each render call site below, since the zoom overlay's
  // cloneNode(true) runs later and inherits whatever order this leaves.
  function reorderEdgeLayers(el) {
    const root = el.querySelector('svg g.root');
    if (!root) return;
    const nodes = root.querySelector(':scope > g.nodes');
    const edgePaths = root.querySelector(':scope > g.edgePaths');
    const edgeLabels = root.querySelector(':scope > g.edgeLabels');
    if (nodes) root.appendChild(nodes);
    if (edgePaths) root.appendChild(edgePaths);
    if (edgeLabels) root.appendChild(edgeLabels);
  }

  let flowSeq = 0;
  for (const el of document.querySelectorAll('.mermaid:not([data-level])')) {
    try {
      const { svg } = await mermaid.render('vd-flow-' + (flowSeq++), el.textContent, el);
      el.innerHTML = svg;
      reorderEdgeLayers(el);
    } catch (_) {
      el.textContent = 'Diagram failed to render.';
      el.classList.add('vd-failed');
    }
  }

  // The graph's two levels (sections.py --kind symbols): mermaid.render() measures label
  // sizes against the container it's given, and a `hidden`/display:none container measures
  // everything as 0 and collapses the diagram (measured viewBox "-8 -8 16 16" against a correct
  // "0 0 598.157 494"). Each level is unhidden and moved off-screen -- real layout, just not on
  // screen -- only for the duration of its own render call.
  // Renders still run one at a time, now across every root rather than per root: mermaid's
  // id/def bookkeeping is shared page-wide, so two in-flight calls from different roots
  // collide exactly like two clicks on one toggle did before.
  let chain = Promise.resolve();
  let seq = 0;
  for (const root of document.querySelectorAll('.vd-symbols')) {
    const rootId = seq++;
    const toggle = root.querySelector('.vd-level-toggle');
    const levels = [...root.querySelectorAll('.mermaid[data-level]')];
    if (!toggle || !levels.length) continue;
    let names = [];
    try { names = JSON.parse(toggle.dataset.names || '[]'); } catch (_) { names = []; }
    // sections.py picks the opening level: it drops to packages when the symbols level holds
    // more boxes than are worth laying out before the reader has asked for them.
    let level = Number(root.dataset.default) || 2;
    const rendered = new Set();

    // The label is the level you are on, so the accessible name has to carry both that and what
    // activating does -- a button reading "packages" tells a screen reader nothing on its own.
    // `level` moves the moment the toggle is clicked, not when the render it queued finishes, so
    // a second click during a slow first render still flips to the other level rather than
    // re-requesting the one already on its way.
    function showLevel(n) { const target = Number(n); level = target; chain = chain.then(() => applyLevel(target)); return chain; }

    async function applyLevel(n) {
      // Each level renders the first time it is shown, not all of them up front: an explain-mode
      // symbols level can carry hundreds of boxes, and mermaid laying that out at load blocks the
      // page before anyone has switched to it.
      const target = levels.find(el => el.dataset.level === String(n));
      if (target && !rendered.has(target)) { rendered.add(target); await renderLevel(target); }
      levels.forEach(el => { el.hidden = el.dataset.level !== String(n); });
      const here = (names[n - 1] || '').toLowerCase();
      const other = (names[n === 1 ? 1 : 0] || '').toLowerCase();
      toggle.textContent = here;
      toggle.setAttribute('aria-label',
        'Detail level: ' + here + '. Activate to show ' + other + '.');
      // The key belongs to the level that draws those nodes, so it travels with the graph
      // rather than sitting in the heading explaining states that are not on screen.
      const stale = toggle.parentNode.querySelector('.vd-legend');
      if (stale) stale.remove();
      const shown = levels.find(el => !el.hidden);
      if (shown && shown.dataset.legend) toggle.insertAdjacentHTML('beforebegin', shown.dataset.legend);
    }
    toggle.addEventListener('click', () => { showLevel(level === 1 ? 2 : 1); });

    function fail(el, n) {
      el.textContent = (names[n - 1] || ('Level ' + n)) + ' failed to render.';
      el.classList.add('vd-failed');
    }
    // A real diagram never comes out this small -- this is the exact signature of the
    // collapsed-measurement bug this script replaces, so it's treated as a render failure
    // rather than shipped silently.
    function degenerate(svg) {
      const box = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
      return box.length !== 4 || box.some(Number.isNaN) || box[2] < 32 || box[3] < 32;
    }

    async function renderLevel(el) {
      const source = el.textContent;
      const n = el.dataset.level;
      el.hidden = false;
      el.style.position = 'absolute';
      el.style.left = '-99999px';
      try {
        // Levels are keyed by root too, not just by n: two roots each showing "level 2" would
        // otherwise collide on the same mermaid render id.
        const { svg } = await mermaid.render('vd-level-' + rootId + '-' + n, source, el);
        el.innerHTML = svg;
        reorderEdgeLayers(el);
        const svgEl = el.querySelector('svg');
        if (!svgEl || degenerate(svgEl)) fail(el, n);
      } catch (_) {
        fail(el, n);
      }
      el.style.position = '';
      el.style.left = '';
      el.hidden = true; // showLevel() below unhides only the level the slider actually wants
    }

    // Inside a closed <details> (the "All symbols" section) mermaid measures the labels as
    // zero and degenerate() would mark the render failed, so it waits for the first open.
    const closed = root.closest('details');
    if (closed && !closed.open) {
      let opened = false;
      closed.addEventListener('toggle', () => {
        if (closed.open && !opened) { opened = true; showLevel(level); }
      });
    } else {
      await showLevel(level);
    }
  }
})();
</script>
<script>
(function(){
  const dlg=document.getElementById('mermaid-zoom');
  const zbody=document.getElementById('mermaid-zoom-body');
  // Lets every `.mermaid svg ...` rule reach the clone below, no duplicate rule needed. Added
  // here rather than in the static markup: the FLOW-sweep script above already ran its
  // `.mermaid:not([data-level])` querySelectorAll before this executes, so tagging it only now
  // keeps this element out of that sweep.
  zbody.classList.add('mermaid');
  const zctl=document.getElementById('mermaid-zoom-controls');
  document.getElementById('mermaid-zoom-close').onclick=()=>dlg.close();
  dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });

  // Node menu (jump-to-file, focus-downstream) for any graph tagNavNodes tags below. Lives in
  // this IIFE because it needs panZoom's own moved/suppressClick tracking plus openZoom/wire/dlg
  // above, rather than duplicating a second click/drag split against the same svg.
  let navMenu=null,navMenuFor=null;
  const navWired=new WeakSet(),pzWired=new WeakSet(); // see tagNavNodes for why these aren't attributes

  function navEscapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  const NAV_SEL='.node,.cluster'; // a leaf package and a symbol are g.node, a package with children is g.cluster
  function navMermaidId(node){
    // Mermaid's own id shapes, verified against a real render of the bundled build:
    // "<renderId>-flowchart-<id>-<n>" for a node, "<renderId>-<id>" for a cluster.
    const id=node.id||'';
    const m=/-flowchart-(.+)-\d+$/.exec(id)||/-([A-Za-z]\d+)$/.exec(id);
    return m&&m[1];
  }
  // Runs on every wire() pass but tags an svg only once. The guard is a WeakSet, not an
  // attribute: wire()'s observer can fire while mermaid.render() is still awaiting inside, and
  // whatever attribute we left on the half-built svg is then serialised into the string render()
  // returns -- so the finished svg came back claiming to be wired while mermaid's own class reset
  // had already dropped vd-nav off it. An element identity can't be serialised.
  function tagNavNodes(box,svg){
    if(navWired.has(svg)) return;
    if(box.dataset.ids===undefined) return; // no map on this box at all
    let ids;
    try{ ids=JSON.parse(box.dataset.ids); }catch(_){ return; }
    // Optional: only the level-2 symbols box carries this (id_to_loc), for "Go to symbol".
    let lines={};
    try{ lines=box.dataset.lines?JSON.parse(box.dataset.lines):{}; }catch(_){ lines={}; }
    navWired.add(svg);
    svg.classList.add('vd-nav');
    const tagged={}; // mermaidId -> its box, so the edge pass below can require both ends tagged
    svg.querySelectorAll(NAV_SEL).forEach(node=>{
      const mermaidId=navMermaidId(node);
      const path=mermaidId&&ids[mermaidId];
      if(!path) return; // folded pseudo-nodes and anything the ids map excludes on purpose (e.g. an empty map at level 1)
      node.dataset.path=path;
      const loc=mermaidId&&lines[mermaidId];
      if(loc){ node.dataset.start=loc.start; node.dataset.end=loc.end; node.dataset.side=loc.side; }
      node.tabIndex=0;
      node.setAttribute('role','button');
      node.setAttribute('aria-label','Open menu for '+path);
      tagged[mermaidId]=node;
    });
    svg.querySelectorAll('path[data-id]').forEach(edge=>{
      // Layout-only ~~~ chain links (sections.py::_chain_components_lines, stacking disconnected
      // components) get an id matching the regex below too; skip them or focus-downstream walks
      // into an unrelated component.
      if(edge.classList.contains('edge-thickness-invisible')) return;
      // Edge id's endpoints share whichever prefix that level's nodes use (S for symbols, P
      // for packages); only the trailing per-edge index is a fixed \d+.
      const m=/^L_([A-Za-z]\d+)_([A-Za-z]\d+)_\d+$/.exec(edge.dataset.id||'');
      if(!m||!tagged[m[1]]||!tagged[m[2]]) return;
      edge.classList.add('vd-edge');
      edge.dataset.from=m[1]; edge.dataset.to=m[2];
    });
  }

  function navToast(){
    let t=document.getElementById('vd-nav-toast');
    if(!t){
      t=document.createElement('div');
      t.id='vd-nav-toast'; t.className='vd-nav-toast';
      t.setAttribute('role','status'); t.setAttribute('aria-live','polite');
    }
    // Re-checked on every call, not just on creation: while #mermaid-zoom is open, the rest
    // of the document sits below the dialog's top layer and is inert, so a toast left under
    // document.body would neither paint nor reach the accessibility tree -- exactly the
    // surface a phone's fullscreen view is. Moving it back once the dialog closes is the
    // same check, just the other branch, so a toast fired after close still works.
    const parent=dlg.open?dlg:document.body;
    if(t.parentNode!==parent) parent.appendChild(t);
    return t;
  }
  let navSayTimer=null;
  function navSay(msg){
    const t=navToast();
    t.textContent=msg; t.classList.add('on');
    clearTimeout(navSayTimer);
    navSayTimer=setTimeout(()=>t.classList.remove('on'),1900);
  }

  function closeNavMenu(returnFocus=false){
    if(navMenu){ navMenu.remove(); navMenu=null; }
    if(navMenuFor){
      if(returnFocus) navMenuFor.focus();
      navMenuFor=null;
    }
  }
  function clearNavFocus(root){
    root.classList.remove('vd-focusing');
    root.querySelectorAll(NAV_SEL+',.vd-edge').forEach(n=>n.classList.remove('vd-reach','vd-sel'));
    // __navSource (set in openZoom) points a fullscreen clone back at its inline graph; mirror
    // the clear there too, or closing the dialog leaves the inline graph stuck dimmed.
    if(root.__navSource) clearNavFocus(root.__navSource);
  }
  function navDownstream(root,id){
    const adj={};
    root.querySelectorAll('.vd-edge').forEach(e=>{
      (adj[e.dataset.from]=adj[e.dataset.from]||[]).push(e.dataset.to);
    });
    const seen=new Set([id]), q=[id];
    while(q.length){
      const c=q.shift();
      (adj[c]||[]).forEach(n=>{ if(!seen.has(n)){ seen.add(n); q.push(n); } });
    }
    seen.delete(id);
    return seen;
  }
  function focusNavNode(root,node){
    clearNavFocus(root);
    const id=navMermaidId(node), seen=navDownstream(root,id);
    const downCount=seen.size; // pre-mutation: true downstream count, excluding the focused node
    seen.add(id);
    root.querySelectorAll(NAV_SEL).forEach(n=>{ if(seen.has(navMermaidId(n))) n.classList.add('vd-reach'); });
    root.querySelectorAll('.vd-edge').forEach(e=>{
      if(seen.has(e.dataset.from)&&seen.has(e.dataset.to)) e.classList.add('vd-reach');
    });
    node.classList.add('vd-sel');
    root.classList.add('vd-focusing');
    // A node is a symbol at the symbols level, not a file, so count distinct dataset.path
    // values downstream (excluding the focused node's own path) rather than nodes. A
    // same-file-only downstream set makes paths.size 0 despite a real dimmed graph, so that
    // case reports a symbol count instead of "0 files"; a genuinely empty set gets its own
    // message.
    const paths=new Set();
    root.querySelectorAll('.node.vd-reach,.cluster.vd-reach').forEach(n=>{ if(n.dataset.path&&n.dataset.path!==node.dataset.path) paths.add(n.dataset.path); });
    const msg=downCount===0?'nothing downstream of '+node.dataset.path
      :paths.size===0?downCount+(downCount===1?' symbol':' symbols')+' downstream of '+node.dataset.path
      :paths.size+(paths.size===1?' file':' files')+' downstream of '+node.dataset.path;
    navSay(msg);
    // Same __navSource mirror as clearNavFocus above, matched by mermaid id since clone and
    // inline svg share ids.
    if(root.__navSource){
      const srcNode=[...root.__navSource.querySelectorAll(NAV_SEL)].find(n=>navMermaidId(n)===id);
      if(srcNode) focusNavNode(root.__navSource,srcNode);
    }
  }
  // The walkthrough carries no per-file anchor id (see scripts/walkthrough.py), so a path is
  // resolved to its <details class="hunk"> at click time by matching .hunk-path's own text.
  function navFindHunk(path){
    const hunks=[...document.querySelectorAll('details.hunk')];
    const at=d=>{ const p=d.querySelector('.hunk-path'); return p?p.textContent.trim():null; };
    // A package box's path is a directory, which matches no hunk of its own, so it falls back
    // to the first file under it -- the walkthrough is already in diff order, so that is the
    // package's first changed file rather than an arbitrary one.
    return hunks.find(d=>at(d)===path)
      ||hunks.find(d=>{ const a=at(d); return a&&a.startsWith(path+'/'); })||null;
  }
  function navGoToFile(path){
    const target=navFindHunk(path);
    if(!target) return; // the menu only ever offers this item when a match exists
    if(dlg.open) dlg.close();
    target.open=true;
    target.scrollIntoView({block:'start'});
    target.classList.add('vd-flash');
    setTimeout(()=>target.classList.remove('vd-flash'),1400);
  }
  window.__cwGoToFile=navGoToFile; // the System change diagram's click target, see its script at the end
  // A symbol node's wired diff span, or null when its range carries nothing wired (no range
  // data at all, or the file isn't in this diff). window.__vdSymbolSpan is exported by the
  // comments script below, since spanByLineKey lives in its closure.
  function navSymbolSpan(node){
    if(node.dataset.start===undefined) return null;
    return window.__vdSymbolSpan(node.dataset.path,node.dataset.side,+node.dataset.start,+node.dataset.end);
  }
  function navGoToLine(span){
    if(dlg.open) dlg.close();
    window.__vdOpenAncestorDetails(span); // a line inside a collapsed hunk isn't scrollable/focusable otherwise
    span.scrollIntoView({block:'center'});
    span.focus({preventScroll:true});
    span.classList.add('vd-flash-line');
    setTimeout(()=>span.classList.remove('vd-flash-line'),1400);
  }
  // Shared menu builder+positioner for box-like controls (a package/symbol node) that want a
  // small "path label + action buttons" popup. `items` is [{action, icon, label, run}]; the
  // popup closes itself and calls the matched item's `run()` on click.
  function openMenu(container,opener,path,items,x,y){
    closeNavMenu();
    navMenuFor=opener;
    // A plain container, not role="menu": its buttons are already tabbable, and a real ARIA
    // menu needs arrow-key roving focus and containment this doesn't implement.
    const menu=document.createElement('div');
    menu.className='vd-menu';
    let markup='<div class="vd-menu-path">'+navEscapeHtml(path)+'</div>';
    items.forEach(it=>{
      markup+='<button type="button" data-a="'+it.action+'"><span class="vd-menu-ic">'+it.icon+'</span>'+it.label+'</button>';
    });
    menu.innerHTML=markup;
    container.appendChild(menu);
    const r=container.getBoundingClientRect(), m=menu.getBoundingClientRect();
    let left=x-r.left+6, top=y-r.top+6;
    if(left+m.width>r.width-6) left=Math.max(6,r.width-m.width-6);
    if(top+m.height>r.height-6) top=Math.max(6,y-r.top-m.height-6);
    menu.style.left=left+'px'; menu.style.top=top+'px';
    navMenu=menu;
    menu.querySelector('button').focus();
    // Menu sits inside container (== box, see wire() below): left alone, a click here reopens
    // the fullscreen dialog, and box's unconditional Enter/Space keydown preventDefault()s a
    // menu button's own native activation before it can fire a click. Stop both from bubbling.
    menu.addEventListener('click',e=>{
      e.stopPropagation();
      const b=e.target.closest('button'); if(!b) return;
      const item=items.find(it=>it.action===b.dataset.a);
      closeNavMenu();
      if(item) item.run();
    });
    menu.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' ') e.stopPropagation();
    });
  }
  function openNavMenu(root,container,node,x,y){
    const path=node.dataset.path, hunk=navFindHunk(path);
    const span=navSymbolSpan(node);
    // Naming which file it lands on matters for a directory: it is one of several, not the one.
    const fileLabel=hunk&&hunk.querySelector('.hunk-path').textContent.trim()===path
      ?'Go to file':'Go to first file';
    const items=[];
    // A resolved span (only ever set on a level-2 symbol node) replaces the file-level jump
    // with a jump straight to its changed line, falling back to the file-level item below when
    // the range resolves to nothing wired.
    if(span) items.push({action:'symbol',icon:'&#8594;',label:'Go to symbol',run:()=>navGoToLine(span)});

    // once focus actually landed on ta, since that's the one part inertness can silently break.
    if(document.activeElement===ta){
      try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
    }
    ta.remove();
    return ok;
  }

  function saveNote(note){
    const i=state.notes.findIndex(n=>n.id===note.id);
    if(i===-1) state.notes.push(note); else state.notes[i]=note;
    persistLocal();
  }

  function deleteNote(id){
    state.notes=state.notes.filter(n=>n.id!==id);
    persistLocal();
  }

  // A new draft is created empty and renders itself as an editable row straight away (see
  // buildItem) -- no separate uncommitted-editor overlay to keep in sync with the note list.
  function newDraft(fields){
    return Object.assign({
      id:newNoteId(),origin:'local',target:'pr',state:'draft',
      body:'',stale:false,author:'',created_at:nowIso(),
      gh_id:null,gh_url:null,reply_to:null,in_reply_to:null,
    },fields);
  }

  function focusDraftBody(id){
    const rec=rowById.get(id);
    const ta=rec&&rec.el.querySelector('textarea');
    if(ta) ta.focus();
  }

  // Reuses a line's existing top-level draft rather than starting a second one; a reply is
  // excluded from that lookup even though it shares the parent's path/line/side, since it is
  // never the line's "own" comment.
  function lineDraft(meta){
    return state.notes.find(n=>!n.stale&&n.origin==='local'&&n.state==='draft'
      &&!n.reply_to&&!n.in_reply_to&&n.path===meta.path&&n.side===meta.side&&n.line===meta.line);
  }
  function openOrFocusDraft(meta){
    const existing=lineDraft(meta);
    const note=existing||newDraft({
      path:meta.path,line:meta.line,side:meta.side,hunk_id:meta.hunkId,
      anchor_text:meta.text,anchor_line:meta.line,order:meta.order,
    });
    if(!existing) saveNote(note);
    renderNotes();
    focusDraftBody(note.id);
  }

  // Tracks the one line a touch tap has revealed the "+" on, so a second tap elsewhere clears
  // the first rather than leaving every previously-tapped line lit.
  let touchRevealedSpan=null;

  // set by wireAsk on a live page; a static page has no daemon, so wireLine falls back to the plain draft row
  let onGutter=null, gutterDown=null, rowTap=null, gutterSwallow=false;
  let openThreadAsk=null;
  const outcomeHooks={oidFor:()=>null,published:()=>{}};

  function wireLine(span,meta){
    meta.text=span.textContent; // capture verbatim (incl. leading +/-/space) before the badge/button change it -- this is anchor_text
    meta.lineKey=meta.path+'\t'+meta.side+'\t'+meta.line;
    span.classList.add('dline');
    span.tabIndex=0;
    span.setAttribute('role','button');
    span.setAttribute('aria-label','Comment on '+meta.path+':'+meta.line+' ('+meta.side+')');
    const badge=document.createElement('span'); badge.className='dline-num';
    badge.textContent=meta.line; badge.setAttribute('aria-hidden','true');
    span.insertBefore(badge,span.firstChild);
    const open=e=>{ if(onGutter) onGutter(meta,e); else openOrFocusDraft(meta); };
    const plus=document.createElement('button');
    plus.type='button'; plus.className='dline-plus'; plus.tabIndex=-1;
    plus.setAttribute('aria-label','Add comment on '+meta.path+':'+meta.line+' ('+meta.side+')');
    plus.textContent='+';
    plus.addEventListener('mousedown',e=>e.preventDefault());
    badge.addEventListener('mousedown',e=>e.preventDefault());
    for(const g of [badge,plus]) g.addEventListener('pointerdown',e=>{ if(gutterDown) gutterDown(e,span); });
    plus.addEventListener('click',e=>{ e.stopPropagation(); if(gutterSwallow){ gutterSwallow=false; return; } open(e); });
    badge.addEventListener('click',e=>{ if(!onGutter) return; e.stopPropagation(); if(gutterSwallow){ gutterSwallow=false; return; } open(e); });
    span.appendChild(plus);
    spanByLineKey.set(meta.lineKey,{span,meta});
    lineMetaBySpan.set(span,meta);
    // Coarse-pointer (touch) tap: first tap on a line just reveals its "+" and clears whichever
    // other line had it revealed; the "+" click above (stopPropagation'd) is what actually opens
    // the draft, so a tap that only meant to select text never does.
    span.addEventListener('click',e=>{
      if(e.target===plus) return;
      if(!matchMedia('(pointer:coarse)').matches) return;
      if(rowTap&&rowTap(span)) return;
      if(touchRevealedSpan&&touchRevealedSpan!==span) touchRevealedSpan.classList.remove('dline-touch-active');
      span.classList.toggle('dline-touch-active');
      touchRevealedSpan=span.classList.contains('dline-touch-active')?span:null;
    });
    span.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(e); } });
  }

  // Extension (no dot) and, for extension-less files, lowercase basename -> hljs language
  // name, capped to what the vendored common bundle ships (see assets/highlight.VERSION).
  const HLJS_LANG_BY_NAME={
    js:'javascript',mjs:'javascript',cjs:'javascript',jsx:'javascript',
    ts:'typescript',tsx:'typescript',py:'python',pyi:'python',rb:'ruby',go:'go',rs:'rust',
    java:'java',c:'c',h:'c',cpp:'cpp',cc:'cpp',cxx:'cpp',hpp:'cpp',hh:'cpp',cs:'csharp',
    php:'php',pl:'perl',pm:'perl',lua:'lua',kt:'kotlin',kts:'kotlin',swift:'swift',r:'r',
    sql:'sql',sh:'bash',bash:'bash',zsh:'bash',yml:'yaml',yaml:'yaml',json:'json',
    xml:'xml',html:'xml',htm:'xml',css:'css',scss:'scss',less:'less',md:'markdown',
    markdown:'markdown',ini:'ini',toml:'ini',vb:'vbnet',graphql:'graphql',gql:'graphql',
    m:'objectivec',mm:'objectivec',wasm:'wasm',diff:'diff',patch:'diff',
    makefile:'makefile',dockerfile:'dockerfile','cargo.lock':'ini',
  };

  function wireHunk(pre){
    const details=pre.closest('details.hunk');
    const pathEl=details&&details.querySelector('.hunk-path');
    const path=pathEl?pathEl.textContent.trim():'';
    if(path&&details) detailsByPath.set(path,details);
    const header=pre.querySelector('span.h');
    const parsed=header&&parseHeader(header.textContent);
    if(!parsed) return; // header didn't parse: leave this hunk's lines uncommentable rather than numbering them wrongly
    const hunkId=path+'\t'+parsed.prefix; // byte-identical to state.py's hunks[].id: same (path, prefix) key
    let oldN=parsed.oldStart, newN=parsed.newStart;
    // Must run before the wireLine loop below: wireLine prepends a .dline-num badge element,
    // and rewriting innerHTML after that would wipe it out.
    if(window.hljs){
      const base=path.slice(path.lastIndexOf('/')+1).toLowerCase();
      const ext=base.includes('.')?base.slice(base.lastIndexOf('.')+1):'';
      const lang=HLJS_LANG_BY_NAME[ext]||HLJS_LANG_BY_NAME[base];
      if(lang&&hljs.getLanguage(lang)){
        for(const span of [...pre.children]){
          if(span.classList.contains('h')) continue;
          const text=span.textContent;
          try{
            // ponytail: per-line, not per-hunk -- a multi-line string/comment can mis-colour
            // past its first line (hljs v11 dropped the continuation arg). Whole-hunk highlight
            // + re-split on markers would fix it, only worth it if this bites in practice.
            if(span.classList.contains('c')){
              span.innerHTML=hljs.highlight(text,{language:lang,ignoreIllegals:true}).value;
            }else{
              const marker=text[0].replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
              span.innerHTML=marker+hljs.highlight(text.slice(1),{language:lang,ignoreIllegals:true}).value;
            }
          }catch(e){ /* one bad line stays plain rather than breaking the rest of the hunk */ }
        }
      }
    }
    for(const span of [...pre.children]){
      // GitHub anchors a comment to one side of the diff: added/context lines are the new
      // file (RIGHT, numbered off newStart), removed lines are the old file (LEFT, off oldStart).
      if(span.classList.contains('c')){ wireLine(span,{path,line:newN,side:'RIGHT',order:docOrder++,hunkId}); oldN++; newN++; }
      else if(span.classList.contains('a')){ wireLine(span,{path,line:newN,side:'RIGHT',order:docOrder++,hunkId}); newN++; }
      else if(span.classList.contains('d')){ wireLine(span,{path,line:oldN,side:'LEFT',order:docOrder++,hunkId}); oldN++; }
    }
  }

  // A reply renders directly under its parent rather than bucketed at the list's end: walk
  // roots in order, and after each root splice in its own replies (also in order). A reply
  // whose parent isn't in this same live/stale bucket has no nest to join, so it falls back
  // to a root of its own.
  function orderThreaded(notes){
    const byId=new Map(notes.map(n=>[n.id,n]));
    const childrenByParent=new Map();
    const roots=[];
    notes.forEach(n=>{
      if(n.reply_to&&byId.has(n.reply_to)){
        const kids=childrenByParent.get(n.reply_to)||[];
        kids.push(n);
        childrenByParent.set(n.reply_to,kids);
      } else roots.push(n);
    });
    roots.sort((a,b)=>(a.order||0)-(b.order||0));
    childrenByParent.forEach(kids=>kids.sort((a,b)=>(a.order||0)-(b.order||0)));
    const out=[];
    const walk=n=>{ out.push(n); (childrenByParent.get(n.id)||[]).forEach(walk); };
    roots.forEach(walk);
    return out;
  }

  const mk=(tag,cls,text)=>{
    const e=document.createElement(tag);
    if(cls) e.className=cls;
    if(text!=null) e.textContent=text;
    return e;
  };

  function mdUrl(u){
    try{ const x=new URL(u); return x.protocol==='http:'||x.protocol==='https:'?x.href:null; }
    catch(_){ return null; }
  }

  function parseInline(s){
    const out=[];
    let buf='', i=0;
    const flush=()=>{ if(buf){ out.push({t:'text',v:buf}); buf=''; } };
    const close=(m,from)=>{
      for(let j=from;j<s.length;j++){
        if(s[j]==='`'){ const k=s.indexOf('`',j+1); if(k>0){ j=k; continue; } }
        if(j>from&&s.startsWith(m,j)&&!/\s/.test(s[j-1])&&(m!=='*'||(s[j-1]!=='*'&&s[j+1]!=='*'))) return j;
      }
      return -1;
    };
    while(i<s.length){
      const c=s[i], n=s[i+1]||' ';
      if(c==='`'){
        const j=s.indexOf('`',i+1);
        if(j>i+1){ flush(); out.push({t:'code',v:s.slice(i+1,j)}); i=j+1; continue; }
      } else if(c==='*'&&n==='*'){
        const j=/\s/.test(s[i+2]||' ')?-1:close('**',i+2);
        if(j>0){ flush(); out.push({t:'b',c:parseInline(s.slice(i+2,j))}); i=j+2; continue; }
        buf+='**'; i+=2; continue;
      } else if(c==='*'&&!/\s/.test(n)){
        const j=close('*',i+1);
        if(j>0){ flush(); out.push({t:'i',c:parseInline(s.slice(i+1,j))}); i=j+1; continue; }
      } else if(c==='['){
        const m=/^\[([^\]]+)\]\(([^)\s]+)\)/.exec(s.slice(i)), href=m&&mdUrl(m[2]);
        if(href){ flush(); out.push({t:'a',href,c:parseInline(m[1])}); i+=m[0].length; continue; }
      }
      buf+=c; i++;
    }
    flush();
    return out;
  }

  function parseMd(text){
    const cells=l=>{
      let s=l.trim();
      if(s.startsWith('|')) s=s.slice(1);
      if(/(^|[^\\])\|$/.test(s)) s=s.slice(0,-1);
      return s.split(/(?<!\\)\|/).map(c=>c.trim().replace(/\\\|/g,'|'));
    };
    const lines=String(text).split('\n'), out=[];
    const ITEM=/^(\s*)([-*]|\d+\.)\s+(\S.*)$/, FENCE=/^\s*```/, HEAD=/^(#{1,3})\s+(\S.*?)\s*#*\s*$/;
    let para=[];
    const flush=()=>{ if(para.length) out.push({kind:'p',text:para.join('\n').trim()}); para=[]; };
    for(let i=0;i<lines.length;i++){
      const line=lines[i];
      if(!line.trim()){ flush(); continue; }
      if(FENCE.test(line)){
        let k=i+1;
        while(k<lines.length&&!/^\s*```\s*$/.test(lines[k])) k++;
        if(k<lines.length){ flush(); out.push({kind:'pre',text:lines.slice(i+1,k).join('\n')}); i=k; continue; }
      }
      const h=HEAD.exec(line);
      if(h){ flush(); out.push({kind:'h',level:h[1].length,text:h[2]}); continue; }
      if(ITEM.test(line)){
        flush();
        const list={kind:'list',ordered:/\d/.test(ITEM.exec(line)[2]),items:[]};
        for(;i<lines.length;i++){
          const m=ITEM.exec(lines[i]);
          if(m){
            const last=list.items[list.items.length-1];
            if(m[1].length&&last){
              last.sub=last.sub||{ordered:/\d/.test(m[2]),items:[]};
              last.sub.items.push(m[3]);
            } else list.items.push({text:m[3],sub:null});
          } else if(/^\s+\S/.test(lines[i])&&list.items.length){
            const last=list.items[list.items.length-1];
            if(last.sub) last.sub.items[last.sub.items.length-1]+='\n'+lines[i].trim();
            else last.text+='\n'+lines[i].trim();
          } else break;
        }
        i--;
        out.push(list);
        continue;
      }
      if(line.includes('|')&&i+1<lines.length){
        const head=cells(line), d=cells(lines[i+1]);
        if(d.length===head.length&&d.every(c=>/^:?-+:?$/.test(c))){
          flush();
          const align=d.map(c=>c.endsWith(':')?(c.startsWith(':')?'center':'right'):(c.startsWith(':')?'left':''));
          const rows=[];
          for(i+=2;i<lines.length&&lines[i].trim()&&lines[i].includes('|');i++){
            const r=cells(lines[i]).slice(0,head.length);
            while(r.length<head.length) r.push('');
            rows.push(r);
          }
          i--;
          out.push({kind:'table',head,align,rows});
          continue;
        }
      }
      para.push(line);
    }
    flush();
    return out;
  }

  function inlineInto(e,text){
    const walk=(parent,toks)=>{
      for(const t of toks){
        if(t.t==='text') parent.append(document.createTextNode(t.v));
        else if(t.t==='code') parent.append(mk('code',null,t.v));
        else {
          const x=document.createElement(t.t==='b'?'strong':t.t==='i'?'em':'a');
          if(t.t==='a'){ x.href=t.href; x.rel='noopener noreferrer'; x.target='_blank'; }
          walk(x,t.c);
          parent.append(x);
        }
      }
    };
    walk(e,parseInline(text));
    return e;
  }
  const richEl=(tag,text)=>inlineInto(document.createElement(tag),text);

  function mdTable(t){
    const row=(tag,cs)=>{
      const tr=document.createElement('tr');
      cs.forEach((c,i)=>{ const e=richEl(tag,c); if(t.align[i]) e.style.textAlign=t.align[i]; tr.append(e); });
      return tr;
    };
    const tbl=document.createElement('table'), thead=document.createElement('thead'), tbody=document.createElement('tbody');
    thead.append(row('th',t.head));
    for(const r of t.rows) tbody.append(row('td',r));
    tbl.append(thead,tbody);
    const wrap=mk('div','cw-pageedit-table');
    wrap.append(tbl);
    return wrap;
  }

  function mdEl(text){
    const frag=document.createDocumentFragment();
    const listEl=l=>{
      const e=document.createElement(l.ordered?'ol':'ul');
      for(const it of l.items){
        const li=richEl('li',it.text);
        if(it.sub) li.append(listEl({ordered:it.sub.ordered,items:it.sub.items.map(text=>({text,sub:null}))}));
        e.append(li);
      }
      return e;
    };
    for(const b of parseMd(text)){
      if(b.kind==='table') frag.append(mdTable(b));
      else if(b.kind==='pre') frag.append(mk('pre',null,b.text));
      else if(b.kind==='h') frag.append(richEl(b.level<3?'h4':'h5',b.text));
      else if(b.kind==='list') frag.append(listEl(b));
      else frag.append(richEl('p',b.text));
    }
    return frag;
  }

  // Pinned locale: the page's own text is English, so a browser-locale relative/absolute
  // date (e.g. Polish "2 dni temu") would be the odd one out.
  const RTF=new Intl.RelativeTimeFormat('en-GB',{numeric:'auto'});
  const REL_UNITS=[['year',31536000],['month',2592000],['week',604800],['day',86400],
                   ['hour',3600],['minute',60],['second',1]];
  function relTime(t){
    const s=(Date.now()-t)/1000;
    for(const [unit,secs] of REL_UNITS){
      if(Math.abs(s)>=secs) return RTF.format(-Math.round(s/secs),unit);
    }
    return RTF.format(0,'second');
  }

  function buildItem(n){
    const lineKey=n.path+'\t'+n.side+'\t'+n.line;
    // Same stale-line guard as renderNotes() above: rec must stay undefined for a stale note,
    // so the dline-note class and the delete handler's focus target below inherit it from this
    // one check instead of needing their own.
    const rec=n.stale?undefined:spanByLineKey.get(lineKey);
    const d=document.createElement('div');
    d.className='fb-item'+(rec?' dline-note':'')+(n.stale?' stale':'')+(n.reply_to?' reply':'')
      +(n.state==='draft'&&n.origin==='local'?' fb-own-draft':'');
    d.setAttribute('role','note');
    d.tabIndex=-1;
    d.setAttribute('aria-label','Comment on '+n.path+':'+n.line+' ('+n.side+') by '
      +(n.author||'you')+(n.stale?', outdated':''));
    const ownDraft=n.state==='draft'&&n.origin==='local';
    if(ownDraft){
      const del=document.createElement('button'); del.className='del-btn'; del.textContent='×';
      del.setAttribute('aria-label','Remove comment');
      del.onclick=()=>{
        const container=d.closest('section');
        deleteNote(n.id);
        renderNotes();
        // The line this row rode along with still exists most of the time; only a stray
        // (outdated, or its line dropped from the diff) has to fall back to its section.
        if(rec) rec.span.focus(); else if(container) container.focus();
      };
      d.appendChild(del);
    }
    // A note that isn't one of my own drafts -- a synced GitHub comment, a bot comment, or one
    // of my own already-posted notes -- gets a reply, but as the thread's own persistent input
    // (see replyBoxFor), not a per-note button here.
    const avName=n.author||'you';
    let hue=0;
    for(const ch of avName) hue=(hue*31+ch.codePointAt(0))|0;
    hue=Math.abs(hue)%360;
    const av=document.createElement('span'); av.className='fb-av';
    av.setAttribute('aria-hidden','true');
    av.style.background='hsl('+hue+',45%,30%)';
    av.textContent=[...avName][0].toUpperCase();
    d.appendChild(av);
    const head=document.createElement('div'); head.className='fb-head';
    const who=document.createElement('span'); who.className='fb-who'+(n.author?'':' you');
    who.textContent=n.author||'you';
    head.appendChild(who);
    const when=Date.parse(n.created_at||'');
    if(!isNaN(when)||n.gh_url){
      // Doubles as the link to the comment on GitHub, GitHub's own idiom.
      const t=document.createElement(n.gh_url?'a':'span'); t.className='fb-time';
      t.textContent=isNaN(when)?'on GitHub':relTime(when);
      if(!isNaN(when)) t.title=new Date(when).toLocaleString('en-GB');
      if(n.gh_url){
        t.href=n.gh_url; t.target='_blank'; t.rel='noopener noreferrer';
        t.setAttribute('aria-label','Open comment on GitHub');
      }
      head.appendChild(t);
    }
    if(ownDraft){
      const tag=document.createElement('span'); tag.className='fb-draft-tag';
      tag.textContent='draft, not published';
      head.appendChild(tag);
    }
    if(n.origin==='local'&&n.state==='in_review'){
      const tag=document.createElement('span'); tag.className='fb-review-tag';
      tag.textContent='in your pending review';
      head.appendChild(tag);
    }
    d.appendChild(head);
    // rec rows (line-anchored) have path/line/side already visible from the diff line above,
    // and the outdated badge now lives on the thread card's header (see strayCardFor) instead of
    // repeating per comment, so a rec row's .s status line has nothing left to say. A leftover
    // keeps the full path:line SIDE coordinate, its only such marker on the page.
    if(!rec){
      const s=document.createElement('span'); s.className='s';
      s.textContent=n.path+':'+n.line+' '+n.side;
      d.appendChild(s);
    }
    // rec rows skip the quote entirely: the code it quotes is the diff line sitting right above.
    // A leftover has no such line, so the quote is its only trace of what the comment was on.
    if(n.anchor_text&&!rec){
      if(n.stale&&!n.diff_hunk){
        const label=document.createElement('span'); label.className='q-label'; label.textContent='written against:';
        d.appendChild(label);
      }
      const q=document.createElement('span'); q.className='q'; q.textContent=n.anchor_text; d.appendChild(q);
    }
    // A draft of mine is editable in place -- no separate Save step, no Edit button to reach
    // it through. Any other note (posted, synced, someone else's) stays plain text.
    if(ownDraft){
      const ta=document.createElement('textarea'); ta.className='fb-draft-body';
      ta.placeholder='Comment on this line...'; ta.value=n.body;
      ta.setAttribute('aria-label','Comment body');
      wireDraftAutosave(ta,n.id);
      d.appendChild(ta);
      if(window.CW_LIVE){
        const pub=document.createElement('button'); pub.type='button'; pub.className='fb-publish-one fb-ghost';
        pub.textContent='Publish now'; pub.dataset.publishFor=n.id; pub.disabled=publishing.has(n.id);
        pub.setAttribute('aria-label','Publish this comment to GitHub now');
        const msg=document.createElement('p'); msg.className='fb-publish-msg'; msg.setAttribute('role','status');
        if(!(window.crypto&&window.crypto.subtle)){
          pub.hidden=true; pub.title='Publishing needs a secure (https or localhost) page';
        }
        pub.addEventListener('click',()=>{
          const cur=state.notes.find(x=>x.id===n.id);
          if(!cur) return;
          if(!ta.value.trim()){ msg.textContent='Type a comment first.'; return; }
          cur.body=ta.value; saveNote(cur);
          publishNote(cur,outcomeHooks.oidFor(cur.id),t=>{ msg.textContent=t; });
        });
        d.append(pub,msg);
      }
    } else {
      const md=mk('div','cw-md'); md.append(mdEl(n.body)); d.appendChild(md);
    }
    return d;
  }

  // Debounced autosave while typing, so a draft survives a reload without a separate Save
  // click; finalised (trimmed, or discarded if emptied) on blur, the same rule the old Save
  // button applied to an empty body -- but only once focus has actually left the field, so
  // deleteNote() (and the re-render it triggers) never fires out from under an active edit.
  function wireDraftAutosave(ta,id){
    let timer=null;
    ta.addEventListener('input',()=>{
      clearTimeout(timer);
      timer=setTimeout(()=>{
        const note=state.notes.find(n=>n.id===id);
        if(note){ note.body=ta.value; saveNote(note); }
      },400);
    });
    ta.addEventListener('blur',()=>{
      clearTimeout(timer);
      if(!ta.value.trim()){ deleteNote(id); renderNotes(); return; }
      const note=state.notes.find(n=>n.id===id);
      if(!note) return;
      note.body=ta.value;
      saveNote(note);
    });
  }

  const rowById=new Map(); // noteId -> {el,sig}

  const publishing=new Set();
  function setPublishBusy(noteId,busy){
    if(busy) publishing.add(noteId); else publishing.delete(noteId);
    document.querySelectorAll('[data-publish-for]').forEach(b=>{ if(b.dataset.publishFor===noteId) b.disabled=busy; });
  }

  function bodySha(text){
    return crypto.subtle.digest('SHA-256',new TextEncoder().encode(text))
      .then(buf=>[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join(''));
  }

  function ghDraftFields(target,root){
    if(!target) return null;
    if(target.kind==='reply'){
      if(!root) return null;
      return {path:root.path,line:root.line,side:root.side,hunk_id:root.hunk_id,
        anchor_text:root.anchor_text,anchor_line:root.anchor_line,reply_to:root.id,in_reply_to:root.id};
    }
    if(target.kind==='new'){
      return {path:target.path,line:target.line,side:target.side,
        end_line:target.end_line||null,hunk_id:target.hunk_id||null};
    }
    return null;
  }

  function publishNote(note,oid,setMsg){
    if(!(window.crypto&&window.crypto.subtle)){
      setMsg('Publishing needs a secure (https or localhost) page.');
      return Promise.resolve(false);
    }
    setMsg('Publishing…');
    if(publishing.has(note.id)) return Promise.resolve(false);
    setPublishBusy(note.id,true);
    const req={id:note.id};
    return putNotesNow(false)
      .then(()=>bodySha(note.body))
      .then(sha=>{
        req.body_sha=sha;
        if(oid) req.oid=oid;
        return fetch(window.CW_LIVE.api+'/publish-one',{method:'POST',
          headers:{'X-CW-Token':window.CW_LIVE.token,'Content-Type':'application/json'},
          body:JSON.stringify(req)});
      })
      .then(r=>r.json().catch(()=>({})).then(body=>({ok:r.ok,status:r.status,body})))
      .then(({ok,status,body})=>{
        const cur=state.notes.find(x=>x.id===note.id);
        const already=status===409&&/no longer a local draft/i.test(body.error||'')&&cur&&cur.state!=='draft';
        if(already){
          setMsg('');
          if(oid) outcomeHooks.published(oid,cur.gh_url||null);
          renderNotes();
          return true;
        }
        if(!ok){ setMsg((body.error||'Request failed')+(body.remedy?' ('+body.remedy+')':'')); return false; }
        setMsg('');
        if(typeof window.__cwOnPosted==='function') window.__cwOnPosted({kind:'note',ok:true,id:note.id});
        const mine=state.notes.find(x=>x.id===note.id);
        if(mine&&body.gh_url){ mine.gh_url=body.gh_url; renderNotes(); }
        if(oid) outcomeHooks.published(oid,body.gh_url||null);
        return true;
      })
      .catch(()=>{ setMsg('Request failed -- check the daemon is still running.'); return false; })
      .then(ok=>{ setPublishBusy(note.id,false); return ok; });
  }

  // JSON.stringify, not join(' '): a plain-space join collides when a field's own value
  // contains a space or matches an adjacent field's text, so two genuinely different notes
  // (or two edits of the same one) can hash to the same signature and a real change gets
  // skipped by the rowFor() reconciler below.
  function noteSig(n){
    return JSON.stringify([n.body,n.state,n.stale,n.gh_url,n.reply_to,
            n.anchor_text,n.path,n.line,n.side,n.diff_hunk,n.author]);
  }
  function rowFor(n){
    const cur=rowById.get(n.id);
    // Never tear down a row with focus inside it -- a draft's own textarea lives in this row,
    // and rebuilding it mid-edit would interrupt typing.
    if(cur&&cur.el.contains(document.activeElement)) return cur.el;
    const sig=noteSig(n);
    if(cur&&cur.sig===sig) return cur.el;
    const el=buildItem(n);
    if(cur) cur.el.remove();
    rowById.set(n.id,{el,sig});
    return el;
  }
  // Insert only when out of position: re-inserting a node that is already where it belongs
  // blurs whatever is focused inside it.
  function placeAfter(anchor,els){
    let prev=anchor;
    for(const el of els){
      if(prev.nextElementSibling!==el) prev.insertAdjacentElement('afterend',el);
      prev=el;
    }
  }
  function placeIn(parent,els){
    els.forEach((el,i)=>{ if(parent.children[i]!==el) parent.insertBefore(el,parent.children[i]||null); });
    while(parent.children.length>els.length) parent.lastElementChild.remove();
  }

  // Splits an already-thread-ordered array (orderThreaded's DFS keeps one root's whole subtree
  // contiguous) into {root,notes} runs: a new group starts whenever a note has no reply_to, or
  // its parent isn't in byId (an orphaned reply falls back to being its own root, same rule
  // orderThreaded itself uses). No recursion up the reply chain needed -- the DFS ordering
  // already guarantees every descendant lands in the run its true root started.
  function groupThreads(notesArr,byId){
    const groups=[]; let cur=null;
    for(const n of notesArr){
      const isRoot=!n.reply_to||!byId.has(n.reply_to);
      if(isRoot||!cur){ cur={root:n,notes:[]}; groups.push(cur); }
      cur.notes.push(n);
    }
    return groups;
  }

  const REPLY_MAX_H=160;
  const replyCanSend=v=>/\S/.test(String(v));
  function replyFit(scrollH,maxH){ return {h:Math.min(scrollH,maxH),over:scrollH>maxH}; }

  function buildReplyRow(root){
    const d=document.createElement('div'); d.className='fb-item fb-reply';
    const av=document.createElement('span'); av.className='fb-av'; av.setAttribute('aria-hidden','true');
    av.style.background='hsl(210,45%,30%)'; av.textContent='Y';
    const input=document.createElement('textarea'); input.className='fb-reply-input'; input.rows=1;
    input.placeholder='Reply...'; input.setAttribute('aria-label','Reply to this conversation');
    const btn=document.createElement('button'); btn.type='button'; btn.className='fb-reply-send';
    btn.textContent='\u2191'; btn.setAttribute('aria-label','Reply on GitHub'); btn.title='Reply on GitHub (Enter)';
    btn.hidden=true; btn.disabled=true;
    const box=document.createElement('div'); box.className='fb-reply-box';
    box.append(input,btn);
    const col=document.createElement('div'); col.className='fb-reply-col';
    col.append(box);
    if(window.CW_LIVE){
      const acts=document.createElement('div'); acts.className='fb-reply-acts';
      const ask=document.createElement('button'); ask.type='button'; ask.className='fb-quiet cw-reply-ask';
      ask.textContent='Ask the agent';
      ask.addEventListener('mousedown',e=>e.preventDefault());
      ask.addEventListener('click',()=>{ if(openThreadAsk) openThreadAsk(root,col,input); });
      acts.append(ask);
      col.append(acts);
    }
    d.append(av,col);
    wireReplyBox(input,root,btn);
    return d;
  }

  function wireReplyBox(input,root,btn){
    function sync(){
      const can=replyCanSend(input.value);
      btn.hidden=!can; btn.disabled=!can;
      input.style.height='auto';
      const f=replyFit(input.scrollHeight,REPLY_MAX_H);
      if(f.h>0) input.style.height=f.h+'px';
      input.style.overflowY=f.over?'auto':'hidden';
    }
    function commit(){
      const body=input.value;
      if(!replyCanSend(body)) return;
      // Sorts after every existing note (root and prior replies alike), never root.order --
      // copying the root's own order would tie-break a fresh reply ahead of an older sibling
      // reply whose order is already higher.
      const order=Math.max(0,...state.notes.map(x=>x.order||0))+1;
      const draft=newDraft({
        path:root.path,line:root.line,side:root.side,hunk_id:root.hunk_id,
        anchor_text:root.anchor_text,anchor_line:root.anchor_line,order,
        reply_to:root.id,in_reply_to:root.id,
      });
      draft.body=body;
      saveNote(draft);
      input.value='';
      sync();
      renderNotes();
    }
    input.addEventListener('input',sync);
    input.addEventListener('blur',commit);
    btn.addEventListener('mousedown',e=>e.preventDefault());
    btn.addEventListener('click',()=>{ commit(); input.blur(); });
    input.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){ e.preventDefault(); commit(); input.blur(); }
    });
  }

  function buildResolveButton(root){
    const d=document.createElement('div'); d.className='fb-actions';
    const btn=document.createElement('button'); btn.type='button'; btn.className='fb-quiet';
    btn.textContent='Resolve'; btn.setAttribute('aria-label','Resolve conversation');
    btn.addEventListener('click',()=>{ markPendingResolve(root.id); renderNotes(); });
    d.appendChild(btn);
    return d;
  }

  const threadWrapByRoot=new Map();    // rootId -> its collapsed <details.hr-thread-resolved>
  const replyBoxByRoot=new Map();   // rootId -> its persistent reply input (stateless, built once)
  const resolveBtnByRoot=new Map(); // rootId -> its Resolve conversation control (same reason)

  function replyBoxFor(root){
    let el=replyBoxByRoot.get(root.id);
    if(!el){ el=buildReplyRow(root); replyBoxByRoot.set(root.id,el); }
    return el;
  }
  function resolveBtnFor(root){
    let el=resolveBtnByRoot.get(root.id);
    if(!el){ el=buildResolveButton(root); resolveBtnByRoot.set(root.id,el); }
    return el;
  }

  // #hr-resolution's content for one outcome (conversation/commits -- 'none' and 'deferred'
  // never reach here: buildResolutionChip renders both as a chip with no dialog, either a
  // dead chip or a direct link to the ticket).
  function buildResolutionContent(res){
    const frag=document.createDocumentFragment();
    if(res.outcome==='conversation'){
      const p=document.createElement('p'); p.className='hr-resolution-text';
      p.textContent=res.closing_message||'Resolved in conversation.';
      frag.appendChild(p);
    } else if(res.outcome==='commits'){
      // Low confidence reads as a guess, not a fact -- flagged ahead of everything it claims.
      if(res.confidence==='low'){
        const chip=document.createElement('span'); chip.className='chip chip-guess';
        chip.textContent='Low confidence match'; frag.appendChild(chip);
      }
      const shas=document.createElement('p'); shas.className='hr-resolution-text';
      shas.appendChild(document.createTextNode('Resolved by '));
      (res.commits||[]).forEach((sha,i)=>{
        if(i>0) shas.appendChild(document.createTextNode(', '));
        const a=document.createElement('a'); a.className='linklike';
        a.href='https://github.com/'+state.meta.repo+'/commit/'+sha;
        a.target='_blank'; a.rel='noopener noreferrer'; a.textContent=sha.slice(0,7);
        shas.appendChild(a);
      });
      frag.appendChild(shas);
      // The header already names this thread's path (see openResolutionDialog) -- repeating
      // it here is only useful once a fix spans more than one file, where the header can't
      // say which is which.
      const files=res.files||[];
      for(const f of files){
        if(files.length>1){
          const fp=document.createElement('div'); fp.className='hr-resolution-path'; fp.textContent=f.path;
          frag.appendChild(fp);
        }
        for(const h of f.hunks||[]){
          const snip=commitHunkSnippet(h);
          if(snip) frag.appendChild(snip);
        }
      }
      // The diff above already answers the comment sitting above the dialog, so why is a
      // closing note, not the headline, and skipped outright when the code speaks for itself.
      if(res.why){
        const why=document.createElement('p'); why.className='hr-resolution-why';
        why.textContent=res.why; frag.appendChild(why);
      }
    }
    return frag;
  }

  // #hr-resolution is reused for every thread; opening it swaps in this root's title and
  // content, same one-dialog-many-openers idiom as #mermaid-zoom's box argument. opener is
  // the chip clicked, so wireResolutionDialog's close handler can focus it back.
  function openResolutionDialog(root,res,opener){
    resolutionOpener=opener;
    const dlg=document.getElementById('hr-resolution');
    document.getElementById('hr-resolution-title').textContent=root.path+':'+root.line;
    const body=document.getElementById('hr-resolution-body');
    body.textContent='';
    body.appendChild(buildResolutionContent(res));
    dlg.showModal();
  }

  // The chip at the end of a resolved thread's <summary> (see resolvedWrapFor). null when
  // resolution tracing never ran for this thread at all -- no entry in state.resolutions,
  // not even a 'none'. 'none' and a ticketless 'deferred' both still get a chip, just a
  // disabled-looking one: "nothing to show" is real information, not a missing feature. A
  // dialog holding only a link (or nothing) isn't worth opening, so a ticketed 'deferred'
  // skips #hr-resolution entirely and links straight to the ticket instead; only
  // commits/conversation still open it.
  function buildResolutionChip(root){
    const res=state.resolutions&&state.resolutions[root.gh_thread_id];
    if(!res) return null;
    const hasTicket=res.ticket&&res.ticket.startsWith('https://');
    if(res.outcome==='none'||(res.outcome==='deferred'&&!hasTicket)){
      const chip=document.createElement('span'); chip.className='chip chip-nofix';
      chip.textContent=res.outcome==='none'?'Nothing found':'Deferred to later';
      return chip;
    }
    if(res.outcome==='deferred'){
      const chip=document.createElement('a'); chip.className='chip chip-fix';
      chip.href=res.ticket; chip.target='_blank'; chip.rel='noopener noreferrer';
      chip.textContent='Created ticket for it';
      // Same problem the dialog-opening button below has: a click inside <summary> also
      // toggles the parent <details> unless stopped. No preventDefault here -- the link
      // still has to navigate.
      chip.addEventListener('click',e=>{ e.stopPropagation(); });
      return chip;
    }
    // Avoids "fix": most threads are nits/questions/answers, not defects.
    const label=res.outcome==='commits'?'Related changes':'Answered in thread';
    const chip=document.createElement('button'); chip.type='button'; chip.className='chip chip-fix';
    chip.textContent=label; chip.setAttribute('aria-haspopup','dialog');
    // Without both of these, the click also toggles the parent <details> -- summary's native
    // activation behaviour fires on any click landing inside it, this button included.
    chip.addEventListener('click',e=>{
      e.preventDefault(); e.stopPropagation();
      openResolutionDialog(root,res,chip);
    });
    return chip;
  }

  // Same collapsed-<details> idiom as the .hr-lo fold below: cache the element per root id,
  // never tear it down while focus is inside (the comments panel's click-to-focus jump can
  // land a row here), and reconcile its children in place otherwise.
  function resolvedWrapFor(root,rows,confirmed){
    let entry=threadWrapByRoot.get(root.id);
    if(entry&&entry.el.contains(document.activeElement)) return entry.el;
    if(!entry){
      const d=document.createElement('details'); d.className='hr-thread-resolved';
      d.appendChild(document.createElement('summary'));
      entry={el:d}; threadWrapByRoot.set(root.id,entry);
    }
    const summary=entry.el.querySelector('summary');
    summary.textContent='';
    const check=document.createElement('span'); check.className='hr-check'; check.textContent='✓';
    check.setAttribute('aria-hidden','true');
    summary.appendChild(check);
    summary.appendChild(document.createTextNode(
      ' Resolved'+(root.resolved_by?' by '+root.resolved_by:'')+(confirmed?'':' (pending sync)')
      +' · '+root.path+':'+root.line+' · '+rows.length+' comment'+(rows.length===1?'':'s')
    ));
    const chip=buildResolutionChip(root);
    if(chip) summary.appendChild(chip);
    placeIn(entry.el,[summary,...rows]);
    return entry.el;
  }

  // The one place a group of notes turns into DOM: per thread, either the collapsed wrapper
  // (resolved, confirmed or still pending) or the plain rows plus whichever of the reply box /
  // Resolve button apply to that thread's root.
  function elementsForThreads(notesArr,byId){
    const out=[];
    for(const group of groupThreads(notesArr,byId)){
      const root=group.root;
      const confirmed=!!root.resolved;
      const pending=pendingResolveSet.has(root.id);
      if(confirmed&&pending) clearPendingResolve(root.id); // sync confirmed it -- stop asking
      const rows=group.notes.map(rowFor);
      if(confirmed||pending){
        out.push(resolvedWrapFor(root,rows,confirmed));
        continue;
      }
      out.push(...rows);
      // Any unposted draft in the thread already has its own textarea to reply in -- an empty
      // Reply... box under it would be noise (GitHub does the same: a pending reply draft
      // replaces the reply field). placeAfter/placeIn only insert what they're handed, so a
      // box left out here must be detached explicitly, not just omitted from out.
      const hasUnpostedDraft=group.notes.some(n=>n.origin==='local'&&n.state==='draft');
      if(hasUnpostedDraft){
        const cached=replyBoxByRoot.get(root.id);
        if(cached) cached.remove();
      } else {
        out.push(replyBoxFor(root));
      }
      if(root.gh_thread_id) out.push(resolveBtnFor(root));
    }
    return out;
  }

  const strayCardByRoot=new Map(); // rootId -> its collapsed per-thread <details.hr-lo> card
  const snippetByRoot=new Map();   // rootId -> its <div class="thread-snippet">, or null when the
                                    // root's diff_hunk is missing/unparseable -- built once, the
                                    // hunk a root carries never changes at runtime

  // Shared by buildSnippet and commitHunkSnippet: splits a unified-diff hunk's header from its
  // body and assigns each body line its new-side line number. A removed line has no new-side
  // number -- skip it in the running count the way the real diff does (see wireHunk), rather
  // than assigning it one.
  function parseHunkRows(hunkText){
    const rawLines=hunkText.split('\n');
    const header=parseHeader(rawLines[0]);
    if(!header) return null;
    let newN=header.newStart;
    const rows=[];
    for(let i=1;i<rawLines.length;i++){
      const text=rawLines[i];
      const cls=text.startsWith('+')?'a':text.startsWith('-')?'d':'c';
      rows.push({text,cls,num:cls==='d'?null:newN});
      if(cls!=='d') newN++;
    }
    return rows;
  }

  // One <span class="dl"> per hunk row: line number plus the coloured code text. buildSnippet
  // adds .anchor/.extra and hidden on top; commitHunkSnippet uses it plain, no windowing.
  function rowEl(r){
    const row=document.createElement('span'); row.className='dl';
    const numEl=document.createElement('span'); numEl.className='dline-num';
    numEl.setAttribute('aria-hidden','true');
    if(r.num!=null) numEl.textContent=r.num;
    row.appendChild(numEl);
    const code=document.createElement('span'); code.className=r.cls; code.textContent=r.text;
    row.appendChild(code);
    return row;
  }

  // The ROOT note's diff_hunk, rendered once per thread (see the per-comment fold this replaced
  // in buildItem). Returns null rather than an empty snippet when there is nothing usable to
  // show, so callers can just skip appending it.
  function buildSnippet(root){
    if(!root.diff_hunk) return null;
    const rows=parseHunkRows(root.diff_hunk);
    if(!rows||!rows.length) return null;
    let anchorIdx=rows.findIndex(r=>r.num===root.line);
    if(anchorIdx===-1) anchorIdx=rows.length-1; // root.line not found in its own hunk: still show something, ending on the last line
    const visibleStart=Math.max(0,anchorIdx-3);

    // .diff carries the row colouring (.a/.d/.h/.c, see the stylesheet) but has to land on the
    // wrapper, not the code box itself: both wireHunk's initial sweep and the explanations
    // toggle select every `pre.diff`, and a snippet element that matched got merged into the
    // file's own hunk pre and hidden (verified by rendering this for real).
    const wrap=document.createElement('div'); wrap.className='thread-snippet diff';
    // Each row is its own block-level flex container (see .dl), not inline text riding a shared
    // whitespace run, so nothing here needs <pre>'s preformatted-text handling -- a plain div
    // with the monospace styling moved onto .snip-pre gets the same look without the mismatch.
    const box=document.createElement('div'); box.className='snip-pre';
    // A deletion row has num:null (removed lines don't exist on the new side), so the window's
    // edges can land on one -- walk inward to the nearest numbered row rather than printing null.
    let startNum=null;
    for(let i=visibleStart;i<=anchorIdx;i++){ if(rows[i].num!=null){ startNum=rows[i].num; break; } }
    let endNum=null;
    for(let i=anchorIdx;i>=visibleStart;i--){ if(rows[i].num!=null){ endNum=rows[i].num; break; } }
    box.setAttribute('aria-label',startNum!=null&&endNum!=null?
      ('Code near the comment, lines '+startNum+' to '+endNum):'Code near the comment');
    rows.forEach((r,i)=>{
      const row=rowEl(r);
      if(i===anchorIdx) row.classList.add('anchor');
      else if(i<visibleStart||i>anchorIdx){ row.classList.add('extra'); row.hidden=true; }
      box.appendChild(row);
    });
    wrap.appendChild(box);

    const controls=document.createElement('div'); controls.className='snippet-controls';
    if(visibleStart>0||anchorIdx<rows.length-1){
      // rows.length, not rawLines.length -- rawLines[0] is the @@ header, never rendered as a
      // row. The count is how many rows the collapsed window is hiding, not the thread's total,
      // so it never repeats the line number already visible in the window above.
      const moreCount=rows.length-(anchorIdx-visibleStart+1);
      const moreLabel='Show '+moreCount+' more line'+(moreCount===1?'':'s');
      const expand=document.createElement('button'); expand.type='button'; expand.className='linklike';
      expand.setAttribute('aria-expanded','false');
      expand.textContent=moreLabel;
      // Reveals the earlier lines above the always-visible window rather than growing downward,
      // so the anchored line -- already on screen at the bottom of the collapsed view -- never
      // has to be re-found after expanding.
      expand.addEventListener('click',()=>{
        const nowOpen=expand.getAttribute('aria-expanded')!=='true';
        expand.setAttribute('aria-expanded',String(nowOpen));
        expand.textContent=nowOpen?'Show fewer lines':moreLabel;
        box.querySelectorAll('.extra').forEach(el=>{ el.hidden=!nowOpen; });
      });
      controls.appendChild(expand);
    }
    if(root.original_commit_id){
      const sha=root.original_commit_id;
      const link=document.createElement('a'); link.className='linklike';
      const encodedPath=root.path.split('/').map(encodeURIComponent).join('/'); // per-segment: encodeURIComponent alone would also escape the '/' separators
      link.href='https://github.com/'+state.meta.repo+'/blob/'+sha+'/'+encodedPath+'#L'+root.line;
      link.target='_blank'; link.rel='noopener noreferrer';
      link.textContent='View file at '+sha.slice(0,7)+' ';
      const arrow=document.createElement('span'); arrow.setAttribute('aria-hidden','true'); arrow.textContent='↗';
      link.appendChild(arrow);
      controls.appendChild(link);
    }
    if(controls.children.length) wrap.appendChild(controls);
    return wrap;
  }
  function snippetFor(root){
    if(!snippetByRoot.has(root.id)) snippetByRoot.set(root.id,buildSnippet(root));
    return snippetByRoot.get(root.id);
  }

  // A matched hunk from buildResolutionContent's outcome=commits case: the whole hunk, no
  // anchor window -- there's no commented line to centre on here, only a diff that answers the
  // thread.
  function commitHunkSnippet(hunkText){
    const rows=parseHunkRows(hunkText);
    if(!rows||!rows.length) return null;
    const wrap=document.createElement('div'); wrap.className='thread-snippet diff';
    const box=document.createElement('div'); box.className='snip-pre';
    rows.forEach(r=>box.appendChild(rowEl(r)));
    wrap.appendChild(box);
    return wrap;
  }

  // One card per thread: the header shows the path only when this file has no hunk of its own
  // on the page (the inFile check below), plus an Outdated chip and this thread's own count.
  function strayCardFor(group,byIdAll,inFile){
    const root=group.root;
    let card=strayCardByRoot.get(root.id);
    if(card&&card.contains(document.activeElement)) return card;
    if(!card){
      card=document.createElement('details'); card.className='hr-lo';
      card.appendChild(document.createElement('summary'));
      strayCardByRoot.set(root.id,card);
    }
    const summary=card.querySelector('summary');
    summary.textContent='';
    if(!inFile){
      const p=document.createElement('span'); p.className='hr-lo-path'; p.textContent=root.path;
      summary.appendChild(p);
    }
    const chip=document.createElement('span'); chip.className='chip chip-outdated'; chip.textContent='Outdated';
    summary.appendChild(chip);
    // A bare text node isn't a flex item, so the summary's `gap` wouldn't separate it from the
    // chip beside it (found by rendering this for real -- "Outdated3 comments", no space).
    const count=document.createElement('span');
    count.textContent=group.notes.length+' comment'+(group.notes.length===1?'':'s');
    summary.appendChild(count);
    const snippet=snippetFor(root);
    const body=snippet?[snippet]:[];
    body.push(...elementsForThreads(group.notes,byIdAll));
    placeIn(card,[summary,...body]);
    return card;
  }

  // Reconciles by note id rather than clearing and rebuilding: a full rebuild on every render
  // would collapse an open <details>, drop focus off a row mid-tab, and kill a text selection.
  // A note's row keeps its DOM identity across renders while its signature (noteSig) is
  // unchanged.
  function renderNotes(){
    const ordered=orderThreaded(state.notes);
    const byIdAll=new Map(state.notes.map(n=>[n.id,n]));
    // Root id per note and which roots are resolved, computed once for the whole page: the
    // per-file .hunk-count badge needs this across every thread, not just the ones a given loop
    // below happens to be rendering.
    const rootIdOfNote=new Map();
    const resolvedRootIds=new Set();
    for(const g of groupThreads(ordered,byIdAll)){
      const root=g.root;
      if(root.resolved||pendingResolveSet.has(root.id)) resolvedRootIds.add(root.id);
      for(const n of g.notes) rootIdOfNote.set(n.id,root.id);
    }
    const byLine=new Map();
    const strays=[];
    for(const n of ordered){
      // A stale note's `line` is GitHub's original_line, a coordinate in the old file -- the
      // current diff's line with that number, if one exists, is unrelated code. Test n.stale
      // before ever looking it up in spanByLineKey.
      if(!n.stale){
        const key=n.path+'\t'+n.side+'\t'+n.line;
        if(spanByLineKey.has(key)){
          const arr=byLine.get(key)||[]; arr.push(n); byLine.set(key,arr);
          continue;
        }
      }
      strays.push(n);
    }

    for(const [key,rec] of spanByLineKey){
      const notesHere=byLine.get(key)||[];
      placeAfter(rec.span,elementsForThreads(notesHere,byIdAll));
      rec.span.classList.toggle('has-comment',notesHere.length>0);
    }

    // A path with a hunk on the page folds its stray threads into it, one card each; a path
    // that never made the walkthrough has no hunk to fold into, so its cards fall back to the
    // page-level section instead.
    const strayGroups=groupThreads(strays,byIdAll);
    const groupsByPath=new Map();
    for(const g of strayGroups){
      const arr=groupsByPath.get(g.root.path)||[]; arr.push(g); groupsByPath.set(g.root.path,arr);
    }
    const orphanPaths=[...groupsByPath.keys()].filter(p=>!detailsByPath.has(p));
    let section=document.getElementById('hr-leftovers');
    if(!section&&orphanPaths.length){
      section=document.createElement('section'); section.id='hr-leftovers'; section.tabIndex=-1;
      section.innerHTML='<h2>Comments on files outside the walkthrough</h2>';
      document.getElementById('plan-content').appendChild(section);
    }
    const strayRootIds=new Set(strayGroups.map(g=>g.root.id));
    for(const [rootId,card] of strayCardByRoot){
      if(!strayRootIds.has(rootId)){ card.remove(); strayCardByRoot.delete(rootId); }
    }
    for(const g of strayGroups){
      const inFile=detailsByPath.has(g.root.path);
      const card=strayCardFor(g,byIdAll,inFile);
      const host=inFile?detailsByPath.get(g.root.path):section;
      if(card.parentElement!==host) host.appendChild(card);
    }
    if(section) section.hidden = orphanPaths.length===0;

    for(const [path,details] of detailsByPath){
      const countEl=details.querySelector('.hunk-count');
      if(!countEl) continue;
      countEl.textContent='';
      const notes=state.notes.filter(n=>n.path===path);
      if(notes.length===0) continue;
      const outdated=notes.filter(n=>n.stale).length;
      const resolvedRootsHere=new Set();
      for(const n of notes){
        const rid=rootIdOfNote.get(n.id);
        if(rid&&resolvedRootIds.has(rid)) resolvedRootsHere.add(rid);
      }
      countEl.appendChild(document.createTextNode(notes.length+' comment'+(notes.length===1?'':'s')));
      if(outdated){
        countEl.appendChild(document.createTextNode(' · '));
        const sp=document.createElement('span'); sp.className='hunk-count-outdated';
        sp.textContent=outdated+' outdated';
        countEl.appendChild(sp);
      }
      if(resolvedRootsHere.size){
        countEl.appendChild(document.createTextNode(' · '));
        const sp=document.createElement('span'); sp.className='hunk-count-resolved';
        sp.textContent=resolvedRootsHere.size+' resolved';
        countEl.appendChild(sp);
      }
    }

    const liveIds=new Set(state.notes.map(n=>n.id));
    for(const [id,rec] of rowById){
      if(!liveIds.has(id)){ rec.el.remove(); rowById.delete(id); }
    }
    // Same liveIds cleanup, for the thread-level caches: a deleted root must not leave its
    // reply box, resolve button, collapsed wrapper, stray card or snippet behind.
    for(const [rootId,rec] of threadWrapByRoot){
      if(!liveIds.has(rootId)){ rec.el.remove(); threadWrapByRoot.delete(rootId); }
    }
    for(const [rootId,el] of replyBoxByRoot){
      if(!liveIds.has(rootId)){ el.remove(); replyBoxByRoot.delete(rootId); }
    }
    for(const [rootId,el] of resolveBtnByRoot){
      if(!liveIds.has(rootId)){ el.remove(); resolveBtnByRoot.delete(rootId); }
    }
    for(const [rootId,card] of strayCardByRoot){
      if(!liveIds.has(rootId)){ card.remove(); strayCardByRoot.delete(rootId); }
    }
    for(const [rootId,el] of snippetByRoot){
      if(!liveIds.has(rootId)){ if(el) el.remove(); snippetByRoot.delete(rootId); }
    }
    refreshCommentsPanel();
  }

  function render(){
    renderNotes();
    dirtyBanner.hidden = !(state.meta&&state.meta.dirty);
  }

  // Group totals for the "N/M viewed" count beside each .wt-group heading (walkthrough.py
  // ships the span empty, see there). The DOM carries no explicit group->file link, so this
  // walks siblings from one heading to the next, stopping at the next heading.
  function groupFileHunks(heading){
    const hunks=[];
    for(let el=heading.nextElementSibling; el&&!el.matches('h3.wt-group'); el=el.nextElementSibling){
      if(el.matches('details.hunk')) hunks.push(el);
    }
    return hunks;
  }

  function updateGroupViewed(){
    document.querySelectorAll('h3.wt-group').forEach(heading=>{
      const out=heading.querySelector('.wt-viewed');
      const hunks=groupFileHunks(heading);
      if(!out||!hunks.length) return;
      const viewed=hunks.filter(d=>{
        const cb=d.querySelector('.hunk-viewed-cb');
        return cb&&cb.checked;
      }).length;
      out.textContent=viewed+'/'+hunks.length+' viewed';
    });
  }

  // Checking collapses the file, GitHub's own Viewed behaviour; unchecking leaves it open --
  // the reader may already be looking at it again, so nothing should force it shut.
  function wireViewedCheckboxes(){
    document.querySelectorAll('.hunk-viewed').forEach(label=>{
      // Stops the click before it reaches the <summary> ancestor and toggles the block --
      // same fix as the "summary a" listener further down, just for this control.
      label.addEventListener('click',e=>e.stopPropagation());
      const cb=label.querySelector('.hunk-viewed-cb');
      const details=label.closest('details.hunk');
      const pathEl=details&&details.querySelector('.hunk-path');
      const path=pathEl?pathEl.textContent.trim():'';
      if(!cb||!details||!path) return;
      if(viewedSet.has(path)){ cb.checked=true; details.open=false; }
      cb.addEventListener('change',()=>{
        if(cb.checked){ viewedSet.add(path); details.open=false; } else viewedSet.delete(path);
        persistViewed();
        updateGroupViewed();
      });
    });
    updateGroupViewed();
  }

  // A row inside a collapsed <details class="hunk"> isn't focusable, so .focus() below would
  // be a silent no-op -- walk every ancestor <details> open first.
  function openAncestorDetails(el){
    for(let d=el.closest('details'); d; d=d.parentElement&&d.parentElement.closest('details')){
      d.open=true;
    }
  }
  window.__vdOpenAncestorDetails=openAncestorDetails; // lets navGoToLine (earlier script) reuse this instead of a second open-ancestors walk

  // My own notes (drafts and posted), in anchor order -- the removed top banner's and the
  // removed per-note Post to PR mark's job, both now live here.
  function myNotesForPanel(){
    return orderThreaded(state.notes).filter(n=>n.origin==='local');
  }

  function wirePost(canGhCommand){
    const $$=id=>document.getElementById(id);
    const postBtn=$$('hr-comments-post-btn'), dlg=$$('cw-post-confirm'),
      close=$$('cw-post-confirm-close'), titleEl=$$('cw-post-confirm-title'),
      pendingNote=$$('cw-post-confirm-pending'), notesList=$$('cw-post-confirm-notes'),
      resolvesList=$$('cw-post-confirm-resolves'), inReviewList=$$('cw-post-confirm-inreview'),
      options=$$('cw-post-options'), approveNote=$$('cw-post-approve-note'),
      summary=$$('cw-post-summary'), itemsList=$$('cw-post-confirm-items'),
      partial=$$('cw-post-confirm-partial'), partialText=$$('cw-post-partial-text'),
      retryBtn=$$('cw-post-retry'), nowBtn=$$('cw-post-send-now'), leaveBtn=$$('cw-post-leave'),
      sendBtn=$$('cw-post-confirm-send'), cancelBtn=$$('cw-post-confirm-cancel'),
      actionsEl=$$('cw-post-confirm-actions'),
      status=$$('cw-post-confirm-status');
    if(!postBtn||!dlg||!close||!notesList||!resolvesList||!itemsList||!sendBtn||!status||!summary||!partial) return;
    postBtn.hidden=!canGhCommand;
    postBtn.textContent='Submit review';

    const plural=(n,w)=>n+' '+w+(n===1?'':'s');
    const firstLine=t=>String(t||'').split('\n')[0];
    const where=n=>n.path+':'+n.line;
    const evRadios=[...dlg.querySelectorAll('input[name="cw-post-event"]')];
    const selEvent=()=>(evRadios.find(r=>r.checked)||evRadios[0]).value;
    const headers=()=>({'X-CW-Token':window.CW_LIVE.token,'Content-Type':'application/json'});
    const errText=b=>(b.error||'Request failed')+(b.remedy?' ('+b.remedy+')':'');

    function localDrafts(){
      return state.notes.filter(n=>n.origin==='local'&&n.state==='draft'&&(n.body||'').trim());
    }
    function updatePanelSubmit(){
