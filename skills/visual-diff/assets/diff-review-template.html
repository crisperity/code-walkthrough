<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- DIFF_TITLE --></title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --border:#2a2f3a;
    --text:#e6e9ef; --muted:#9aa3b2; --accent:#7aa2f7; --green:#9ece6a;
    --yellow:#e0af68; --red:#f7768e; --cyan:#7dcfff; --purple:#bb9af7;
    --markbg:rgba(224,175,104,.28);
    --mono:ui-monospace,'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
    /* One type scale. Every font-size below points at a step, so a size change happens here
       once rather than in thirty rules, and the mobile block overrides the steps instead of
       restating each rule. Icon-button glyph sizes stay literal: they size an affordance, not
       text, and moving them with the scale shifts the hit targets. */
    --fs-base:16px; --fs-xl:26px;
    --fs-md:15px; --fs-sm:13px; --fs-xs:12px;
    /* Diff lines get their own step: smaller is the one place where more of a long line fits
       instead of scrolling sideways, which is the whole problem on a phone. */
    --fs-code:12.5px;
  }
  /* Colour semantics on this page -- what each variable MEANS here, and which code owns it.
     Recorded once after two independent fixes both reached for --purple for unrelated things.
     Mermaid can't resolve a CSS var() inside classDef/linkStyle, so the symbol-delta graph's
     edge colours (scripts/sections.py LINK_COLOR_*) are hex literals mirroring these variables'
     dark-theme values -- kept in sync with this table by hand, not by the browser.

     --accent  interactive affordance (focus rings, the section toggles, links) AND the new
               call edge in the graph (CSS .node.new / sections.py LINK_COLOR_NEW)
     --cyan    function-name syntax highlight (CSS only)
     --red     complexity rose (.hunk-cx.up); removed/deleted lines (CSS only)
     --green   added lines and the add count (CSS only)
     --purple  complexity fell (.hunk-cx.down); keyword syntax, diff hunk headers (CSS only)
     --yellow  warnings/attention (.dec.warn, risks list, comments-toggle, failed render) AND
               the moved call edge in the graph (sections.py LINK_COLOR_MOVED) -- a move is
               structural, not good or bad, so it avoids --red/--green/--purple's judgement
     --muted   neutral/dim text AND the removed call edge in the graph, drawn dashed (CSS
               .sw-gone / sections.py LINK_COLOR_GONE)
  */
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f2f6; --border:#dce0e8;
      --text:#1c2230; --muted:#5c6675; --accent:#2f5fd0; --green:#3a7128;
      --yellow:#9a6b12; --red:#c23a55; --cyan:#0e7490; --purple:#7048b6;
      --markbg:rgba(154,107,18,.22);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:var(--fs-base);line-height:1.6;
    padding:32px 20px 64px}
  .wrap{max-width:min(1400px,92vw);margin:0 auto;padding-right:0;transition:padding .2s}
  body.panel-open .wrap{padding-right:340px}
  @media(max-width:1100px){body.panel-open .wrap{padding-right:0}}
  /* Prose runs the full wrapper width, matching the panels and diagrams, because that is what
     was asked for twice. It puts a line past the 65-80 characters a measure normally wants, so
     line-height carries a bit more of the load; put a max-width back here if it ever reads too
     long on a very wide screen. */
  .wrap>p{font-size:var(--fs-base);line-height:1.7}
  h1{font-size:var(--fs-xl);margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 28px;font-size:var(--fs-sm)}
  h2{font-size:var(--fs-md);letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin:36px 0 14px;border-bottom:1px solid var(--border);
    padding-bottom:8px}
  .panel{background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:18px 20px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
  /* auto-fit, not a fixed 3: the row carries 2 to 4 facts depending on whether this
     recap has a verdict and a complexity measurement, and a fixed column count leaves
     the fourth stranded alone on a second row. */
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:12px;margin-bottom:4px}
  @media(max-width:760px){.facts{grid-template-columns:1fr}}
  .fact{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .fact b{display:block;font-size:var(--fs-sm);color:var(--accent);margin-bottom:4px}
  .fact span{font-size:var(--fs-sm);color:var(--text)}
  svg{max-width:100%;height:auto;display:block;margin:0 auto}
  svg text{font-family:var(--mono);fill:var(--text)}
  svg .lane{stroke:var(--border);stroke-dasharray:4 4}
  svg .box{fill:var(--panel2);stroke:var(--border)}
  svg .arrow{stroke:var(--muted);fill:none;marker-end:url(#m)}
  /* Tracks the page's own type scale like everything else, so a step change reaches this
     hand-drawn diagram text too. Icon-button glyphs are the one exception to that, see the type
     scale note above -- they size a hit target, not text. */
  svg .lbl{font-size:var(--fs-xs)}
  svg .head{font-size:var(--fs-sm);font-weight:600}
  svg .note{fill:var(--muted);font-size:var(--fs-xs)}
  pre{background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    padding:14px 16px;overflow-x:auto;margin:0;
    font-family:var(--mono);font-size:var(--fs-code);line-height:1.6}
  /* inline identifiers (paths, path:symbol names, function/config names) inside prose;
     em-sized so it tracks whichever text it sits in, overflow-wrap so a long path can't
     blow out the line on mobile even though it has no spaces to break at */
  code{font-family:var(--mono);font-size:.9em;background:var(--panel2);
    border:1px solid var(--border);border-radius:4px;padding:.1em .4em;
    overflow-wrap:anywhere}
  .add{color:var(--green)} .del{color:var(--red)} .dim{color:var(--muted)}
  .cmt{color:var(--muted);font-style:italic}
  .k{color:var(--purple)} .f{color:var(--cyan)}
  .grill{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:760px){.grill{grid-template-columns:1fr}}
  .dec{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:8px;padding:12px 14px}
  .dec b{font-size:var(--fs-sm)}
  .dec p{margin:6px 0 0;font-size:var(--fs-xs);color:var(--muted)}
  .dec.warn{border-left-color:var(--yellow)}
  .dec.dead{border-left-color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
  td,th{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.05em}
  ul.risks{margin:0;padding-left:20px;font-size:var(--fs-sm)}
  ul.risks li{margin:8px 0}
  ul.risks b{color:var(--yellow)}
  .foot{margin-top:36px;color:var(--muted);font-size:var(--fs-xs);text-align:center}

  /* dstat: per-file change rows inside one panel, not a card per row */
  .dstat .row{display:grid;grid-template-columns:1fr auto auto;gap:12px;
    align-items:center;padding:5px 0;
    font-family:var(--mono);font-size:var(--fs-code);line-height:1.5}
  .dstat .row+.row{border-top:1px solid var(--border)}
  .dstat .path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    direction:rtl;text-align:left}
  @media(max-width:560px){
    .dstat .row{grid-template-columns:1fr auto}
    .dstat .bar{display:none}
    :root{--fs-base:15px; --fs-xl:22px; --fs-md:14px; --fs-sm:12.5px; --fs-xs:11.5px;
      /* 12px, measured on a real 390px viewport against a 45-file Go diff: 45 characters per
         line before sideways scroll, against 43 at the desktop 12.5px. 11.5px buys 2 more
         and costs legibility, and 12px is what GitHub's own mobile diff uses. No size makes
         an 80-120 char Go line fit; soft-wrapping is the real fix and is a separate change. */
      --fs-code:12px}
    .wrap>p{line-height:1.65}
    h2{margin:26px 0 10px}
    body{padding:20px 14px 48px}
  }
  .bar{display:inline-flex;gap:1px}
  .bar i{width:6px;height:9px;border-radius:1px;display:block}
  .bar i.a{background:var(--green)}
  .bar i.d{background:var(--red)}
  /* Empty track. Every bar is ten cells wide and filled against the widest file, so the unfilled
     tail has to be visible or a small change reads as a short bar instead of a scaled one. */
  .bar i.e{background:var(--border)}

  /* hunk: keyboard-operable disclosure, no JS accordion needed */
  details.hunk{background:var(--panel);border:1px solid var(--border);
    border-radius:10px;margin-bottom:10px;overflow:hidden}
  /* Two columns, triangle then content: the path now wraps instead of ellipsizing (see
     .hunk-lines below), and a grid -- not a flex row -- is what keeps the triangle pinned to
     the first line while the rest of the summary grows underneath it. */
  details.hunk>summary{cursor:pointer;padding:10px 14px;
    font-family:var(--mono);font-size:var(--fs-code);line-height:1.5;
    display:grid;grid-template-columns:14px 1fr;column-gap:10px;
    list-style:none}
  details.hunk>summary::-webkit-details-marker{display:none}
  details.hunk>summary:hover{background:var(--panel2)}
  details.hunk[open]>summary{border-bottom:1px solid var(--border)}
  details.hunk>summary::before{content:'▸';color:var(--muted);align-self:start;
    margin-top:.2em;transition:transform .12s}
  details.hunk[open]>summary::before{transform:rotate(90deg)}
  details.hunk>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* The summary's one column-2 grid item. Path and stat share a wrapping row; .hunk-was forces
     itself onto its own row below via flex-basis:100%, a plain flex trick, rather than a
     second grid row that would need its own explicit placement. */
  details.hunk .hunk-lines{display:flex;flex-wrap:wrap;column-gap:12px;row-gap:4px;
    align-items:baseline;min-width:0}
  details.hunk .hunk-path{flex:0 1 auto;min-width:0;overflow-wrap:anywhere;
    white-space:normal}
  /* margin-left:auto, not the path's old min-width:60%, is what holds the stat at the right
     edge now: the path has to shrink to its text so the PR link sits against the filename
     rather than out at 60% of the row with a gap behind it. */
  details.hunk .hunk-stat{flex:none;margin-left:auto}
  details.hunk .hunk-was{flex:0 0 100%;color:var(--muted);font-size:var(--fs-xs);
    overflow-wrap:anywhere;white-space:normal}
  /* Complexity chips, moved out of the summary into their own quiet row -- no card, no
     border, just muted inline furniture below the path a reader already read. */
  details.hunk .hunk-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:8px 14px 0;color:var(--muted)}
  details.hunk .hunk-note{padding:10px 14px 0;font-size:var(--fs-sm);color:var(--muted)}
  details.hunk pre{margin:10px 14px 14px}

  /* Walkthrough group headings: the reading order analysis.json asked for. Plain sentence
     case, unlike the uppercase h2 section headings, so a theme reads as a label inside the
     section rather than as another section. */
  .wt-group{display:flex;gap:8px;align-items:baseline;margin:24px 0 6px;padding:0;border:0;
    font-size:var(--fs-sm);color:var(--text)}
  .wt-group .wt-count{color:var(--muted);font-size:var(--fs-xs);font-weight:400}
  /* .wrap>p sets the prose size and outranks a bare class, so this has to name both or
     a group's one-line why renders at full paragraph size. */
  .wrap>p.wt-why{margin:0 0 10px;color:var(--muted);font-size:var(--fs-xs)}

  /* Complexity chip. Red for risen (must not be missed), purple for fallen, muted grey for the
     neutral states -- a new function's bare count, no change, and removed. Not green: the +N/-N
     counts beside it are already green, and two greens read as one measurement. Not cyan or
     --accent either -- this page already spends that blue on focus rings, the section toggles
     and mermaid's new-edge colour, so a fourth meaning on the same hue read as
     "interactive" on a phone, not "complexity fell". .gone borrows the dashed-border convention
     the graph's own gone nodes use (.sw-gone below): a deletion is a structural fact, not a
     verdict, so it must not read as either warning or improvement. Every state also has its sign
     in the chip text, so colour is never the only channel. */
  details.hunk .hunk-cx{flex:none;font-size:var(--fs-xs);padding:1px 6px;border-radius:999px;
    border:1px solid var(--border);color:var(--muted);white-space:nowrap}
  details.hunk .hunk-cx.up{color:var(--red);
    border-color:color-mix(in srgb,var(--red) 45%,transparent)}
  details.hunk .hunk-cx.down{color:var(--purple);
    border-color:color-mix(in srgb,var(--purple) 45%,transparent)}
  details.hunk .hunk-cx.gone{border-style:dashed}

  /* Section heading row, shared by the walkthrough and the graph: title on the left, that
     section's controls pushed right. The row is the h2 itself rather than a wrapper, so the
     heading's bottom border stays under both. */
  h2.h2-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
  h2.h2-row .ctl{display:flex;align-items:center;gap:10px}
  /* One appearance, both states. Each toggle's label names the state you are in, so tinting
     the default state grey said it twice and read as switched off; --accent is this page's
     interactive colour, so the control wears it whatever it says, and hover/press move the
     background instead. */
  #wt-notes-toggle,#vd-level-toggle{background:var(--panel2);border:1px solid var(--accent);
    color:var(--accent);border-radius:6px;padding:4px 10px;cursor:pointer;
    font:600 var(--fs-xs) system-ui;letter-spacing:.06em;text-transform:uppercase;
    transition:background .2s}
  #wt-notes-toggle:hover,
  #vd-level-toggle:hover{background:color-mix(in srgb,var(--accent) 14%,var(--panel2))}
  #wt-notes-toggle:active,
  #vd-level-toggle:active{background:color-mix(in srgb,var(--accent) 22%,var(--panel2))}
  #wt-notes-toggle:focus-visible,
  #vd-level-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* Explanations are on by default; pressing the toggle drops this class and takes every
     per-hunk note with it. .hunk-note without the -hunk suffix is the file's one-line role,
     which stays either way. */
  body:not(.show-notes) .hunk-note-hunk{display:none}
  /* The file name is the link to the file on the PR. Text colour is kept and only the
     underline carries the accent: 45 paths repainted blue is a wall of link, and the path is
     still the thing being read. Same muted decoration the note links use. */
  details.hunk .hunk-path a{color:inherit;text-decoration:underline;text-underline-offset:2px;
    text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent)}

  .note{font-size:var(--fs-base);line-height:1.6;color:var(--muted);margin:10px 0 0}
  a{color:var(--accent)}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hunk-note a,.dstat a{text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  .hunk-note a{margin-left:6px;white-space:nowrap}

  .diff .a{color:var(--green)}
  .diff .d{color:var(--red)}
  .diff .h{color:var(--purple)}
  .diff .c{color:var(--muted)}

  pre.mermaid{background:none;border:none;padding:0;text-align:center;
    font-family:inherit;min-height:80px}
  /* Mermaid writes its own inline max-width on the svg, which otherwise wins over anything
     here: on a phone that shrank the whole diagram to a barely-visible strip (measured 6px
     tall against a real page). This selector's specificity beats the bare `svg{}` rule above
     for every mermaid diagram, flow included. */
  .mermaid svg{width:100%;height:auto;max-width:none}

  /* Dragging a graph to pan must never leave a native text selection behind or lose the drag
     to the browser starting one: mermaid renders every label as a real <text> node, and a
     pointerdown that begins a drag also begins selecting that text underneath it. Scoped to
     the three panning surfaces only -- inline boxes, symbol-delta levels, the zoom modal's
     clone -- so <pre class="diff"> and prose stay selectable. -webkit- prefix is still
     required by Safari on SVG. */
  .svgbox,.svgbox svg,
  .vd-symbols .mermaid,.vd-symbols .mermaid svg,
  #mermaid-zoom-body,#mermaid-zoom-body svg{
    -webkit-user-select:none;user-select:none}

  /* mermaid zoom: full-size click-to-expand for the inline diagram */
  /* A capped whole-repo module map still comes out around 4500px tall in a flowchart LR, which
     pushed the note that explains it thousands of pixels below the fold (measured: 5647px down
     an 794px viewport). Cap the box and let the svg's own preserveAspectRatio letterbox inside
     it; the zoom modal and the overlay controls are how you get the detail back. FLOW doesn't
     share that problem (authored at prose scale, ~13 nodes), so it gets its own rule below
     instead of inheriting a cap sized for a much bigger diagram. */
  .svgbox{cursor:zoom-in;position:relative;max-height:min(72vh,720px);overflow:hidden}
  .svgbox:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .svgbox>svg{max-height:min(72vh,720px)}
  /* FLOW: scroll, don't scale. Shrinking the svg to fit the box shrinks its text past legible;
     this keeps the svg at its authored size and scrolls the box's .mermaid child instead of the
     box itself, so the note beneath it stays reachable without the labels paying for it. */
  .svgbox.svgbox-flow .mermaid{overflow:auto;max-height:min(72vh,720px)}
  .svgbox.svgbox-flow svg{max-height:none}
  .vd-failed{margin:0;padding:14px 16px;color:var(--yellow)}
  #mermaid-zoom{width:95vw;height:92vh;max-width:95vw;max-height:92vh;padding:0;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    color:var(--text)}
  #mermaid-zoom::backdrop{background:rgba(0,0,0,.6)}
  #mermaid-zoom-controls{position:absolute;top:10px;left:10px;z-index:2;display:flex;
    gap:6px;align-items:center;font-size:var(--fs-xs);color:var(--muted)}
  #mermaid-zoom-body{width:100%;height:100%;overflow:hidden;
    padding:20px;box-sizing:border-box}
  #mermaid-zoom-body svg{max-width:none;margin:0 auto;display:block}
  #mermaid-zoom-close{position:absolute;top:10px;right:10px;z-index:3;
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:14px;
    line-height:1;transition:background .12s}
  #mermaid-zoom-close:hover{background:var(--border)}
  #mermaid-zoom-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #fb-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* The graph's generated key, inline in the heading row beside the level toggle and only
     for a level that actually draws such a node (see _symbols_legend). Sentence case on
     purpose: two uppercase runs side by side in the heading shout. Matches the mermaid
     `class ... new/gone` sections.py emits: solid accent for new, dashed muted for gone. */
  .vd-legend{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);
    color:var(--muted);text-transform:none;letter-spacing:0}
  .sw{width:11px;height:11px;border-radius:3px;margin-left:10px}
  .vd-legend .sw:first-child{margin-left:0}
  .sw-new{border:2px solid var(--accent)}
  .sw-gone{border:2px dashed var(--muted);opacity:.7}
  /* Mermaid's own classDef can't resolve a CSS var(), so node colour is applied here instead:
     sections.py's `class S0,S1 new` still lands that class name on the rendered <g>, and this
     targets it as ordinary page CSS. Mermaid also writes an ID-scoped .node rule per render that
     outranks this by specificity, so stroke, stroke-width, stroke-dasharray and opacity need
     !important too. */
  .mermaid svg .node.new rect,
  .mermaid svg .node.new polygon,
  .mermaid svg .node.new path{stroke:var(--accent)!important;stroke-width:2px!important}
  .mermaid svg .node.gone{opacity:.7!important}
  .mermaid svg .node.gone rect,
  .mermaid svg .node.gone polygon,
  .mermaid svg .node.gone path{stroke:var(--muted)!important;stroke-dasharray:4 4!important}
  .mermaid svg .edgeLabel foreignObject{overflow:visible}
  /* mermaid writes an ID-scoped background rule per render that this can't select, so
     !important is needed on the two backgrounds; box-shadow (not padding) keeps the plate
     centred, since padding would grow it asymmetrically against a translate already computed
     without it. */
  .mermaid svg .edgeLabel .labelBkg{background:var(--panel)!important;border-radius:4px;
    box-shadow:0 0 0 5px var(--panel),0 0 0 6px var(--muted)}
  .mermaid svg span.edgeLabel{background:transparent!important;font-weight:700}
  /* Each level is its own box: only one is ever unhidden at a time (see the level script), so
     the click-to-expand wiring below treats it exactly like a .svgbox rather than needing a
     wrapping panel around both. It carries the panel itself rather than the .panel class,
     which would put one element in two click-to-zoom code paths at once. */
  .vd-symbols .mermaid{cursor:zoom-in;position:relative;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px 20px}
  .vd-symbols .mermaid:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* The graph's plain-text moved list, under its note */
  .vd-moved{margin:10px 0 0;padding-left:20px;font-size:var(--fs-sm);color:var(--muted)}
  .vd-moved li{margin:4px 0}

  /* feedback panel: shows every line comment made so far, plus the copy-for-Claude button */
  #fb-panel{position:fixed;top:0;right:0;width:320px;height:100vh;
    background:var(--panel);border-left:1px solid var(--border);z-index:90;
    display:none;flex-direction:column;padding:16px;gap:10px}
  body.panel-open #fb-panel{display:flex}
  #fb-panel h3{margin:0;font-size:var(--fs-sm)}
  #fb-panel h3 small{color:var(--muted);font-weight:400}
  #fb-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
  .fb-item{background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    padding:8px 10px;font-size:var(--fs-xs)}
  .fb-item .q{color:var(--muted);font-style:italic;display:block;margin-bottom:4px;
    border-left:2px solid var(--yellow);padding-left:6px}
  .fb-item .s{color:var(--accent);font-size:var(--fs-xs);display:block;margin-bottom:2px}
  .fb-item .del-btn{float:right;background:none;border:none;color:var(--red);
    cursor:pointer;font-size:14px;padding:0 2px}
  .fb-actions{display:flex;gap:8px;margin-top:8px}
  .fb-actions button, #fb-copy, #fb-toggle{border:none;border-radius:6px;padding:6px 12px;
    font:600 var(--fs-xs) system-ui;cursor:pointer}
  .fb-primary{background:var(--accent);color:#fff}
  .fb-ghost{background:var(--panel2);color:var(--muted)}
  #fb-copy{background:var(--green);color:#1a1a1a}
  #fb-copy.copied{background:var(--accent);color:#fff}
  /* light --green is darker than dark theme's, so the label flips to stay AA */
  @media (prefers-color-scheme: light){ #fb-copy:not(.copied){color:#fff} }
  #fb-toggle{position:fixed;right:20px;top:20px;z-index:95;background:var(--yellow);color:#1a1a1a}

  /* per-line commenting: each commentable diff line is its own focusable control */
  .dline{cursor:pointer}
  .dline:hover{background:var(--panel2)}
  .dline:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .dline.has-comment{background:var(--markbg)}
  .dline-num{display:inline-block;min-width:32px;margin-right:8px;padding-right:8px;
    border-right:1px solid var(--border);color:var(--muted);text-align:right;user-select:none}
  /* Both live inside <pre class="diff">, so they inherit its monospace and its white-space:pre.
     The font is reset because they are prose, and white-space for the same reason: left on pre a
     note never wrapped, it ran off to the right (a row 382px wide holding 855px of content). */
  .dline-edit,.dline-comment{display:block;margin:6px 0;white-space:normal;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  .dline-edit{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px}
  .dline-edit textarea{width:100%;background:var(--panel2);border:1px solid var(--border);
    color:var(--text);border-radius:6px;padding:6px;min-height:48px;
    font-family:system-ui;font-size:var(--fs-sm);line-height:1.5}
  /* A saved comment's Edit and × sit outside .fb-actions, so they missed the button reset that
     rule carries and drew with native browser chrome next to styled ones. Flex also replaces the
     inherited del-btn float, which dropped the × onto its own line as soon as a note wrapped. */
  .dline-comment{display:flex;align-items:center;gap:8px}
  .dline-comment>span{flex:1;min-width:0;overflow-wrap:anywhere}
  .dline-comment button{flex:none;border:none;border-radius:6px;cursor:pointer;
    font:600 var(--fs-xs) system-ui;padding:5px 10px}
  .dline-comment button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .dline-comment .fb-ghost:hover{background:var(--border);color:var(--text)}
  .dline-comment .del-btn{float:none;padding:5px 7px;font-size:15px;line-height:1}
  .dline-comment .del-btn:hover{background:color-mix(in srgb,var(--red) 18%,transparent)}

  /* 44px minimum tap target on touch, kept last in the sheet on purpose: #fb-toggle and
     #mermaid-zoom-close both carry unconditional rules elsewhere (padding, position, min-width) at
     this same ID/class specificity, and a tied specificity is decided by source order, not
     by which rule sits inside the media query. Being last is what makes every override here
     win rather than lose to whichever plain rule happens to come later. */
  @media (pointer:coarse){
    #mermaid-zoom-close{width:44px;height:44px;font-size:16px}
    #vd-level-toggle{min-height:44px;padding:10px 14px}
    details.hunk>summary{min-height:44px}
    #fb-toggle{min-height:44px;padding:10px 16px;bottom:max(16px,env(safe-area-inset-bottom));top:auto;
      right:max(16px,env(safe-area-inset-right))}
    #wt-notes-toggle{min-height:44px;padding:10px 14px}
    /* 44px tap target without a 44px row: the padding grows the hit area and the equal
       negative margin takes that growth back out of the layout, so it spills into the
       summary's own padding instead of making every file header 20px taller. */
    h2.h2-row a{min-width:44px;padding:11px 0;margin:-11px 0;
      display:inline-flex;align-items:center;justify-content:center}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;
      animation-iteration-count:1!important;scroll-behavior:auto!important}
  }
</style>

<body>
<div class="wrap" id="plan-content">
<!-- DIFF_CONTENT -->
</div>

<button id="fb-toggle" hidden>Comments (<span id="fb-count">0</span>)</button>
<div id="fb-panel">
  <h3>Line comments <small id="fb-panel-count">(0)</small></h3>
  <div id="fb-list"></div>
  <button id="fb-copy">Copy notes for Claude</button>
</div>

<dialog id="mermaid-zoom" aria-label="Diagram, full size">
  <button id="mermaid-zoom-close" aria-label="Close diagram view">✕</button>
  <div id="mermaid-zoom-controls" hidden>
    <span>scroll to zoom, drag to move, Esc to close</span>
  </div>
  <div id="mermaid-zoom-body"></div>
</dialog>

<script><!-- MERMAID_JS --></script>
<script>
(async () => {
  if (!window.mermaid) return;
  const v = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  mermaid.initialize({
    // The graph's two levels render themselves explicitly below instead of through this
    // sweep (see there for why); the scoped, awaited loop below covers FLOW, the only other
    // `.mermaid` block, one element at a time -- awaited so FLOW's render finishes before the
    // levels start theirs, since mermaid's id/def bookkeeping is shared across every render call
    // on the page and two in flight at once can corrupt each other's.
    startOnLoad: false,
    securityLevel: 'strict',
    theme: 'base',
    fontFamily: v('--mono'),
    // A raw "Syntax error in text / mermaid version 11.15.0" box where a diagram should be
    // blames the source, when what actually failed is usually dagre's cluster layout on a wide
    // graph; stop mermaid painting that over the startOnLoad diagrams.
    suppressErrorRendering: true,
    // Default is 500 and the whole-repo module map ran to 477 before it was capped, close
    // enough that a slightly bigger repo would have hit the ceiling instead of the cap.
    maxEdges: 2000,
    flowchart: { useMaxWidth: false },
    sequence: { useMaxWidth: false },
    themeVariables: {
      background: v('--panel'), primaryColor: v('--panel2'),
      primaryTextColor: v('--text'), primaryBorderColor: v('--border'),
      // A default (un-linkStyled) edge falls back to this; --muted reads as near-invisible
      // grey against the dark background. --text is the page's own highest-contrast
      // foreground colour in both schemes, so the edge reads as clearly as the labels it
      // connects.
      lineColor: v('--text'), textColor: v('--text'),
      clusterBkg: v('--bg'), clusterBorder: v('--border'),
      tertiaryColor: v('--bg'), tertiaryBorderColor: v('--border'),
      edgeLabelBackground: v('--panel')
    }
  });
  // ponytail: theme is read once at load. Flipping the OS theme with the page open leaves
  // the diagram on the old palette. Reload fixes it. Re-render on a
  // matchMedia('(prefers-color-scheme: dark)') change listener if that ever gets annoying.
  // One element at a time, each in its own try/catch: a batched `mermaid.run()` call fails
  // every element it was given on a single throw, even a sibling it had already written a
  // working svg for moments earlier. This also keeps a FLOW failure from aborting this whole
  // IIFE, which would otherwise leave every graph level permanently hidden too.
  // svg has no z-index; g.root paints its children in document order -- clusters, edgePaths,
  // edgeLabels, nodes -- so a node box painted after an edge path or an edge label covers it
  // wherever they overlap: an arrow crossing a box, or a count badge landing on one, both
  // disappear underneath it. Moving nodes, then edgePaths, then edgeLabels to the end of
  // g.root -- each appendChild relocates an existing child, so calling in this order reorders
  // regardless of the starting position -- leaves clusters, nodes, edgePaths, edgeLabels: an
  // arrow now paints above the boxes it crosses, and its count badge above the arrow. Shared
  // here rather than duplicated at each render call site below, since the zoom overlay's
  // cloneNode(true) runs later and inherits whatever order this leaves.
  function reorderEdgeLayers(el) {
    const root = el.querySelector('svg g.root');
    if (!root) return;
    const nodes = root.querySelector(':scope > g.nodes');
    const edgePaths = root.querySelector(':scope > g.edgePaths');
    const edgeLabels = root.querySelector(':scope > g.edgeLabels');
    if (nodes) root.appendChild(nodes);
    if (edgePaths) root.appendChild(edgePaths);
    if (edgeLabels) root.appendChild(edgeLabels);
  }

  let flowSeq = 0;
  for (const el of document.querySelectorAll('.mermaid:not([data-level])')) {
    try {
      const { svg } = await mermaid.render('vd-flow-' + (flowSeq++), el.textContent, el);
      el.innerHTML = svg;
      reorderEdgeLayers(el);
    } catch (_) {
      el.textContent = 'Diagram failed to render.';
      el.classList.add('vd-failed');
    }
  }

  // The graph's two levels (sections.py --kind symbols): mermaid.render() measures label
  // sizes against the container it's given, and a `hidden`/display:none container measures
  // everything as 0 and collapses the diagram (measured viewBox "-8 -8 16 16" against a correct
  // "0 0 598.157 494"). Each level is unhidden and moved off-screen -- real layout, just not on
  // screen -- only for the duration of its own render call.
  const root = document.querySelector('.vd-symbols');
  if (!root) return;
  const toggle = root.querySelector('#vd-level-toggle');
  const levels = [...root.querySelectorAll('.mermaid[data-level]')];
  if (!toggle || !levels.length) return;
  let names = [];
  try { names = JSON.parse(toggle.dataset.names || '[]'); } catch (_) { names = []; }
  let level = 1;

  // The label is the level you are on, so the accessible name has to carry both that and what
  // activating does -- a button reading "packages" tells a screen reader nothing on its own.
  function showLevel(n) {
    level = Number(n);
    levels.forEach(el => { el.hidden = el.dataset.level !== String(level); });
    const here = (names[level - 1] || '').toLowerCase();
    const other = (names[level === 1 ? 1 : 0] || '').toLowerCase();
    toggle.textContent = here;
    toggle.setAttribute('aria-label',
      'Detail level: ' + here + '. Activate to show ' + other + '.');
    // The key belongs to the level that draws those nodes, so it travels with the graph
    // rather than sitting in the heading explaining states that are not on screen.
    const stale = toggle.parentNode.querySelector('.vd-legend');
    if (stale) stale.remove();
    const shown = levels.find(el => !el.hidden);
    if (shown && shown.dataset.legend) toggle.insertAdjacentHTML('beforebegin', shown.dataset.legend);
  }
  toggle.addEventListener('click', () => showLevel(level === 1 ? 2 : 1));

  function fail(el, n) {
    el.textContent = (names[n - 1] || ('Level ' + n)) + ' failed to render.';
    el.classList.add('vd-failed');
  }
  // A real diagram never comes out this small -- this is the exact signature of the
  // collapsed-measurement bug this script replaces, so it's treated as a render failure
  // rather than shipped silently.
  function degenerate(svg) {
    const box = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
    return box.length !== 4 || box.some(Number.isNaN) || box[2] < 32 || box[3] < 32;
  }

  async function renderLevel(el) {
    const source = el.textContent;
    const n = el.dataset.level;
    el.hidden = false;
    el.style.position = 'absolute';
    el.style.left = '-99999px';
    try {
      const { svg } = await mermaid.render('vd-level-' + n, source, el);
      el.innerHTML = svg;
      reorderEdgeLayers(el);
      const svgEl = el.querySelector('svg');
      if (!svgEl || degenerate(svgEl)) fail(el, n);
    } catch (_) {
      fail(el, n);
    }
    el.style.position = '';
    el.style.left = '';
    el.hidden = true; // showLevel() below unhides only the level the slider actually wants
  }

  // Sequential, not Promise.all: mermaid.render() carries the same shared id/def bookkeeping as
  // the FLOW run() above, so concurrent in-flight renders here can trip over it just as easily.
  for (const el of levels) await renderLevel(el);
  showLevel(1);
})();
</script>
<script>
(function(){
  const dlg=document.getElementById('mermaid-zoom');
  const zbody=document.getElementById('mermaid-zoom-body');
  // Lets every `.mermaid svg ...` rule reach the clone below, no duplicate rule needed. Added
  // here rather than in the static markup: the FLOW-sweep script above already ran its
  // `.mermaid:not([data-level])` querySelectorAll before this executes, so tagging it only now
  // keeps this element out of that sweep.
  zbody.classList.add('mermaid');
  const zctl=document.getElementById('mermaid-zoom-controls');
  document.getElementById('mermaid-zoom-close').onclick=()=>dlg.close();
  dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });
  // Pan and zoom by rewriting the svg's viewBox: it already carries one, so scaling it needs
  // no library and never rasterises. mode='modal' sizes a clone to fill the full-screen dialog;
  // mode='inline' is the diagram sitting in the page, which must keep scrolling and stay put.
  function panZoom(svg,mode='modal',onChange){
    if(svg.dataset.pzWired) return null; // already wired: wire()'s MutationObserver pass can revisit the same svg
    const box=(svg.getAttribute('viewBox')||'').split(/[\s,]+/).map(Number);
    if(box.length!==4||box.some(Number.isNaN)) return null;
    svg.dataset.pzWired='1';
    const home=box.slice();
    let view=box.slice();
    const apply=()=>{ svg.setAttribute('viewBox',view.join(' ')); if(onChange) onChange(); };
    if(mode==='inline'){
      // Size from the container width and the viewBox ratio, never from a measured pixel
      // width: measuring can capture the svg's overflowed natural size (wider than the panel,
      // the Fit bug) or a pre-layout 0x0 from wire()'s MutationObserver, and pinning to either
      // breaks the diagram. height:auto (not 100%) is what avoids the collapse .svgbox's
      // auto height would otherwise cause.
      svg.removeAttribute('width'); svg.removeAttribute('height');
      svg.style.width='100%'; svg.style.height='auto'; svg.style.aspectRatio=box[2]+'/'+box[3];
      svg.style.touchAction='pan-y';
    } else {
      svg.removeAttribute('width'); svg.removeAttribute('height');
      svg.style.width='100%'; svg.style.height='100%';
      svg.style.touchAction='none';
    }
    const scaleAt=(factor,fx,fy)=>{
      const w=view[2]*factor, h=view[3]*factor;
      if(w<home[2]/40||w>home[2]*40) return false;
      view[0]+=(view[2]-w)*fx; view[1]+=(view[3]-h)*fy;
      view[2]=w; view[3]=h; return true;
    };
    const api={
      zoom:factor=>{ if(scaleAt(factor,.5,.5)) apply(); },
      reset:()=>{ view=home.slice(); apply(); },
    };
    svg.addEventListener('wheel',e=>{
      if(mode==='inline'&&!(e.ctrlKey||e.metaKey)) return; // plain wheel: leave page scroll alone
      e.preventDefault();
      const rect=svg.getBoundingClientRect();
      if(scaleAt(e.deltaY>0?1.15:1/1.15,
        (e.clientX-rect.left)/rect.width,(e.clientY-rect.top)/rect.height)) apply();
    },{passive:false});

    const pts=new Map();
    let drag=null,pinch=null,origin=null,moved=false,suppressClick=false;
    const arr=()=>[...pts.values()];
    const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
    const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
    const beginDrag=(x,y)=>{ drag={x,y,view:view.slice(),rect:svg.getBoundingClientRect()}; };
    // A lone touch pointer's type has to survive into endPointer, so a pinch that drops to one
    // finger can tell whether to resume a manual drag or leave it to touch-action:pan-y below.
    svg.addEventListener('pointerdown',e=>{
      if(mode==='inline'&&e.pointerType==='mouse'&&e.button!==0) return;
      try{ svg.setPointerCapture(e.pointerId); }catch(_){} // no-op if the browser already dropped this pointer
      pts.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
      if(pts.size===1){
        origin={x:e.clientX,y:e.clientY}; moved=false;
        suppressClick=false; // clear a leftover suppression from a drag that ended off-element with no trailing click to consume it
        // inline + a lone touch: leave it to touch-action:pan-y (native page scroll); only
        // mouse/pen drag pans a single pointer here, a second touch still starts a pinch below
        if(mode!=='inline'||e.pointerType!=='touch'){ beginDrag(e.clientX,e.clientY); svg.style.cursor='grabbing'; }
      }
      else if(pts.size===2){ drag=null; const[a,b]=arr(); pinch={d:dist(a,b),mid:mid(a,b)}; }
      if(mode==='inline'&&pts.size>=2) e.preventDefault(); // one finger scrolls the page, a pinch must not
    });
    svg.addEventListener('pointermove',e=>{
      if(!pts.has(e.pointerId)) return;
      pts.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
      if(origin&&Math.hypot(e.clientX-origin.x,e.clientY-origin.y)>4) moved=true;
      if(pts.size>=2&&pinch){
        if(mode==='inline') e.preventDefault();
        const[a,b]=arr(); const d=dist(a,b), m=mid(a,b);
        const rect=svg.getBoundingClientRect();
        scaleAt(pinch.d/d,(m.x-rect.left)/rect.width,(m.y-rect.top)/rect.height);
        view[0]-=(m.x-pinch.mid.x)*view[2]/rect.width;
        view[1]-=(m.y-pinch.mid.y)*view[3]/rect.height;
        apply(); // always, even when scaleAt clamped: the finger-movement pan still has to show
        pinch={d,mid:m};
      } else if(drag){
        view[0]=drag.view[0]-(e.clientX-drag.x)*drag.view[2]/drag.rect.width;
        view[1]=drag.view[1]-(e.clientY-drag.y)*drag.view[3]/drag.rect.height;
        apply();
      }
    });
    const endPointer=e=>{
      pts.delete(e.pointerId);
      if(pts.size===0){
        drag=null; pinch=null; origin=null; svg.style.cursor='grab';
        if(moved) suppressClick=true;
      } else if(pts.size===1){
        pinch=null;
        const[p]=arr();
        // same touch/inline exclusion as pointerdown above: don't fight native page scroll
        if(mode!=='inline'||p.type!=='touch') beginDrag(p.x,p.y); // resume single-pointer drag, no jump
      }
    };
    svg.addEventListener('pointerup',endPointer);
    svg.addEventListener('pointercancel',endPointer);
    // A drag ending over the box still fires a click; swallow it once so panning an inline
    // diagram doesn't also pop the full-screen dialog open.
    svg.addEventListener('click',e=>{ if(suppressClick){ e.stopPropagation(); suppressClick=false; } },true);
    svg.style.cursor='grab';
    return api;
  }
  // The svg actually on screen inside `box`: for a FLOW/coupling/structure box that's its one
  // .mermaid child, for a graph level box (box IS the .mermaid element, one per detail
  // level, siblings hidden by the level script) it's the box's own svg.
  function visibleSvg(box){
    return box.matches('.mermaid')?box.querySelector('svg')
      :box.querySelector('.mermaid:not([hidden]) svg');
  }
  function openZoom(box){
    const svg=visibleSvg(box);
    if(!svg) return;
    const clone=svg.cloneNode(true);
    delete clone.dataset.pzWired; // cloneNode copies the inline svg's own wiring flag too
    zbody.replaceChildren(clone);
    const api=panZoom(clone,'modal');
    zctl.hidden=!api;
    dlg.showModal();
  }
  function wire(box){
    // The click/keydown setup below is one-shot, but mermaid can mutate the box a few times
    // while rendering, so its current svg is re-read fresh every pass; panZoom's own per-svg
    // guard makes re-wiring an already-wired svg a cheap no-op.
    if(!box.dataset.zoomWired&&visibleSvg(box)){
      box.dataset.zoomWired='1';
      box.tabIndex=0;
      box.setAttribute('role','button');
      box.setAttribute('aria-label','Expand diagram to full size');
      box.addEventListener('click',()=>openZoom(box));
      box.addEventListener('keydown',e=>{
        if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openZoom(box); }
      });
    }
    const svg=visibleSvg(box);
    if(!svg||svg.dataset.pzWired) return;
    panZoom(svg,'inline');
  }
  function wireAll(){
    document.querySelectorAll('.svgbox, .vd-symbols .mermaid').forEach(wire);
  }
  // mermaid renders asynchronously after startOnLoad, so watch for the svg to
  // appear instead of assuming it exists when this script runs.
  new MutationObserver(wireAll).observe(document.getElementById('plan-content'),{childList:true,subtree:true});
  wireAll();
})();
</script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const list=$('fb-list');
  const comments=new Map(); // cid -> {span,path,num,side,text,note,order}
  let cidSeq=0;

  function parseHeader(text){
    const m=/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(text);
    return m?{oldStart:+m[1],newStart:+m[2]}:null;
  }

  function removeAdjacent(span){
    const n=span.nextElementSibling;
    if(n&&(n.classList.contains('dline-edit')||n.classList.contains('dline-comment'))) n.remove();
  }

  function renderPanel(){
    const items=[...comments.values()].sort((a,b)=>a.order-b.order);
    $('fb-count').textContent=items.length;
    $('fb-panel-count').textContent='('+items.length+')';
    $('fb-toggle').hidden = items.length === 0;
    list.innerHTML='';
    items.forEach(c=>{
      const d=document.createElement('div'); d.className='fb-item';
      const del=document.createElement('button'); del.className='del-btn'; del.textContent='×';
      del.setAttribute('aria-label','Remove comment');
      del.onclick=()=>removeComment(c.cid);
      d.appendChild(del);
      const s=document.createElement('span'); s.className='s';
      s.textContent=c.path+':'+c.num+' '+c.side; d.appendChild(s);
      const q=document.createElement('span'); q.className='q'; q.textContent=c.text; d.appendChild(q);
      d.appendChild(document.createTextNode(c.note));
      list.appendChild(d);
    });
    document.body.classList.toggle('panel-open', items.length > 0);
  }

  function removeComment(cid){
    const c=comments.get(cid);
    if(!c) return;
    comments.delete(cid);
    c.span.classList.remove('has-comment');
    removeAdjacent(c.span);
    renderPanel();
    c.span.focus();
  }

  function showComment(cid){
    const c=comments.get(cid);
    removeAdjacent(c.span);
    c.span.classList.add('has-comment');
    const row=document.createElement('div'); row.className='dline-comment fb-item';
    const note=document.createElement('span'); note.textContent=c.note;
    const edit=document.createElement('button'); edit.type='button'; edit.className='fb-ghost';
    edit.textContent='Edit'; edit.onclick=()=>openEditor(c.span,c.path,c.num,c.side,c.text,cid,c.order);
    const del=document.createElement('button'); del.type='button'; del.className='del-btn';
    del.textContent='×'; del.setAttribute('aria-label','Remove comment'); del.onclick=()=>removeComment(cid);
    row.append(note,edit,del);
    c.span.insertAdjacentElement('afterend',row);
  }

  function openEditor(span,path,num,side,text,cid,order){
    removeAdjacent(span);
    const existing=comments.get(cid);
    const row=document.createElement('div'); row.className='dline-edit';
    const ta=document.createElement('textarea'); ta.placeholder='Comment on this line...';
    ta.value=existing?existing.note:'';
    const actions=document.createElement('div'); actions.className='fb-actions';
    const save=document.createElement('button'); save.type='button'; save.className='fb-primary'; save.textContent='Save';
    const cancel=document.createElement('button'); cancel.type='button'; cancel.className='fb-ghost'; cancel.textContent='Cancel';
    save.onclick=()=>{
      const note=ta.value.trim();
      row.remove();
      if(!note){ if(existing) showComment(cid); return; }
      comments.set(cid,{span,path,num,side,text,note,order,cid});
      showComment(cid);
      renderPanel();
    };
    cancel.onclick=()=>{ row.remove(); if(existing) showComment(cid); span.focus(); };
    actions.append(save,cancel); row.append(ta,actions);
    span.insertAdjacentElement('afterend',row);
    ta.focus();
  }

  function wireLine(span,path,num,side,order){
    const text=span.textContent; // capture verbatim (incl. leading +/-/space) before the badge changes it
    const cid='c'+(++cidSeq);
    span.classList.add('dline');
    span.tabIndex=0;
    span.setAttribute('role','button');
    span.setAttribute('aria-label','Comment on '+path+':'+num+' ('+side+')');
    const badge=document.createElement('span'); badge.className='dline-num';
    badge.textContent=num; badge.setAttribute('aria-hidden','true');
    span.insertBefore(badge,span.firstChild);
    // order is the line's position in the document, fixed at wiring time, so the copy output
    // and panel stay in page order regardless of the order comments were actually saved in.
    const open=()=>openEditor(span,path,num,side,text,cid,order);
    span.addEventListener('click',open);
    span.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } });
  }

  function wireHunk(pre){
    const details=pre.closest('details.hunk');
    const pathEl=details&&details.querySelector('.hunk-path');
    const path=pathEl?pathEl.textContent.trim():'';
    const header=pre.querySelector('span.h');
    const parsed=header&&parseHeader(header.textContent);
    if(!parsed) return; // header didn't parse: leave this hunk's lines uncommentable rather than numbering them wrongly
    let oldN=parsed.oldStart, newN=parsed.newStart;
    for(const span of [...pre.children]){
      // GitHub anchors a comment to one side of the diff: added/context lines are the new
      // file (RIGHT, numbered off newStart), removed lines are the old file (LEFT, off oldStart).
      if(span.classList.contains('c')){ wireLine(span,path,newN,'RIGHT',docOrder++); oldN++; newN++; }
      else if(span.classList.contains('a')){ wireLine(span,path,newN,'RIGHT',docOrder++); newN++; }
      else if(span.classList.contains('d')){ wireLine(span,path,oldN,'LEFT',docOrder++); oldN++; }
    }
  }

  let docOrder=0;
  document.querySelectorAll('pre.diff').forEach(wireHunk);

  $('fb-toggle').onclick=()=>{ document.body.classList.toggle('panel-open'); };
  $('fb-copy').onclick=()=>{
    const items=[...comments.values()].sort((a,b)=>a.order-b.order);
    const lines=['## Diff notes ('+items.length+')',''];
    items.forEach((c,i)=>{
      let t=c.text;
      if(t.length>160) t=t.slice(0,160)+'…';
      lines.push((i+1)+'. '+c.path+':'+c.num+' '+c.side);
      lines.push('   line: '+t);
      lines.push('   note: '+c.note);
      if(i<items.length-1) lines.push('');
    });
    if(items.length===0) lines.push('(no comments, diff looks fine)');
    const out=lines.join('\n');
    const done=()=>{ const c=$('fb-copy'); c.textContent='Copied - paste into Claude'; c.classList.add('copied');
      setTimeout(()=>{ c.textContent='Copy notes for Claude'; c.classList.remove('copied'); },2500); };
    // Manual fallback: preselected textarea, user hits Ctrl+C. Guaranteed to
    // work when both clipboard APIs are blocked (common on file:// pages).
    const manual=()=>{ let m=$('fb-manual');
      if(!m){ m=document.createElement('div'); m.id='fb-manual';
        m.style.cssText='position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center';
        const inner=document.createElement('div');
        inner.style.cssText='background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;width:min(560px,90vw)';
        const lbl=document.createElement('div');
        lbl.textContent='Clipboard blocked by the browser - press Ctrl+C, then close:';
        lbl.style.cssText='font-size:var(--fs-sm);margin-bottom:8px;color:var(--muted)';
        const ta=document.createElement('textarea'); ta.id='fb-manual-text';
        ta.style.cssText='width:100%;min-height:220px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;font-family:var(--mono);font-size:var(--fs-code);line-height:1.5';
        const close=document.createElement('button'); close.textContent='Close';
        close.style.cssText='margin-top:8px;border:none;border-radius:6px;padding:6px 12px;font:600 var(--fs-xs) system-ui;cursor:pointer;background:var(--panel2);color:var(--muted)';
        close.onclick=()=>m.remove();
        inner.append(lbl,ta,close); m.appendChild(inner); document.body.appendChild(m);
        m.addEventListener('keydown',e=>{ if(e.key==='Escape') m.remove(); }); }
      const ta=$('fb-manual-text'); ta.value=out; ta.focus(); ta.select(); };
    const legacy=()=>{ const t=document.createElement('textarea'); t.value=out;
      t.style.cssText='position:fixed;top:0;left:0;opacity:0'; // display:none breaks select()
      document.body.appendChild(t); t.focus(); t.select();
      let ok=false; try{ ok=document.execCommand('copy'); }catch(_){ ok=false; }
      t.remove(); ok?done():manual(); };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      // .then(done, legacy): a rejected write (file:// NotAllowedError,
      // unfocused document) must fall through, not die silently.
      navigator.clipboard.writeText(out).then(done,legacy);
    } else { legacy(); }
  };
})();
</script>
<script>
// A click on the file's PR link must not also open or close the block. Toggling is the
// summary's own doing, so stopping the event on the link keeps the summary from ever seeing
// it; the link's navigation is its default action and still happens. Bound on each anchor
// rather than delegated: a delegated listener only fires after the summary already acted.
document.querySelectorAll('summary a').forEach(a => {
  a.addEventListener('click', e => e.stopPropagation());
});
</script>
<script>
// Per-hunk explanations, on by default, from the one toggle in the Walkthrough heading. The
// file role lines are not affected -- see the body:not(.show-notes) rule in the stylesheet.
// Persisted so a reader who turned the prose off keeps it off across the next recap they open;
// file:// and a sandboxed share host both throw on localStorage, hence the try/catch on every
// access. Read against an explicit '0' rather than a truthy '1', so a reader who has never
// touched it gets the on default instead of whatever a missing key coerces to.
(function(){
  const KEY='vd-show-notes';
  const btn=document.getElementById('wt-notes-toggle');
  if(!btn) return;

  // A file's hunks are separate <pre> blocks only so a note can sit between them. Where no
  // note actually sits between two of them, a framed panel each, with its own sideways
  // scroll, is worse to read than the single block GitHub shows: so consecutive hunks with
  // nothing between them are merged into the first of the run, and a run breaks only at a
  // note the reader can currently see. With the notes off that is every hunk in the file.
  // Safe for the per-line commenting: that is wired per span, by the script above this one,
  // so a span carries its handler and its recorded identity along with it.
  const files=[...document.querySelectorAll('details.hunk')]
    .map(d=>[...d.querySelectorAll('pre.diff')]).filter(pres=>pres.length>1);
  // Which <pre> each line goes back to. Comment rows the reader adds later have no mark and
  // follow whichever line they were attached to.
  files.forEach(pres=>pres.forEach((pre,i)=>{
    for(const el of pre.children) el.dataset.h=i;
  }));
  const splitAll=()=>files.forEach(pres=>{
    for(const pre of pres){
      for(const sep of [...pre.querySelectorAll('[data-sep]')]) sep.remove();
    }
    for(const pre of pres){
      let i=null;
      for(const node of [...pre.childNodes]){
        if(node.dataset&&node.dataset.h!==undefined) i=+node.dataset.h;
        // Appended in document order, and a node already home is left alone, so visiting a
        // <pre> that just received lines from an earlier one is a no-op rather than a shuffle.
        if(i!==null&&pres[i]!==pre) pres[i].appendChild(node);
      }
    }
    for(const pre of pres) pre.hidden=false;
  });
  const mergeRuns=notesOn=>files.forEach(pres=>{
    let lead=pres[0];
    for(let i=1;i<pres.length;i++){
      const before=pres[i].previousElementSibling;
      if(notesOn&&before&&before.classList.contains('hunk-note-hunk')){ lead=pres[i]; continue; }
      // The block ends on its last line with no trailing newline, so without this the next
      // hunk's @@ header lands on the end of that line. Two newlines, not one: the blank line
      // is what makes the header read as the start of a new hunk rather than another line of
      // the previous one.
      const sep=document.createElement('span');
      sep.dataset.sep='1'; sep.textContent='\n\n';
      lead.appendChild(sep);
      while(pres[i].firstChild) lead.appendChild(pres[i].firstChild);
      pres[i].hidden=true;
    }
  });

  let on=true;
  try{ on = localStorage.getItem(KEY) !== '0'; }catch(e){}
  const apply=()=>{
    document.body.classList.toggle('show-notes',on);
    btn.textContent = on ? 'explanations' : 'no explanations';
    btn.setAttribute('aria-label', on
      ? 'Explanations shown. Activate to hide them.'
      : 'Explanations hidden. Activate to show them.');
    splitAll();
    mergeRuns(on);
    try{ localStorage.setItem(KEY,on?'1':'0'); }catch(e){}
  };
  btn.addEventListener('click',()=>{ on=!on; apply(); });
  apply();
})();
</script>
</body>
