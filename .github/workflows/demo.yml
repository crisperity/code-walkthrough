name: demo

on:
  push:
    branches: [main]
    paths:
      - "skills/code-walkthrough/**"
      - "docs/demo/**"
      - ".github/workflows/demo.yml"
  pull_request:
    paths:
      - "skills/code-walkthrough/**"
      - "docs/demo/**"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - run: docs/demo/build.sh site

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
